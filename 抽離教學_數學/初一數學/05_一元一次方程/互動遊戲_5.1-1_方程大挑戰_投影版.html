<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方程大挑戰｜投影版</title>
<style>
/* 視覺語言對齊 簡報_5.1-1_方程與方程的解：深綠封面、鼠尾草綠卡片、綠點標題；
   遊戲元件沿用 4.2 投影版。尺寸單位 --u＝min(1vh, .75vw)，16:9 與 4:3 都放得下。 */
:root{
  --u:min(1vh,.75vw);
  --ink:#202a26; --muted:#4e5c55; --head:#2e4a40;
  --bg1:#c9dcd0; --bg2:#f1f4f1;
  --bar:#dce6df; --bar-edge:#5e8574;
  --s0:#3b78d8; --s1:#1f9e9a; --s2:#43a047; --s3:#ef8a22;
  --l0:#3b6fd4; --l1:#b0407e; --l2:#c7731e;
  --pill:#3f6656; --pill-hi:#55806d; --pill-edge:#253f33;
  --ok:#2e7d45; --ok-bg:#e1f2e3; --ok-edge:#4caf68;
  --bad:#c62828; --bad-edge:#e05656;
  --callout:#ffe264; --cream:#fff6d8; --cream-edge:#d9a43a;
  --line:#b5c8bb;
  --t0:#e5483b; --t1:#3b78d8; --t2:#2f9e55; --t3:#e0a100;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-weight:700;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif}
body{background:
    radial-gradient(circle,rgba(255,255,255,.5) .25vh,transparent .3vh) 0 0/3.4vh 3.4vh,
    linear-gradient(180deg,var(--bg1) 0%,#dfeae3 45%,var(--bg2) 100%)}
.m{white-space:nowrap;font-weight:700}
.m i{font-style:italic;padding-right:.1em}
.m sup{font-size:.66em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.12;margin:0 .1em}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .2em}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(1.8*var(--u)) calc(3*var(--u))}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;font-weight:900}
.title{color:var(--head);font-weight:900;margin:0}

/* ---------- 封面＋設定（簡報第 1 頁） ---------- */
#home{align-items:center;justify-content:center;text-align:center;gap:calc(2.2*var(--u));color:#f2f7f4;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 6vh,transparent 6vh 12vh),
    repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 .4vh,transparent .4vh 6vh),
    #34493f}
#home .eyebrow{position:absolute;top:calc(2.4*var(--u));left:calc(3*var(--u));font-size:calc(2.6*var(--u));font-weight:400;margin:0;color:#c9d6ce}
#home h1{font-size:calc(11*var(--u));margin:0;letter-spacing:.06em;font-weight:900;text-shadow:0 .6vh 0 #1a2420;line-height:1.1}
.pill{display:inline-block;background:#f2f7f4;color:var(--head);border-radius:999px;
  padding:calc(1.2*var(--u)) calc(4*var(--u));font-size:calc(3.6*var(--u));font-weight:900;box-shadow:0 .7vh 0 #9fb5a8}
.routes{display:flex;gap:calc(1.4*var(--u));margin-top:calc(.6*var(--u))}
.routes div{background:rgba(255,255,255,.08);border:.3vh solid rgba(255,255,255,.25);border-radius:1.4vh;padding:calc(.8*var(--u)) calc(1.4*var(--u));
  font-size:calc(2.5*var(--u))}
.routes b{display:inline-flex;width:calc(4*var(--u));height:calc(4*var(--u));border-radius:50%;align-items:center;justify-content:center;margin-right:.5em}
.lv0{background:var(--l0)}.lv1{background:var(--l1)}.lv2{background:var(--l2)}
.setrow{display:flex;gap:calc(1.4*var(--u));align-items:center;justify-content:center;font-size:calc(3*var(--u))}
.setrow span{min-width:8em;text-align:right;opacity:.85}
.seg{display:flex;border:.4vh solid #f2f7f4;border-radius:1.4vh;overflow:hidden}
.seg button{border:0;background:transparent;color:#f2f7f4;font-size:calc(2.8*var(--u));padding:calc(1*var(--u)) calc(2*var(--u))}
.seg button.on{background:#f2f7f4;color:#34493f}
.big{font-size:calc(4*var(--u));border:0;border-radius:999px;color:#fff;padding:calc(1.6*var(--u)) calc(6*var(--u));
  background:linear-gradient(180deg,#e9734d,#d4552c);box-shadow:0 .7vh 0 #9c3a1a}
.big:active{transform:translateY(.4vh);box-shadow:0 .3vh 0 #9c3a1a}
.big.ghost{background:#fff;color:var(--head);box-shadow:0 .7vh 0 var(--bar-edge)}
.keys{font-size:calc(2.2*var(--u));opacity:.85;font-weight:400}
kbd{border:.2vh solid rgba(255,255,255,.6);border-bottom-width:.5vh;border-radius:.8vh;padding:0 .45em;font-family:inherit;font-weight:700}

/* ---------- 遊戲畫面 ---------- */
.top{display:flex;align-items:center;gap:calc(1.4*var(--u));height:calc(9*var(--u));flex:none}
.bar{background:linear-gradient(180deg,#eef4f0,var(--bar));border:.4vh solid var(--bar-edge);border-radius:1.6vh;
  padding:calc(.7*var(--u)) calc(1.2*var(--u));display:flex;align-items:center;gap:calc(.6*var(--u));font-size:calc(2.8*var(--u));white-space:nowrap}
.bar .st{padding:.1em .45em;border-radius:1vh;border:.35vh solid transparent;color:var(--muted)}
.bar .st.on{color:var(--ink);border-color:#f3c623;background:#fff8cf;box-shadow:0 0 0 .5vh rgba(243,198,35,.35)}
.bar .ar{color:var(--muted)}
.prog{font-size:calc(3*var(--u));white-space:nowrap;color:var(--head)}
.prog small{font-size:.75em;color:var(--muted);margin-left:.4em}
.teams{display:flex;gap:calc(.8*var(--u));margin-left:auto}
.team{border:0;border-radius:1.4vh;color:#fff;font-size:calc(2.4*var(--u));padding:calc(.4*var(--u)) calc(1.2*var(--u));min-width:calc(9.5*var(--u));
  display:flex;flex-direction:column;align-items:center;line-height:1.1;position:relative;box-shadow:0 .6vh 0 rgba(0,0,0,.28)}
.team b{font-size:calc(4.2*var(--u));font-variant-numeric:tabular-nums}
.team.pop::after{content:"+10";position:absolute;top:-1vh;right:-.6vw;background:#fff;color:var(--ink);
  border-radius:1vh;font-size:calc(2.4*var(--u));padding:0 .4em;animation:up .7s forwards}
@keyframes up{to{transform:translateY(-3vh);opacity:0}}
.t0{background:var(--t0)}.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}
.clock{font-size:calc(3.4*var(--u));font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--head)}
.clock.low{color:var(--bad)}

.chev{display:flex;gap:.3vh;margin-top:calc(1*var(--u));flex:none}
.chev span{flex:1 1 auto;color:#fff;font-size:calc(2.4*var(--u));padding:calc(.7*var(--u)) calc(2.2*var(--u)) calc(.7*var(--u)) calc(2.8*var(--u));white-space:nowrap;
  clip-path:polygon(0 0,calc(100% - 1.6vh) 0,100% 50%,calc(100% - 1.6vh) 100%,0 100%,1.6vh 50%);text-align:center;overflow:hidden;text-overflow:ellipsis}
.chev span:first-child{clip-path:polygon(0 0,calc(100% - 1.6vh) 0,100% 50%,calc(100% - 1.6vh) 100%,0 100%);padding-left:calc(1.6*var(--u))}
.chev b{font-size:1.25em;margin-right:.35em}
.chev small{font-size:.9em;font-weight:700;opacity:.95}
.k0{background:var(--s0)}.k1{background:var(--s1)}.k2{background:var(--s2)}.k3{background:var(--s3)}

.rule{flex:none;background:var(--cream);border:.4vh solid var(--cream-edge);border-radius:1.6vh;padding:calc(.8*var(--u)) calc(1.6*var(--u));
  margin-top:calc(1*var(--u));font-size:calc(2.8*var(--u));line-height:1.45}

.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.ask{font-size:calc(3.4*var(--u));color:var(--muted);text-align:center;margin:0 0 calc(.6*var(--u))}
.q{font-size:calc(6.4*var(--u));line-height:1.3;text-align:center;margin:0 0 calc(2*var(--u))}
.q.mid{font-size:calc(5*var(--u))}
.q.long{font-size:calc(4.2*var(--u));line-height:1.45;text-align:left;max-width:92%;margin:0 auto calc(1.6*var(--u))}
.how{font-size:calc(2.8*var(--u));color:var(--muted);text-align:center;margin:0 0 calc(1.6*var(--u))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(1.6*var(--u)) calc(2*var(--u))}
.opt{background:#fff;border:.6vh solid var(--line);border-radius:2vh;min-height:calc(11*var(--u));display:flex;align-items:center;
  gap:calc(1.4*var(--u));padding:calc(.8*var(--u)) calc(2*var(--u));font-size:calc(5.2*var(--u));box-shadow:0 .7vh 0 var(--line);transition:opacity .2s}
.opt .n{flex:none;width:calc(7*var(--u));height:calc(7*var(--u));border-radius:50%;background:var(--head);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:calc(4.2*var(--u));font-weight:900}
.opt .v{flex:1;text-align:center;white-space:nowrap}
.opts.long .opt{font-size:calc(4.2*var(--u))}
.opt.yes{border-color:var(--ok-edge);box-shadow:0 .7vh 0 var(--ok-edge);color:var(--ok)}
.opt.no{border-color:var(--bad-edge);box-shadow:0 .7vh 0 var(--bad-edge);color:var(--bad)}
.opt.yes .n{background:var(--ok)}.opt.no .n{background:var(--bad)}
.revealed .opt{opacity:.25}
.revealed .opt.ok{opacity:1;border-color:var(--ok-edge);background:var(--ok-bg);box-shadow:0 .7vh 0 var(--ok)}
.revealed .opt.ok .n{background:var(--ok)}
.why{font-size:calc(3.3*var(--u));line-height:1.55;background:var(--callout);border:.45vh solid #2a2a2a;border-radius:1.8vh;
  padding:calc(1*var(--u)) calc(2*var(--u));margin-top:calc(2*var(--u));box-shadow:0 .6vh 0 rgba(0,0,0,.2)}
.chip{display:inline-block;color:#fff;border-radius:.8vh;padding:0 .3em;margin:0 .1em;font-size:.92em;line-height:1.4}
.chip.c0{background:var(--s0)}.chip.c1{background:var(--s1)}.chip.c2{background:var(--s2)}.chip.c3{background:var(--s3)}

.bottom{height:calc(9*var(--u));display:flex;align-items:center;gap:calc(1.6*var(--u));flex:none}
.cd{flex:1;height:calc(2.6*var(--u));background:rgba(255,255,255,.8);border:.3vh solid var(--bar-edge);border-radius:1.5vh;overflow:hidden}
.cd>div{height:100%;background:var(--bar-edge);width:100%}
.cd.end>div{background:var(--bad)}
.cdnum{font-size:calc(4.4*var(--u));width:calc(7*var(--u));text-align:center;font-variant-numeric:tabular-nums;color:var(--head)}
.act{font-size:calc(3*var(--u));padding:calc(1.2*var(--u)) calc(3*var(--u));border-radius:999px;border:0;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,var(--pill-hi),var(--pill));box-shadow:0 .6vh 0 var(--pill-edge)}
.tip{font-size:calc(2.4*var(--u));color:var(--muted);white-space:nowrap}

/* ---------- 結算 ---------- */
#end{align-items:center;justify-content:center;text-align:center;gap:calc(2.6*var(--u))}
#end h1{font-size:calc(8*var(--u))}
.podium{display:flex;gap:calc(2.6*var(--u));align-items:flex-end;justify-content:center}
.pcol{display:flex;flex-direction:column;align-items:center;gap:calc(.8*var(--u));font-size:calc(3.4*var(--u));color:var(--head)}
.pbar{width:calc(18*var(--u));border-radius:1.6vh 1.6vh 0 0;color:#fff;display:flex;align-items:flex-start;justify-content:center;
  padding-top:calc(1.2*var(--u));font-size:calc(5.6*var(--u));font-weight:900;box-shadow:inset 0 -1vh 0 rgba(0,0,0,.18)}
.endmust{background:#34493f;color:#f2f7f4;border-radius:1.6vh;padding:calc(1.2*var(--u)) calc(3*var(--u));font-size:calc(3*var(--u));line-height:1.5}
.endmust small{display:block;color:#c9d6ce;font-size:.8em}
.endbtns{display:flex;gap:calc(2.4*var(--u))}
</style>
</head>
<body>

<!-- 封面＋設定 -->
<section class="screen" id="home">
  <p class="eyebrow">第五章 一元一次方程　5.1 方程（第 1 課時）</p>
  <h1>方程大挑戰</h1>
  <span class="pill">用「＝」把兩邊連起來</span>
  <div class="routes" id="routes"></div>
  <div class="setrow"><span>隊伍數目</span><div class="seg" id="setTeams"></div></div>
  <div class="setrow"><span>題目</span><div class="seg" id="setLen"></div></div>
  <div class="setrow"><span>每題思考時間</span><div class="seg" id="setSec"></div></div>
  <div style="display:flex;gap:2vw">
    <button class="big" id="go">開始（Space）</button>
    <button class="big ghost" id="fs">全螢幕（F）</button>
  </div>
  <div class="keys"><kbd>Space</kbd> 揭曉／下一題　<kbd>1</kbd>–<kbd>4</kbd> 該隊 +10（或點隊伍分數）　<kbd>Shift</kbd>＋數字 扣 10　<kbd>←</kbd> 上一題</div>
</section>

<!-- 遊戲畫面 -->
<section class="screen hidden" id="game">
  <div class="top">
    <div class="bar" id="bar"></div>
    <div class="prog" id="prog"></div>
    <div class="teams" id="teams"></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="chev" id="chev"></div>
  <div class="rule hidden" id="rule"></div>
  <div class="qwrap" id="qwrap">
    <p class="ask hidden" id="ask"></p>
    <p class="q" id="q"></p>
    <p class="how" id="how"></p>
    <div class="opts" id="opts"></div>
    <div class="why hidden" id="why"></div>
  </div>
  <div class="bottom">
    <div class="cdnum" id="cdnum"></div>
    <div class="cd" id="cd"><div id="cdbar"></div></div>
    <span class="tip" id="tip"></span>
    <button class="act" id="act"></button>
  </div>
</section>

<!-- 結算 -->
<section class="screen hidden" id="end">
  <h1 class="title">🏆 最終成績</h1>
  <div class="podium" id="podium"></div>
  <div class="endmust"><small>最少要能說出：</small>檢驗一個數是不是解：代入，左邊算一次，右邊算一次，再比較。</div>
  <div class="endbtns">
    <button class="big" id="again">再玩一次</button>
    <button class="big ghost" id="back">回到設定</button>
  </div>
</section>

<script>
// ---------- 題庫：由 build_game_5.1-1.py 注入（與手機版、講義紀錄表同一套；選項次序已定死）----------
const LEVELS=/*BANK*/[
 {
  "key": "方程與一元一次方程",
  "short": "判斷",
  "sec": "對應練習第 1、6 題",
  "steps": [
   "等號",
   "未知數",
   "一元",
   "一次"
  ],
  "tips": [
   "有沒有「＝」？",
   "有沒有字母？",
   "只有一個未知數？",
   "次數是 1？"
  ],
  "rule": "方程：含有未知數的等式。一元一次方程：只有一個未知數，次數是 1，分母沒有未知數。",
  "qs": [
   {
    "id": "1a",
    "num": 1,
    "t": "yn",
    "core": 1,
    "ask": "是不是方程？",
    "q": "$2x+1=7$",
    "a": "是",
    "opts": [
     "是",
     "不是"
    ],
    "why": "[[等號]] 有「＝」；[[未知數]] 有 $x$。含有未知數的等式，就是方程。"
   },
   {
    "id": "1b",
    "num": 2,
    "t": "yn",
    "core": 1,
    "ask": "是不是方程？",
    "q": "$3+4=7$",
    "a": "不是",
    "opts": [
     "是",
     "不是"
    ],
    "why": "[[等號]] 有「＝」，但 [[未知數]] 沒有字母。它只是等式，不是方程。"
   },
   {
    "id": "1c",
    "num": 3,
    "t": "yn",
    "core": 1,
    "ask": "是不是方程？",
    "q": "$5x-2$",
    "a": "不是",
    "opts": [
     "是",
     "不是"
    ],
    "why": "[[等號]] 沒有「＝」。它只是代數式，不是方程。"
   },
   {
    "id": "1d",
    "num": 4,
    "t": "yn",
    "core": 1,
    "ask": "是不是一元一次方程？",
    "q": "$x+y=10$",
    "a": "不是",
    "opts": [
     "是",
     "不是"
    ],
    "why": "它是方程，但 [[一元]] 有 $x$、$y$ 兩個未知數，不是只有一個。"
   },
   {
    "id": "1e",
    "num": 5,
    "t": "yn",
    "core": 1,
    "ask": "是不是一元一次方程？",
    "q": "$x^2=9$",
    "a": "不是",
    "opts": [
     "是",
     "不是"
    ],
    "why": "它是方程，但 [[一次]] $x$ 的次數是 2，不是 1。"
   },
   {
    "id": "1f",
    "num": 6,
    "t": "yn",
    "ask": "是不是一元一次方程？",
    "q": "$F(x,3)=4$",
    "a": "是",
    "opts": [
     "是",
     "不是"
    ],
    "why": "[[一元]] 只有 $x$；[[一次]] 次數是 1；分母是 3，沒有未知數。所以是一元一次方程。"
   },
   {
    "id": "1g",
    "num": 7,
    "t": "yn",
    "ask": "這句話對不對？",
    "q": "等式都是方程。",
    "a": "不對",
    "opts": [
     "對",
     "不對"
    ],
    "why": "$3+4=7$ 是等式，但沒有未知數，不是方程。方程一定是等式；等式不一定是方程。"
   }
  ]
 },
 {
  "key": "列方程",
  "short": "列方程",
  "sec": "對應練習第 2、4 題",
  "steps": [
   "找",
   "設",
   "表示",
   "列"
  ],
  "tips": [
   "找相等關係",
   "設未知數",
   "用 $x$ 表示其他量",
   "兩邊各寫一個式子"
  ],
  "rule": "比……多：＋　比……少：−　是……的 3 倍：×3　等於、一樣多：＝。比 $x$ 少 5 是 $x-5$，不是 $5-x$。",
  "qs": [
   {
    "id": "2a",
    "num": 8,
    "t": "mc",
    "core": 1,
    "q": "$x$ 的 3 倍加上 4 等於 19。",
    "a": "$3x+4=19$",
    "opts": [
     "$4x+3=19$",
     "$3(x+4)=19$",
     "$3x+4=19$",
     "$x+3+4=19$"
    ],
    "why": "[[列]] 「$x$ 的 3 倍」是 $3x$，「加上 4」是 $+4$，「等於」寫＝。先乘 3 再加 4，不用括號。"
   },
   {
    "id": "2b",
    "num": 9,
    "t": "mc",
    "core": 1,
    "q": "比 $x$ 少 5 的數等於 12。",
    "a": "$x-5=12$",
    "opts": [
     "$x+5=12$",
     "$5-x=12$",
     "$5x=12$",
     "$x-5=12$"
    ],
    "why": "「比 $x$ 少 5」是由 $x$ 減去 5：$x-5$。$5-x$ 次序反了。"
   },
   {
    "id": "2c",
    "num": 10,
    "t": "mc",
    "q": "$x$ 的一半等於 $x$ 減 6。",
    "a": "$F(x,2)=x-6$",
    "opts": [
     "$F(x,2)=x-6$",
     "$F(x,2)-6=x$",
     "$F(x,2)=6-x$",
     "$2x=x-6$"
    ],
    "why": "「一半」是除以 2：$F(x,2)$。「$x$ 減 6」是 $x-6$，次序不能反。"
   },
   {
    "id": "2d",
    "num": 11,
    "t": "mc",
    "core": 1,
    "q": "甲種筆每枝 3 元，乙種筆每枝 5 元。用 46 元買了兩種筆共 12 枝。設甲種筆買了 $x$ 枝。",
    "a": "$3x+5(12-x)=46$",

const TEAM_NAMES=['紅隊','藍隊','綠隊','黃隊'];
const TOTAL_TIME=300;

// ---------- 數學式：字母斜體、^n／^{…} 上標、F(p,q) 分數、真減號 ----------
function fmt(s){
  const fr=[];
  s=s.replace(/F\(([^,()]+),([^()]+)\)/g,(_,p,q)=>{fr.push([p,q]);return '@'+(fr.length-1)+'@';});
  let out='',i=0;
  const plain=()=>out.replace(/<[^>]+>/g,'').trimEnd();
  while(i<s.length){
    const ch=s[i];
    if(ch==='@'){const j=s.indexOf('@',i+1);out+=s.slice(i,j+1);i=j+1;continue;}
    if(ch==='^'){
      if(s[i+1]==='{'){const j=s.indexOf('}',i);out+='<sup>'+s.slice(i+2,j).replace(/[a-z]/g,'<i>$&</i>').replace(/-/g,'−')+'</sup>';i=j+1;continue;}
      let d='';i++;while(i<s.length&&/\d/.test(s[i])){d+=s[i];i++;}out+='<sup>'+d+'</sup>';continue;}
    if(/[a-z]/.test(ch)) out+='<i>'+ch+'</i>';
    else if(ch==='-'||ch==='+'){const p=plain();const un=p===''||/[(\[=×]$/.test(p);out+=un?(ch==='-'?'−':'+'):(ch==='-'?' − ':' + ');}
    else if(ch==='='||ch==='×') out+=' '+ch+' ';
    else out+=ch;
    i++;
  }
  return out.trim().replace(/@(\d+)@/g,(_,k)=>`<span class="fr"><span>${fmt(fr[k][0])}</span><span>${fmt(fr[k][1])}</span></span>`);
}
function M(t,L){
  t=String(t);
  if(L) t=t.replace(/\[\[(.+?)\]\]/g,(_,s)=>`<span class="chip c${Math.max(0,L.steps.indexOf(s))}">${s}</span>`);
  return t.replace(/\$(.+?)\$/g,(_,e)=>'<span class="m">'+fmt(e)+'</span>');
}
const plainLen=s=>String(s).replace(/[$^{}]|F\(|[(),]/g,'').length;
const $=id=>document.getElementById(id);

// ---------- 設定 ----------
const CFG={teams:2,len:'core',sec:15};
const nCore=LEVELS.reduce((s,l)=>s+l.qs.filter(q=>q.core).length,0), nAll=LEVELS.reduce((s,l)=>s+l.qs.length,0);
function seg(id,key,items){
  const el=$(id);
  el.innerHTML=items.map(([v,t])=>`<button data-v="${v}">${t}</button>`).join('');
  const sync=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(CFG[key])===b.dataset.v));
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{CFG[key]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;sync();});
  sync();
}
seg('setTeams','teams',[[2,'2 隊'],[3,'3 隊'],[4,'4 隊']]);
seg('setLen','len',[['core',`5 分鐘版（${nCore} 題）`],['all',`完整版（${nAll} 題）`]]);
seg('setSec','sec',[[10,'10 秒'],[15,'15 秒'],[20,'20 秒'],[30,'30 秒']]);
$('routes').innerHTML=LEVELS.map((l,i)=>`<div><b class="lv${i}">${i+1}</b>${l.key}</div>`).join('');

// ---------- 狀態 ----------
let S=null;
function show(id){['home','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id));}

function start(){
  const list=[];
  LEVELS.forEach((L,li)=>{
    const qs=L.qs.filter(q=>CFG.len==='all'||q.core);
    qs.forEach((Q,qi)=>list.push({L,li,Q,first:qi===0}));
  });
  if(S)clearInterval(S.cdTimer);
  S={list,i:0,scores:Array(CFG.teams).fill(0),t:TOTAL_TIME,revealed:false,cd:0,cdTimer:null};
  clearInterval(window._clk);
  window._clk=setInterval(()=>{if($('game').classList.contains('hidden'))return;S.t=Math.max(0,S.t-1);drawClock();},1000);
  show('game'); drawTeams(); render();
}
function mmss(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function drawClock(){const c=$('clock');c.textContent='⏱ '+mmss(S.t);c.classList.toggle('low',S.t<=30);}
function drawTeams(){
  $('teams').innerHTML=S.scores.map((s,k)=>`<button class="team t${k}" data-k="${k}" title="點一下 +10；Shift＋點 −10">${TEAM_NAMES[k]}<b>${s}</b></button>`).join('');
  $('teams').querySelectorAll('.team').forEach(b=>b.onclick=e=>addScore(+b.dataset.k,e.shiftKey?-10:10));
}
function addScore(k,d){
  if(!S||k>=S.scores.length)return;
  S.scores[k]=Math.max(0,S.scores[k]+d);
  drawTeams();
  if(d>0){const b=$('teams').children[k];b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
}

function render(){
  const it=S.list[S.i],{L,li,Q}=it;
  S.revealed=false;
  $('bar').innerHTML=LEVELS.map((l,i)=>`<span class="st ${i===li?'on':''}">${l.short}</span>`).join('<span class="ar">→</span>');
  $('prog').innerHTML=`第 ${Q.num} 題<small>（${S.i+1} / ${S.list.length}）</small>`;
  $('chev').innerHTML=L.steps.map((s,k)=>`<span class="k${k}"><b>${s}</b><small>${M(L.tips[k])}</small></span>`).join('');
  $('rule').classList.toggle('hidden',!it.first);
  $('rule').innerHTML=it.first?'💡 '+M(L.rule):'';
  const yn=Q.t==='yn';
  $('ask').classList.toggle('hidden',!Q.ask);
  $('ask').textContent=Q.ask||'';
  const len=plainLen(Q.q);
  $('q').className='q'+(Q.long?' long':(len>16?' mid':''));
  $('q').innerHTML=M(Q.q);
  $('how').innerHTML=yn?`舉手作答：👍 ${Q.opts[0]}　　👎 ${Q.opts[1]}　｜　紀錄表圈下答案`:'舉手指作答：1、2、3 或 4 隻手指　｜　紀錄表圈下號碼';
  const o=$('opts');
  o.className='opts'+((Q.long||Q.opts.some(v=>plainLen(v)>9))?' long':'');
  o.innerHTML=Q.opts.map((v,k)=>{
    const cls=yn?(k===0?'yes':'no'):'';
    const n=yn?(k===0?'👍':'👎'):(k+1);
    return `<div class="opt ${cls} ${v===Q.a?'ok':''}"><span class="n">${n}</span><span class="v">${yn?v:M(v)}</span></div>`;
  }).join('');
  $('qwrap').classList.remove('revealed');
  $('why').classList.add('hidden');
  $('act').textContent='揭曉答案（Space）';
  $('tip').textContent='';
  drawClock(); startCountdown();
}

function startCountdown(){
  clearInterval(S.cdTimer);
  S.cd=CFG.sec;const total=CFG.sec,bar=$('cdbar'),cd=$('cd');
  cd.classList.remove('end');bar.style.transition='none';bar.style.width='100%';
  $('cdnum').textContent=S.cd;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition=`width ${total}s linear`;bar.style.width='0%';}));
  S.cdTimer=setInterval(()=>{
    S.cd--;$('cdnum').textContent=Math.max(0,S.cd);
    if(S.cd<=0){clearInterval(S.cdTimer);cd.classList.add('end');beep();$('cdnum').textContent='⏰';}
  },1000);
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.25);}catch(e){}}

function reveal(){
  if(S.revealed)return;
  S.revealed=true;clearInterval(S.cdTimer);
  const bar=$('cdbar');bar.style.transition='none';bar.style.width=getComputedStyle(bar).width;
  const {Q,L}=S.list[S.i];
  $('qwrap').classList.add('revealed');
  $('why').innerHTML='💬 '+M(Q.why,L);
  $('why').classList.remove('hidden');
  $('act').textContent=S.i===S.list.length-1?'看最終成績（Space）':'下一題（Space）';
  $('tip').textContent='答對的隊伍：點分數或按 1–'+S.scores.length+' 加 10 分';
}
function next(){
  if(!S.revealed){reveal();return;}
  if(S.i<S.list.length-1){S.i++;render();}else finish();
}
function prev(){if(S.i>0){S.i--;render();}}

function finish(){
  clearInterval(S.cdTimer);
  const max=Math.max(10,...S.scores);
  const order=S.scores.map((s,k)=>({s,k})).sort((a,b)=>b.s-a.s);
  const medals=['🥇','🥈','🥉','　'];
  let rank=0;
  $('podium').innerHTML=order.map((x,idx)=>{
    if(idx>0&&x.s<order[idx-1].s)rank=idx;
    return `<div class="pcol"><span style="font-size:calc(6*var(--u))">${medals[rank]}</span>
      <div class="pbar t${x.k}" style="height:calc(${12+30*x.s/max}*var(--u))">${x.s}</div><span>${TEAM_NAMES[x.k]}</span></div>`;
  }).join('');
  show('end');
}
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}

$('go').onclick=start;$('fs').onclick=toggleFS;
$('act').onclick=next;$('again').onclick=start;$('back').onclick=()=>show('home');

document.addEventListener('keydown',e=>{
  const onHome=!$('home').classList.contains('hidden'),onGame=!$('game').classList.contains('hidden');
  if(e.key==='f'||e.key==='F'){toggleFS();return;}
  if(e.code==='Space'||e.key==='Enter'||e.key==='ArrowRight'||e.key==='PageDown'){
    e.preventDefault();
    if(onHome)start();else if(onGame)next();
    return;
  }
  if(onGame&&(e.key==='ArrowLeft'||e.key==='PageUp')){e.preventDefault();prev();return;}
  if(onGame){
    const map={'1':0,'2':1,'3':2,'4':3,'!':0,'@':1,'#':2,'$':3};
    const code=e.code&&e.code.startsWith('Digit')?+e.code.slice(5)-1:(e.code&&e.code.startsWith('Numpad')?+e.code.slice(6)-1:map[e.key]);
    if(code>=0&&code<4){e.preventDefault();addScore(code,e.shiftKey?-10:10);}
  }
});
</script>
