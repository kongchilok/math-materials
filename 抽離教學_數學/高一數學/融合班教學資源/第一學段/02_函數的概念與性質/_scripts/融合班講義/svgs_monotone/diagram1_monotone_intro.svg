<svg viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft JhengHei, Arial, sans-serif">
  <!-- axes -->
  <line x1="20" y1="140" x2="320" y2="140" stroke="#333" stroke-width="1.5"/>
  <polygon points="320,140 312,136 312,144" fill="#333"/>
  <line x1="170" y1="20" x2="170" y2="220" stroke="#333" stroke-width="1.5"/>
  <polygon points="170,20 166,28 174,28" fill="#333"/>
  <text x="322" y="154" font-size="13" fill="#333">x</text>
  <text x="178" y="26" font-size="13" fill="#333">y</text>

  <!-- turning point dashed guide -->
  <line x1="170" y1="190" x2="170" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- the piecewise curve -->
  <polyline points="65,115 170,190 275,90" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="65" cy="115" r="3" fill="#1a1a1a"/>
  <circle cx="170" cy="190" r="3" fill="#1a1a1a"/>
  <circle cx="275" cy="90" r="3" fill="#1a1a1a"/>

  <!-- labels -->
  <text x="87.5" y="146.5" font-size="14" fill="#1a1a1a">遞減 ↘</text>
  <text x="216.5" y="130.0" font-size="14" fill="#1a1a1a">↗ 遞增</text>
  <text x="160" y="156" font-size="12" fill="#555">最低點</text>
  <text x="8" y="16" font-size="12" fill="#555">O</text>
</svg>