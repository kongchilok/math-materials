<svg viewBox="0 0 540 150" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft JhengHei, Arial, sans-serif">
  <!-- 輸入 x -->
  <text x="18" y="80" font-size="20" fill="#1a1a1a">x</text>
  <line x1="34" y1="74" x2="92" y2="74" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="92,74 82,69 82,79" fill="#1a1a1a"/>
  <!-- 機器 g（內層）-->
  <rect x="94" y="44" width="110" height="60" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="149" y="70" font-size="17" fill="#1a1a1a" text-anchor="middle">g　機器</text>
  <text x="149" y="92" font-size="13" fill="#555" text-anchor="middle">（內層）</text>
  <!-- 中間輸出 g(x) -->
  <line x1="204" y1="74" x2="286" y2="74" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="286,74 276,69 276,79" fill="#1a1a1a"/>
  <text x="245" y="64" font-size="16" fill="#1a1a1a" text-anchor="middle">g(x)</text>
  <!-- 機器 f（外層）-->
  <rect x="288" y="44" width="110" height="60" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="343" y="70" font-size="17" fill="#1a1a1a" text-anchor="middle">f　機器</text>
  <text x="343" y="92" font-size="13" fill="#555" text-anchor="middle">（外層）</text>
  <!-- 最終輸出 f(g(x)) -->
  <line x1="398" y1="74" x2="456" y2="74" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="456,74 446,69 446,79" fill="#1a1a1a"/>
  <text x="462" y="80" font-size="18" fill="#1a1a1a">f(g(x))</text>
  <!-- 說明 -->
  <text x="270" y="132" font-size="13" fill="#555" text-anchor="middle">x 先進 g 機器，得到 g(x)；再把 g(x) 送進 f 機器，得到 f(g(x))</text>
</svg>
