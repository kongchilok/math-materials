<!DOCTYPE html>
<!--
  課堂講義／練習 HTML 範本 —— 使用者的固定house style（見 ../references/house-style.md 完整設計依據）：
  14pt標題／12pt本文、頁首頁尾左右邊界0.5cm、masthead+footer品牌列、
  三個難度區塊（練習A=初階/B=中階/C=高階）用星星（★☆☆/★★☆/★★★）標在區塊標題，不用顏色或邊框粗細（預設黑白列印）。
  用法：複製這個檔案，把 [方括號] 內容換成實際講義內容；CSS 與 MathJax 設定原封不動保留。
  數學式一律寫在 \( ... \) 或 \[ ... \] 之間，讓 MathJax 轉成正確符號。
  轉 PDF：用 scripts/html_to_pdf.ps1 <這份html的路徑> <輸出pdf路徑>
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>[講義標題]</title>
<script>
  MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    svg: { fontCache: 'local', displayAlign: 'left', displayIndent: '0' },
    options: { enableMenu: false }
  };
</script>
<!-- 多 CDN 後備載入：單一 CDN 被學校網路擋掉時，公式不會整份變成原始碼 -->
<script>
(function loadMathJax(urls) {
  if (!urls.length) return;
  var s = document.createElement('script');
  s.src = urls[0];
  s.onerror = function () { loadMathJax(urls.slice(1)); };
  document.head.appendChild(s);
})([
  'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-svg.js',
  'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js',
  'https://unpkg.com/mathjax@3/es5/tex-mml-svg.js'
]);
</script>
<style>
  @page { size: A4; margin: 0.5cm; }
  * { box-sizing: border-box; }
  body {
    /* 無襯線字體（BDA 失讀症友善排版標準）；中文用思源黑體/微軟正黑體堆疊避免缺字 */
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", Arial, Verdana, sans-serif;
    font-size: 12pt;       /* house style：題目/本文 12pt */
    line-height: 1.5;
    color: #1a1a1a;
    background: #fff;      /* 黑白列印為主，維持純白底 */
    margin: 0;
    padding: 0;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 6px 10px; }

  /* masthead：固定頁首列品牌識別，細線+雙線做裝飾角標，不是顏色 */
  .masthead {
    font-size: 10pt; color: #555; border-top: 1px solid #999; border-bottom: 3px double #999;
    padding: 3px 0 4px; margin-bottom: 8px; display: flex; gap: 24px;
  }
  .ws-meta { font-size: 12pt; margin-bottom: 10px; }
  .ws-meta .u { display: inline-block; min-width: 90px; border-bottom: 1px solid #1a1a1a; margin-right: 20px; }

  .section-h { font-size: 14pt; font-weight: 700; margin: 16px 0 8px; }  /* house style：標題統一 14pt */
  .stars { font-size: 12pt; letter-spacing: 1px; }  /* 難度用星星表示：練習A=★☆☆／B=★★☆／C=★★★，放在該區塊標題裡，不用邊框粗細或顏色 */

  /* break-inside:avoid — without this Chrome's print-to-pdf can split a
     bordered box across a page break, leaving a stray half-border line
     at the top of the next page (seen and fixed during real testing). */
  .problem { margin: 12px 0; padding: 8px 12px; background: #fff; border: 0.75pt solid #000; break-inside: avoid; page-break-inside: avoid; }

  .hint-card, .worked-example { font-size: 11.5pt; background: #f0f0f0; border-left: 3px solid #555; padding: 5px 10px; margin: 6px 0; }
  .steps { margin: 6px 0; padding-left: 0; list-style: none; }
  .steps li { margin: 4px 0; padding-left: 1.6em; text-indent: -1.6em; }
  .steps li::before { content: attr(data-n) "　"; font-weight: 700; }

  /* 書寫格線：真實 div 邊框線堆疊，不用 repeating-linear-gradient */
  .write-lines { margin-top: 4px; }
  .write-lines .line { height: 0.9cm; border-bottom: 1px solid #aaa; }
  .write-lines .line:last-child { border-bottom: none; }

  .ans-box { display: inline-block; min-width: 110px; border-bottom: 1.5px solid #1a1a1a; height: 1.1em; vertical-align: bottom; }
  .choices span { display: inline-block; margin-right: 22px; }
  .page-break { break-before: page; }

  /* footer：整份文件唯一一個 .footer，position:fixed 讓 Chrome 列印在每一頁自動重複，
     不逐頁手放（QB-15c 驗收：position:fixed 恰一個，0 個或多個都 FAIL）；文字不含頁碼 */
  .footer { position: fixed; bottom: 0; left: 0; right: 0; max-width: 720px; margin: 0 auto; background: #fff; font-size: 9pt; color: #666; text-align: center; border-top: 1px solid #999; padding: 3px 0 2px; }
</style>
</head>
<body>
<div class="page">

  <div class="masthead"><span>科目：[科目，例如：高三數學]</span><span>單元：[單元名稱]</span><span>類型：課堂講義</span></div>

  <!-- 不要再加大標題 <h1> —— masthead 的科目/單元/類型已經足夠說明這是什麼文件，
       實測後使用者覺得再放一行大標題是多餘的，直接接學生資訊列即可 -->
  <div class="ws-meta">姓名：<span class="u">&nbsp;</span>班別：<span class="u">&nbsp;</span>學號：<span class="u">&nbsp;</span>日期：<span class="u">&nbsp;</span></div>

  <div class="section-h">一、範例</div>
  <div class="worked-example">[已完成範例的內容]</div>

  <!-- 難度只靠 A/B/C 標題後面的星星表示（★☆☆/★★☆/★★★），不在題目上加「初階/中階/高階」字樣或色塊，每個 .problem 統一細框 -->
  <div class="section-h">二、練習A（<span class="stars">★☆☆</span>）</div>
  <div class="problem">
    <div>1．[初階題幹]</div>
    <div class="write-lines"><div class="line"></div><div class="line"></div><div class="line"></div></div>
  </div>

  <div class="section-h">三、練習B（<span class="stars">★★☆</span>）</div>
  <div class="problem">
    <div>2．[中階題幹]</div>
    <div class="write-lines"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
  </div>

  <div class="section-h">四、練習C（<span class="stars">★★★</span>）</div>
  <div class="problem">
    <div>3．[高階題幹]</div>
    <div class="write-lines"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
  </div>

  <div class="footer">[科目．單元]</div>

  <!-- 需要另起一頁時，在該區塊最外層 div 加 class="page-break"；.footer 不用重複，
       它是 position:fixed，整份文件只出現這一個，Chrome 列印會自動套用到每一頁 -->

</div>
</body>
</html>
