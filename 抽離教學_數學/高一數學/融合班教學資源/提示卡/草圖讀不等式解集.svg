<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-weight: 800; font-size: 42px; fill: #111827; }
      .trigger { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 20px; fill: #4B5563; font-weight: 500; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 22px; font-weight: 700; fill: #374151; }
      .row-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 26px; font-weight: 800; }
      .row-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 22px; font-weight: 600; fill: #1F2937; }
      .formula-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .footer-motto { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 24px; font-weight: 800; fill: #111827; }
    </style>
  </defs>

  <!-- 背景板 -->
  <rect width="800" height="1130" fill="#FFFFFF"/>
  <rect x="25" y="25" width="750" height="1080" rx="16" fill="#FFFFFF" stroke="#111827" stroke-width="4"/>

  <!-- 頂部標題與觸發語 -->
  <text x="400" y="90" text-anchor="middle" class="title">草圖讀不等式解集</text>
  <rect x="190" y="115" width="420" height="36" rx="6" fill="#E5E7EB"/>
  <text x="400" y="140" text-anchor="middle" class="trigger">什麼時候看我：畫好草圖要寫解集時。</text>

  <!-- 欄位分界標籤 -->
  <rect x="60" y="175" width="320" height="42" rx="6" fill="#F3F4F6"/>
  <text x="220" y="203" text-anchor="middle" class="col-header">【草圖特徵】</text>

  <rect x="420" y="175" width="320" height="42" rx="6" fill="#F3F4F6"/>
  <text x="580" y="203" text-anchor="middle" class="col-header">【代數解集】</text>

  <!-- 第一排：軸上方 / 取兩邊 -->
  <g transform="translate(60, 235)">
    <!-- 左欄圖形卡 -->
    <rect width="320" height="320" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- 草圖 (凸顯軸上方兩翼) -->
    <g transform="translate(20, 25)">
      <line x1="10" y1="170" x2="270" y2="170" stroke="#111827" stroke-width="2.5"/>
      <text x="260" y="160" font-size="16" font-weight="700" fill="#111827">x</text>
      
      <!-- 軸下弱化、軸上加粗高亮 -->
      <path d="M 60 170 Q 140 270 220 170" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="4,4"/>
      <path d="M 20 40 Q 45 120 60 170" fill="none" stroke="#2563EB" stroke-width="6"/>
      <path d="M 220 170 Q 235 120 260 40" fill="none" stroke="#2563EB" stroke-width="6"/>
      
      <circle cx="60" cy="170" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
      <circle cx="220" cy="170" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
      <text x="60" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">①</text>
      <text x="220" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">②</text>
    </g>
    <rect x="25" y="260" width="270" height="40" rx="6" fill="#EFF6FF"/>
    <text x="160" y="287" text-anchor="middle" class="row-desc" fill="#1D4ED8">ⓐ 線在 x 軸上方</text>

    <!-- 右欄規則卡 (水平精確對齊) -->
    <rect x="360" y="0" width="320" height="320" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/>
    <rect x="385" y="30" width="270" height="50" rx="6" fill="#FEF08A"/>
    <text x="520" y="64" text-anchor="middle" class="row-title" fill="#854D0E">★ y &gt; 0 取兩邊</text>
    
    <text x="390" y="140" font-size="20" font-weight="600" fill="#4B5563">對照讀出兩段解：</text>
    <rect x="385" y="165" width="270" height="110" rx="8" fill="#F3F4F6"/>
    <text x="520" y="230" text-anchor="middle" class="formula-box">x &lt; ① 或 x &gt; ②</text>
  </g>

  <!-- 第二排：軸下方 / 取中間 -->
  <g transform="translate(60, 580)">
    <!-- 左欄圖形卡 -->
    <rect width="320" height="320" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- 草圖 (凸顯軸下方凹槽) -->
    <g transform="translate(20, 25)">
      <line x1="10" y1="110" x2="270" y2="110" stroke="#111827" stroke-width="2.5"/>
      <text x="260" y="100" font-size="16" font-weight="700" fill="#111827">x</text>
      
      <!-- 軸上弱化、軸下加粗高亮 -->
      <path d="M 20 20 Q 45 75 60 110" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="4,4"/>
      <path d="M 220 110 Q 235 75 260 20" fill="none" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="4,4"/>
      <path d="M 60 110 Q 140 220 220 110" fill="none" stroke="#DC2626" stroke-width="6"/>
      
      <circle cx="60" cy="110" r="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
      <circle cx="220" cy="110" r="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
      <text x="60" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">①</text>
      <text x="220" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">②</text>
    </g>
    <rect x="25" y="260" width="270" height="40" rx="6" fill="#FEF2F2"/>
    <text x="160" y="287" text-anchor="middle" class="row-desc" fill="#B91C1C">ⓑ 線在 x 軸下方</text>

    <!-- 右欄規則卡 (水平精確對齊) -->
    <rect x="360" y="0" width="320" height="320" rx="10" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/>
    <rect x="385" y="30" width="270" height="50" rx="6" fill="#E0E7FF"/>
    <text x="520" y="64" text-anchor="middle" class="row-title" fill="#3730A3">★ y &lt; 0 取中間</text>
    
    <text x="390" y="140" font-size="20" font-weight="600" fill="#4B5563">對照讀出中間段：</text>
    <rect x="385" y="165" width="270" height="110" rx="8" fill="#F3F4F6"/>
    <text x="520" y="230" text-anchor="middle" class="formula-box">① &lt; x &lt; ②</text>
  </g>

  <!-- 底部口訣 -->
  <g transform="translate(60, 930)">
    <rect width="680" height="90" rx="10" fill="#F3F4F6" stroke="#111827" stroke-width="2.5"/>
    <text x="340" y="53" text-anchor="middle" class="footer-motto">記憶口訣：大於零取兩邊，小於零取中間。</text>
  </g>
</svg>
