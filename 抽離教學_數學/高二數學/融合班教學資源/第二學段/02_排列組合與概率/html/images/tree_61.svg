<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="1240" height="720" fill="#ffffff"/>
  <!-- step labels -->
  <text x="240" y="60" font-size="34" font-weight="bold" fill="#1a1a1a">第1步：選字母（2種）</text>
  <text x="720" y="60" font-size="34" font-weight="bold" fill="#1a1a1a">第2步：選數字（3種）</text>
  <!-- root -->
  <rect x="60" y="330" width="150" height="70" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <text x="135" y="377" font-size="34" text-anchor="middle" fill="#1a1a1a">座位號</text>
  <!-- level 1: A, B -->
  <rect x="330" y="170" width="90" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="375" y="217" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">A</text>
  <rect x="330" y="480" width="90" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="375" y="527" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">B</text>
  <line x1="210" y1="355" x2="330" y2="205" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="210" y1="375" x2="330" y2="515" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- level 2: A1 A2 A3 -->
  <line x1="420" y1="195" x2="560" y2="115" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="205" x2="560" y2="205" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="225" x2="560" y2="295" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="560" y="80" width="110" height="64" fill="#f0f0f0" stroke="#555555" stroke-width="2.5"/>
  <text x="615" y="124" font-size="34" text-anchor="middle" fill="#1a1a1a">A1</text>
  <rect x="560" y="173" width="110" height="64" fill="#f0f0f0" stroke="#555555" stroke-width="2.5"/>
  <text x="615" y="217" font-size="34" text-anchor="middle" fill="#1a1a1a">A2</text>
  <rect x="560" y="266" width="110" height="64" fill="#f0f0f0" stroke="#555555" stroke-width="2.5"/>
  <text x="615" y="310" font-size="34" text-anchor="middle" fill="#1a1a1a">A3</text>
  <!-- level 2: B1 B2 B3 -->
  <line x1="420" y1="505" x2="560" y2="425" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="515" x2="560" y2="515" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="535" x2="560" y2="605" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="560" y="390" width="110" height="64" fill="#f0f0f0" stroke="#555555" stroke-width="2.5"/>
  <text x="615" y="434" font-size="34" text-anchor="middle" fill="#1a1a1a">B1</text>
  <rect x="560" y="483" width="110" height="64" fill="#f0f0f0" stroke="#555555" stroke-width="2.5"/>
  <text x="615" y="527" font-size="34" text-anchor="middle" fill="#1a1a1a">B2</text>
  <rect x="560" y="576" width="110" height="64" fill="#f0f0f0" stroke="#555555" stroke-width="2.5"/>
  <text x="615" y="620" font-size="34" text-anchor="middle" fill="#1a1a1a">B3</text>
  <!-- conclusion -->
  <text x="760" y="330" font-size="34" fill="#1a1a1a">一共</text>
  <text x="760" y="395" font-size="40" font-weight="bold" fill="#1a1a1a">2 × 3 = 6 個號碼</text>
  <text x="760" y="455" font-size="30" fill="#555555">（每個字母都配到 3 個數字）</text>
</svg>
