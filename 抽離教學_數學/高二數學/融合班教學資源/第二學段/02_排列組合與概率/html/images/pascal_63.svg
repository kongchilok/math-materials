<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="1240" height="700" fill="#ffffff"/>
  <text x="60" y="60" font-size="34" font-weight="bold" fill="#1a1a1a">楊輝三角：每個數＝左上＋右上</text>
  <!-- left labels -->
  <text x="130" y="150" font-size="30" fill="#555555">(a+b)¹</text>
  <text x="130" y="240" font-size="30" fill="#555555">(a+b)²</text>
  <text x="130" y="330" font-size="30" fill="#555555">(a+b)³</text>
  <text x="130" y="420" font-size="30" fill="#555555">(a+b)⁴</text>
  <text x="130" y="510" font-size="30" fill="#555555">(a+b)⁵</text>
  <!-- rows, centered at x=700, spacing 90px vertical, 100px horizontal -->
  <!-- n=1: 1 1 -->
  <text x="650" y="150" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="750" y="150" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <!-- n=2: 1 2 1 -->
  <text x="600" y="240" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="700" y="240" font-size="36" text-anchor="middle" fill="#1a1a1a">2</text>
  <text x="800" y="240" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <!-- n=3: 1 3 3 1 -->
  <text x="550" y="330" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="650" y="330" font-size="36" text-anchor="middle" fill="#1a1a1a">3</text>
  <text x="750" y="330" font-size="36" text-anchor="middle" fill="#1a1a1a">3</text>
  <text x="850" y="330" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <!-- n=4: 1 4 6 4 1 -->
  <text x="500" y="420" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="600" y="420" font-size="36" text-anchor="middle" fill="#1a1a1a">4</text>
  <text x="700" y="420" font-size="36" text-anchor="middle" fill="#1a1a1a">6</text>
  <text x="800" y="420" font-size="36" text-anchor="middle" fill="#1a1a1a">4</text>
  <text x="900" y="420" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <!-- n=5: 1 5 10 10 5 1 -->
  <text x="450" y="510" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="550" y="510" font-size="36" text-anchor="middle" fill="#1a1a1a">5</text>
  <text x="650" y="510" font-size="36" text-anchor="middle" fill="#1a1a1a">10</text>
  <text x="750" y="510" font-size="36" text-anchor="middle" fill="#1a1a1a">10</text>
  <text x="850" y="510" font-size="36" text-anchor="middle" fill="#1a1a1a">5</text>
  <text x="950" y="510" font-size="36" text-anchor="middle" fill="#1a1a1a">1</text>
  <!-- example addition arrows: 4+6=10 -->
  <line x1="608" y1="432" x2="640" y2="485" stroke="#555555" stroke-width="3"/>
  <line x1="692" y1="432" x2="660" y2="485" stroke="#555555" stroke-width="3"/>
  <circle cx="600" cy="408" r="34" fill="none" stroke="#555555" stroke-width="2.5"/>
  <circle cx="700" cy="408" r="34" fill="none" stroke="#555555" stroke-width="2.5"/>
  <circle cx="650" cy="498" r="38" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <text x="1010" y="505" font-size="30" fill="#555555">例：4＋6＝10</text>
  <text x="60" y="620" font-size="30" fill="#1a1a1a">第 n 行的數，就是 (a+b)ⁿ 展開式各項的「二項式係數」C(n,0), C(n,1), …, C(n,n)。</text>
  <text x="60" y="668" font-size="30" fill="#1a1a1a">每行左右對稱；每行全部加起來＝2ⁿ。</text>
</svg>
