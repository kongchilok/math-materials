<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="1240" height="500" fill="#ffffff"/>
  <!-- left: mutually exclusive -->
  <text x="300" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#1a1a1a">互斥：A、B 不能同時發生</text>
  <rect x="80" y="90" width="460" height="290" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="100" y="130" font-size="28" fill="#555555">Ω</text>
  <circle cx="220" cy="235" r="85" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <text x="220" y="248" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">A</text>
  <circle cx="420" cy="235" r="85" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <text x="420" y="248" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="300" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">P(A∪B) ＝ P(A)＋P(B)</text>
  <!-- right: complementary -->
  <text x="930" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#1a1a1a">對立：不是 A 發生，就是 B 發生</text>
  <rect x="710" y="90" width="460" height="290" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <text x="730" y="130" font-size="28" fill="#555555">Ω</text>
  <circle cx="880" cy="235" r="100" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="880" y="248" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">A</text>
  <text x="1075" y="248" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">B＝Ā</text>
  <text x="930" y="440" font-size="30" text-anchor="middle" fill="#1a1a1a">P(A)＋P(B) ＝ 1，即 P(Ā) ＝ 1－P(A)</text>
</svg>
