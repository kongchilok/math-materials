<svg xmlns="http://www.w3.org/2000/svg" width="340" height="250" viewBox="0 0 340 250" font-family="Georgia, 'Times New Roman', serif">
  <!-- 2026 解答第4題：雙曲線 x^2/4 - y^2/2 = 1，直線 ℓ 過(6,0)交右支於 A,B；M(2,0)，求證 AM⊥BM -->
  <!-- 示意圖（不按比例）。映射： px = 150 + 17x ， py = 130 - 17y -->
  <!-- x 軸 -->
  <line x1="10" y1="130" x2="330" y2="130" stroke="#222" stroke-width="1.3"/>
  <polygon points="330,130 322,126 322,134" fill="#222"/>
  <!-- y 軸 -->
  <line x1="150" y1="240" x2="150" y2="8" stroke="#222" stroke-width="1.3"/>
  <polygon points="150,8 146,16 154,16" fill="#222"/>
  <!-- 右支 -->
  <path d="M 286,37 C 210,80 184,108 184,130 C 184,152 210,180 286,223" fill="none" stroke="#1f8a4c" stroke-width="2"/>
  <!-- 左支 -->
  <path d="M 14,37 C 90,80 116,108 116,130 C 116,152 90,180 14,223" fill="none" stroke="#1f8a4c" stroke-width="2"/>
  <!-- 直線 ℓ 過 A,B 與 (6,0) -->
  <line x1="206" y1="245" x2="312" y2="22" stroke="#2456c8" stroke-width="1.7"/>
  <!-- M 到 A、M 到 B 連線（虛線） -->
  <line x1="184" y1="130" x2="218" y2="180" stroke="#b23a3a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="184" y1="130" x2="263" y2="63" stroke="#b23a3a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <!-- M 處直角記號 -->
  <path d="M 196,140 L 201,131 L 192,126" fill="none" stroke="#b23a3a" stroke-width="1.1"/>
  <!-- 點 -->
  <circle cx="184" cy="130" r="2.6" fill="#111"/>
  <circle cx="218" cy="180" r="2.6" fill="#111"/>
  <circle cx="263" cy="63" r="2.6" fill="#111"/>
  <circle cx="252" cy="130" r="2.2" fill="#111"/>
  <!-- 標籤 -->
  <text x="170" y="124" font-size="14" font-style="italic">M</text>
  <text x="222" y="194" font-size="14" font-style="italic">A</text>
  <text x="268" y="60" font-size="14" font-style="italic">B</text>
  <text x="246" y="148" font-size="11">(6,0)</text>
  <text x="320" y="124" font-size="14" font-style="italic">x</text>
  <text x="136" y="20" font-size="14" font-style="italic">y</text>
  <text x="292" y="30" font-size="14" font-style="italic" fill="#2456c8">ℓ</text>
  <text x="300" y="210" font-size="13" font-style="italic" fill="#1f8a4c">E</text>
  <text x="10" y="246" font-size="11" fill="#666">示意圖（不按比例）</text>
</svg>
