<style>
  /* ============================================================
     Letterpress — 印刷考卷
     Paper, ink and one official navy. Hairline rules do the dividing;
     depth comes from precision, not from shadow or warmth.
     ============================================================ */
  :root{
    --ui: "Atkinson Hyperlegible", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
    --serif: "Crimson Pro", "Noto Serif TC", Georgia, "Songti TC", serif;
    --measure: 760px;
  }

  /* 紙白 — default */
  [data-theme="warm"] {
    --bg: #FBFAF7; --surface: #FFFFFF; --ink: #16181C; --ink-soft: #4A4E56;
    --muted: #6B7078; --line: #DAD6CC; --accent: #1E3A6E; --accent-soft: #E7EBF3;
    /* --line draws non-interactive hairlines; --edge draws the boundary of anything
       clickable, which WCAG 1.4.11 holds to 3:1 against its own fill */
    --edge: #8C8878;
    --ok: #136B43; --ok-soft: #E4F0E9; --no: #9E1B1B; --no-soft: #F7E7E5;
    --rule-strong: #16181C;
    --given-bg: #F6F4EE; --given-line: #DAD6CC;
    --formula-bg: #EDF1F6; --formula-line: #B9C7DB; --formula-ink: #223C63;
    --hint-bg: #F5F0E4; --hint-line: #D8C79A; --hint-ink: #6F5514;
  }
  /* 柔和 — dimmer paper for long reading */
  [data-theme="soft"] {
    --bg: #F0EDE5; --surface: #F9F7F1; --ink: #1F2126; --ink-soft: #4E525A;
    /* --muted is darker here than in the paper theme: this ground is dimmer, so the
       same grey would land at 4.25:1 and miss AA */
    --muted: #64686F; --line: #D2CCBE; --accent: #23406F; --accent-soft: #E2E7F0;
    --edge: #87836F;
    --ok: #166542; --ok-soft: #DDEBE3; --no: #97231F; --no-soft: #F1E1DE;
    --rule-strong: #1F2126;
    --given-bg: #EBE7DC; --given-line: #CFC8B7;
    --formula-bg: #E5EAF1; --formula-line: #B2C1D6; --formula-ink: #22395C;
    --hint-bg: #EDE6D4; --hint-line: #CFBC8C; --hint-ink: #6A5113;
  }
  /* 深色 */
  [data-theme="dark"] {
    --bg: #14161A; --surface: #1C1F25; --ink: #E9EBEF; --ink-soft: #B6BAC2;
    --muted: #8A9098; --line: #2E333B; --accent: #93B2E8; --accent-soft: #1F2A3C;
    --edge: #737C8A;
    --ok: #6CC195; --ok-soft: #172C22; --no: #E28B85; --no-soft: #331E1D;
    --rule-strong: #4A515C;
    --given-bg: #202329; --given-line: #343941;
    --formula-bg: #1A2430; --formula-line: #33465C; --formula-ink: #A8C6E8;
    --hint-bg: #292418; --hint-line: #4E442A; --hint-ink: #DCC684;
  }
  /* 高對比 */
  [data-theme="contrast"] {
    --bg: #FFFFFF; --surface: #FFFFFF; --ink: #000000; --ink-soft: #141414;
    --muted: #3A3A3A; --line: #000000; --accent: #00308F; --accent-soft: #DCE4F5;
    --edge: #000000;
    --ok: #005A28; --ok-soft: #D3EFD9; --no: #B10000; --no-soft: #F8D9D9;
    --rule-strong: #000000;
    --given-bg: #F0F0F0; --given-line: #000000;
    --formula-bg: #E6EEF9; --formula-line: #00308F; --formula-ink: #002569;
    --hint-bg: #FFF3D4; --hint-line: #7A5300; --hint-ink: #5C3F00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--serif);
    background: var(--bg); color: var(--ink); line-height: 1.72;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s, color 0.25s;
  }

  /* ---------- sticky chrome: masthead + finder ---------- */
  .chrome { position: sticky; top: 0; z-index: 40; background: var(--bg); }

  .masthead {
    border-bottom: 1px solid var(--rule-strong);
    /* the 44px settings button already sets the bar's height, so the padding only
       needs to keep the wordmark off the rules */
    padding: 0.45rem 1rem;
  }
  .masthead-inner {
    max-width: var(--measure); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  }
  .wordmark {
    font-family: var(--ui); font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.01em; color: var(--ink);
    display: flex; align-items: baseline; gap: 0.45rem; min-width: 0;
  }
  .wordmark .span-years { color: var(--accent); font-weight: 700; }
  .wordmark .long { display: none; }
  @media (min-width: 560px) {
    .wordmark .short { display: none; }
    .wordmark .long { display: inline; }
  }

  .finder-bar { border-bottom: 1px solid var(--line); padding: 0.5rem 1rem; }
  .finder-inner {
    max-width: var(--measure); margin: 0 auto;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .ctl {
    flex: 1 1 0; min-width: 0; min-height: 44px;
    font-family: var(--ui); font-size: 0.86rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--edge); border-radius: 3px;
    padding: 0 0.4rem; cursor: pointer;
    transition: border-color 0.15s;
  }
  .ctl:hover { border-color: var(--accent); }
  .find-btn {
    flex: 0 0 auto; white-space: nowrap; min-height: 44px; padding: 0 0.9rem;
    font-family: var(--ui); font-size: 0.86rem; font-weight: 700;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    border-radius: 3px; cursor: pointer; transition: opacity 0.15s;
  }
  .find-btn:hover { opacity: 0.88; }
  [data-theme="dark"] .find-btn { color: #10141B; }
  /* must sit after the .ctl base rule above, not with the other min-width:560px
     block earlier — same specificity, so source order decides */
  @media (min-width: 560px) {
    .finder-inner { justify-content: flex-start; }
    .ctl { flex: 0 1 10rem; }
  }

  /* ---------- settings popover ---------- */
  .settings { position: relative; flex: 0 0 auto; }
  .set-btn {
    width: 44px; height: 44px; margin-right: -0.45rem;
    display: flex; align-items: center; justify-content: center;
    border: 0; background: none; color: var(--ink-soft); cursor: pointer;
    border-radius: 3px; transition: color 0.15s, background 0.15s;
  }
  .set-btn:hover { color: var(--accent); background: var(--accent-soft); }
  .set-menu {
    position: absolute; top: calc(100% + 0.5rem); right: 0; z-index: 60;
    min-width: 11.5rem; padding: 0.5rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 10px 26px -8px rgba(0,0,0,0.24);
    display: flex; flex-direction: column; gap: 0.15rem;
  }
  .set-menu[hidden] { display: none; }
  .set-title {
    font-family: var(--ui); font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    padding: 0.3rem 0.5rem 0.45rem;
  }
  .theme-btn {
    display: flex; align-items: center; gap: 0.6rem; width: 100%;
    min-height: 44px; padding: 0 0.5rem;
    font-family: var(--ui); font-size: 0.86rem; color: var(--ink);
    background: none; border: 0; border-radius: 3px; cursor: pointer;
    text-align: left; transition: background 0.15s;
  }
  .theme-btn:hover { background: var(--accent-soft); }
  .theme-btn .sw {
    width: 20px; height: 20px; flex: 0 0 20px; border-radius: 50%;
    border: 1px solid var(--line);
  }
  .theme-btn .tick { margin-left: auto; opacity: 0; color: var(--accent); }
  .theme-btn[aria-checked="true"] { font-weight: 700; }
  .theme-btn[aria-checked="true"] .tick { opacity: 1; }
  .sw-warm { background: #FBFAF7; } .sw-soft { background: #F0EDE5; }
  .sw-dark { background: #1C1F25; }
  .sw-contrast { background: linear-gradient(135deg, #fff 50%, #000 50%); }

  /* ---------- main ---------- */
  main { max-width: var(--measure); margin: 0 auto; padding: 1.15rem 1rem 4rem; }

  .single-head {
    font-family: var(--ui); font-size: 0.75rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
    margin-bottom: 0.85rem;
  }

  /* question — open on the page, ruled rather than boxed */
  .q { position: relative; }
  .q-top {
    display: flex; align-items: baseline; gap: 0.7rem;
    border-bottom: 2px solid var(--rule-strong); padding-bottom: 0.5rem;
  }
  .q-no {
    font-size: 2.5rem; font-weight: 700; line-height: 0.85; color: var(--ink);
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .q-type { font-family: var(--ui); font-size: 0.78rem; font-weight: 700; color: var(--accent); }
  .q-body { font-size: 1.14rem; line-height: 1.72; margin-top: 1rem; }
  .q-img { margin: 1.1rem 0 0.4rem; text-align: center; }
  .q-img img {
    max-width: 100%; height: auto; background: #fff;
    border: 1px solid var(--line); border-radius: 3px;
  }

  .given {
    margin-top: 1rem; border-left: 2px solid var(--accent);
    background: var(--given-bg); padding: 0.7rem 0.9rem 0.7rem 0.85rem;
  }
  .given-head {
    font-family: var(--ui); font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 0.45rem;
  }
  .given ul { list-style: none; display: flex; flex-direction: column; gap: 0.22rem; }
  .given li { font-size: 1rem; color: var(--ink-soft); }

  /* options — generous rows, one bordered target each */
  .opts { margin-top: 1.15rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .opt {
    display: flex; align-items: center; gap: 0.85rem;
    width: 100%; min-height: 52px; padding: 0.65rem 0.85rem;
    font-family: inherit; font-size: 1.04rem; text-align: left;
    color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--edge); border-radius: 5px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt-key {
    width: 30px; height: 30px; flex: 0 0 30px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ui); font-size: 0.84rem; font-weight: 700;
    color: var(--muted); background: transparent;
    border: 1.5px solid var(--muted); border-radius: 50%;
  }
  .opt-text { flex: 1; min-width: 0; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .opt-key { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--no); background: var(--no-soft); }
  .opt.wrong .opt-key { background: var(--no); border-color: var(--no); color: #fff; }

  /* helper buttons */
  .help-bar { margin-top: 1.15rem; display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .help-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    min-height: 44px; padding: 0 0.85rem;
    font-family: var(--ui); font-size: 0.82rem; font-weight: 700;
    color: var(--ink-soft); background: var(--surface);
    border: 1px solid var(--edge); border-radius: 3px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .help-btn:hover { border-color: var(--accent); color: var(--accent); }
  .help-btn.formula:hover { border-color: var(--formula-line); color: var(--formula-ink); }
  .help-btn.hint:hover { border-color: var(--hint-line); color: var(--hint-ink); }
  .help-btn .ic { font-size: 0.92rem; }

  /* panels */
  .panel { margin-top: 0.85rem; border-radius: 3px; padding: 0.95rem 1.1rem; display: none; }
  .panel.show { display: block; animation: fade 0.22s ease; }
  .panel-head {
    font-family: var(--ui); font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.65rem;
  }
  .panel.formula { background: var(--formula-bg); border: 1px solid var(--formula-line); }
  .panel.formula .panel-head { color: var(--formula-ink); }
  .formula-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .formula-item {
    font-size: 1rem; color: var(--ink); padding: 0.5rem 0.75rem;
    background: var(--surface); border: 1px solid var(--formula-line); border-radius: 3px;
  }
  .panel.hint { background: var(--hint-bg); border: 1px solid var(--hint-line); }
  .panel.hint .panel-head { color: var(--hint-ink); }
  .panel.hint .hint-text { font-size: 1rem; color: var(--ink-soft); line-height: 1.7; }
  .panel.feedback.right { background: var(--ok-soft); border: 1px solid var(--ok); }
  .panel.feedback.wrongbg { background: var(--no-soft); border: 1px solid var(--no); }
  .panel.solution { background: var(--surface); border: 1px solid var(--line); }
  .panel.solution .panel-head { color: var(--accent); }
  .fb-verdict { font-family: var(--ui); font-weight: 700; font-size: 0.9rem; margin-bottom: 0.75rem; }
  .panel.feedback.right .fb-verdict { color: var(--ok); }
  .panel.feedback.wrongbg .fb-verdict { color: var(--no); }

  .sol-steps { counter-reset: step; }
  .sol-step {
    position: relative; padding-left: 2rem; margin-bottom: 0.55rem;
    color: var(--ink-soft); font-size: 1rem; line-height: 1.72;
  }
  .sol-step:last-child { margin-bottom: 0; }
  .sol-step::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: 0; top: 0.2rem;
    width: 1.45rem; height: 1.45rem; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-family: var(--ui); font-size: 0.75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  /* nav */
  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; margin-top: 1.7rem; }
  .nav-btn {
    min-height: 44px; padding: 0 1.1rem;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--ui); font-size: 0.86rem; font-weight: 700;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--edge); border-radius: 3px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn[hidden] { display: none; }

  footer {
    max-width: var(--measure); margin: 0 auto;
    border-top: 1px solid var(--line);
    padding: 1.4rem 1rem 3rem; color: var(--muted);
    font-family: var(--ui); font-size: 0.78rem; line-height: 1.65;
  }

  /* focus — one consistent ring everywhere */
  .ctl:focus-visible, .find-btn:focus-visible, .set-btn:focus-visible,
  .theme-btn:focus-visible, .opt:focus-visible, .help-btn:focus-visible,
  .nav-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (max-width: 400px) {
    .q-no { font-size: 2.1rem; }
    .q-body { font-size: 1.08rem; }
    .finder-inner { gap: 0.32rem; }
    .ctl { font-size: 0.82rem; padding: 0 0.3rem; }
    .find-btn { padding: 0 0.7rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<script>/* 喺其餘 body 上畫之前還原主題，避免閃一下預設紙白 */

(f(x)=6x-x^2\\)。","<b>(b)</b> \\(\\log_{\\frac12}\\sqrt{f(x)}=-\\dfrac32\\Rightarrow \\sqrt{f(x)}=\\left(\\dfrac12\\right)^{-3/2}=2^{3/2}=\\sqrt8\\Rightarrow f(x)=8\\)。","即 \\(6x-x^2=8\\Rightarrow x^2-6x+8=0\\Rightarrow(x-2)(x-4)=0\\)。","\\(x=2\\) 或 \\(x=4\\)。"]},{"n":3,"type":"第十二類型：直線圖形及圓","body":"(a) 拋物線 \\(y=x^2-px+q\\) 通過 \\(A(7,-1)\\) 和 \\(B(0,6)\\)，求 \\(p,q\\)。<br>(b) 找另一點 \\(C\\) 使 \\(BC\\parallel x\\) 軸，求 \\(C\\) 的座標。<br>(c) 求 \\(\\triangle ABC\\) 的面積。","given":["拋物線 \\(y=x^2-px+q\\) 通過 \\(A(7,-1)\\)、\\(B(0,6)\\)","\\(B\\) 在 \\(y\\) 軸上；\\(C\\) 在曲線上且 \\(BC\\parallel x\\) 軸"],"formula":["點在曲線上 \\(\\Rightarrow\\) 座標代入方程成立","\\(BC\\parallel x\\) 軸 \\(\\Rightarrow\\) \\(B,C\\) 的 \\(y\\) 值相同","三角形面積 \\(=\\dfrac12\\times\\text{底}\\times\\text{高}\\)"],"hint":"(a) 先代 \\(B(0,6)\\) 求 \\(q\\)，再代 \\(A(7,-1)\\) 求 \\(p\\)。(b) \\(BC\\) 與 \\(x\\) 軸平行表示 \\(C\\) 的 \\(y\\) 也是 6，解方程得另一個 \\(x\\)。(c) 以水平線段 \\(BC\\) 為底、\\(A\\) 到該線的鉛直距離為高。","sol":["<b>(a)</b> 代 \\(B(0,6)\\)：\\(6=0-0+q\\Rightarrow q=6\\)。","代 \\(A(7,-1)\\)：\\(-1=49-7p+6\\Rightarrow7p=56\\Rightarrow p=8\\)。所以 \\(y=x^2-8x+6\\)。","<b>(b)</b> \\(C\\) 與 \\(B\\) 同高，令 \\(y=6\\)：\\(x^2-8x+6=6\\Rightarrow x^2-8x=0\\Rightarrow x(x-8)=0\\)。","\\(x=0\\) 是 \\(B\\)，另一根 \\(x=8\\)，故 \\(C=(8,6)\\)。","<b>(c)</b> 底 \\(|BC|=8\\)（由 \\(x=0\\) 到 \\(x=8\\)）；高 \\(=A\\) 到直線 \\(y=6\\) 的距離 \\(=|6-(-1)|=7\\)。","面積 \\(=\\dfrac12\\times8\\times7=28\\)。"],"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYMAAAImCAIAAAA+P3GFAAAxiUlEQVR4nO3dfVhU1d438B8wgIbviVJaciuZQYCWZYqpJHrSLM2XFM3zdId2paXdXZ5Ks6duyvTJsk4nX+qkeW6fkErjiJmoYchRMcvKJJHOYwpKCYIoKvE2zDx/7O1vxmFmnBn2zNov3891X/dZDuPMYs/0de+91vqtIKvVSgAAQgWL7gAAAJLIMGpray9fvsx/rKmpEdgZAAdIIv3Lz8+fMWNG+/bt09LSpEfq6+u7d+8+e/ZssR0DYEG4T2QQY8aM2b179++//961a1cieuutt7744ov8/HzR/QIgwjmRcSxYsKCpqSk7O1v64+zZs5OTk8V2CYAhiYxixIgRnTt33rZtm/TH7OzsmTNniu0SAEMSGYXJZLrvvvv27dtHRBaL5dSpU3369BHdKQAZkshARo4cWVVVdfLkyU8++WTixImiuwNggyQykHvvvZeIvvnmm1OnTsXGxoruDoANxs4MxGKxdO7cOTo6Oi8vr0uXLqK7A2BjEt0BCJzg4ODbbrvtL3/5C2II1A  或 }x\\lt -2\\}\\)","\\(\\{x:-3\\lt x\\lt 2\\}\\)","\\(\\{x:x\\gt 2\\text{ 或 }x\\lt -3\\}\\)","\\(\\varnothing\\)"],"answer":0,"formula":["十字交乘因式分解","二次不等式 \\((x-r_1)(x-r_2)\\lt 0\\) 的解為「兩根之間」 \\(r_1\\lt x\\lt r_2\\)"],"hint":"先因式分解成兩個括號相乘，找出兩個根；\\(\\lt 0\\)（乘積為負）表示解落在「兩根之間」。","sol":["① 因式分解：\\(x^2-x-6=(x-3)(x+2)\\)。","② 解 \\((x-3)(x+2)\\lt 0\\)，兩根為 \\(x=3\\) 與 \\(x=-2\\)。","③ 乘積為負取「兩根之間」：\\(-2\\lt x\\lt 3\\)，即 \\(A=\\{x:-2\\lt x\\lt 3\\}\\)，選 A。"]},{"n":2,"type":"第三類型：變分","body":"若 \\(x\\) 隨 \\(m\\) 正變且隨 \\(n^2\\) 反變，當 \\(m\\) 增加 44% 和 \\(n\\) 減少 20%，\\(x\\) 增加的百分比是","given":["\\(x\\) 隨 \\(\\sqrt{m}\\) 正變、隨 \\(n^2\\) 反變"],"options":["\\(64\\%\\)","\\(92.5\\%\\)","\\(84\\%\\)","\\(68.4\\%\\)","\\(125\\%\\)"],"answer":4,"formula":["合併變化：\\(x=k\\dfrac{\\sqrt{m}}{n^2}\\)","百分變化：增 \\(p\\%\\) 即乘 \\((1+p\\%)\\)，減即乘 \\((1-p\\%)\\)"],"hint":"把「增 44%」寫成 \\(\\times1.44\\)、「減 20%」寫成 \\(\\times0.8\\)，分別代入，再和原式相除看 \\(x\\) 變成幾倍。","sol":["① 設 \\(x=k\\dfrac{\\sqrt{m}}{n^2}\\)。","② \\(m\\to1.44m\\)：\\(\\sqrt{1.44m}=1.2\\sqrt{m}\\)；\\(n\\to0.8n\\)：\\((0.8n)^2=0.64n^2\\)。","③ \\(x'=k\\dfrac{1.2\\sqrt{m}}{0.64n^2}=\\dfrac{1.2}{0.64}\\,x=1.875x\\)。","④ 增加 \\((1.875-1)\\times100\\%=87.5\\%\\)，選 E。"]},{"n":3,"type":"第四類型：多項式及有理分式","body":"若 \\(x^3+4x^2+bx+3\\) 能被 \\(x^2+ax+1\\) 整除，則 \\(a+b=\\)","given":["\\(x^3+4x^2+bx+3\\) 能被 \\(x^2+ax+1\\) 整除"],"options":["\\(1\\)","\\(4\\)","\\(5\\)","\\(7\\)","以上皆非"],"answer":2,"formula":["整除 \\(\\Rightarrow\\) 餘式為 0，可設「被除式 = 除式 × 商式」","多項式相等 \\(\\Rightarrow\\) 對應次項係數相等"],"hint":"三次式除以二次式，商一定是一次式 \\(x+c\\)。把「除式 × 商」展開，再逐項對照係數。","sol":["① 設商為 \\(x+c\\)：\\(x^3+4x^2+bx+3=(x^2+ax+1)(x+c)\\)。","② 展開右邊 \\(=x^3+(a+c)x^2+(ac+1)x+c\\)。","③ 對照係數：常數 \\(c=3\\)；\\(x^2\\) 項 \\(a+c=4\\Rightarrow a=1\\)；\\(x\\) 項 \\(b=ac+1=1\\cdot3+1=4\\)。","④ \\(a+b=1+4=5\\)，選 C。"]},{"n":4,"type":"第六類型：指數及根式","body":"求 \\((6-\\sqrt{35})^{100}\\times(6+\\sqrt{35})^{99}\\) 之值。","given":["求 \\((6-\\sqrt{35})^{100}(6+\\sqrt{35})^{99}\\)"],"options":["\\(99(6+\\sqrt{35})\\)","\\(99(6-\\sqrt{35})\\)","\\((6+\\sqrt{35})\\)","\\((6-\\sqrt{35})\\)","以上皆非"],"answer":3,"formula":["平方差 \\((a-b)(a+b)=a^2-b^2\\)","把多出的一個因式單獨提出，其餘配對"],"hint":"指數一個 100、一個 99，先配出 99 對 \\((6-\\sqrt{35})(6+\\sqrt{35})\\)（每對 \\(=1\\)），只剩一個 \\((6-\\sqrt{35})\\)。","sol":["① 原式 \\(=(6-\\sqrt{35})\\cdot\\big[(6-\\sqrt{35})(6+\\sqrt{35})\\big]^{99}\\)。","② 平方差：\\((6-\\sqrt{35})(6+\\sqrt{35})=36-35=1\\)。","③ 所以 \\(=(6-\\sqrt{35})\\cdot1^{99}=6-\\sqrt{35}\\)，選 D。"]},{"n":5,"type":"第八類型：對數與指數函數","body":"設 \\(2^a=5\\)，用 \\(a\\) 表示 \\(\\log_{10}2\\)。","given":["\\(2^a=5\\)"],"options":["\\(\\dfrac{1}{a+1}\\)","\\(a+1\\)","\\(\\dfrac{a}{a+1}\\)","\\(\\dfrac{a+1}{a}\\)","\\(a-1\\)"],"answer":0,"formula":["換底：\\(\\log_{10}2=\\dfrac{\\log_2 2}{\\log_2 10}\\)","\\(\\log_2(xy)=\\log_2 x+\\log_2 y\\)"],"hint":"先把 \\(a\\) 看成 \\(\\log_2 5\\)；再用換底把 \\(\\log_{10}2\\) 寫成以 2 為底，分母 \\(\\log_2 10=1+\\log_2 5\\)。","sol":["① 由 \\(2^a=5\\) 得 \\(a=\\log_2 5\\)。","② \\(\\log_{10}2=\\dfrac{\\log_2 2}{\\log_2 10}=\\dfrac{1}{\\log_2(2\\times5)}\\)。","③ \\(=\\dfrac{1}{\\log_2 2+\\log_2 5}=\\dfrac{1}{1+a}\\)，選 A。"]},{"n":6,"type":"第七類型：代數不等式","body":"若 \\(x\\gt 2\\)，則 \\(\\sqrt{x^{2}-2x+1}+|2-x|=\\)","given":["已知 \\(x\\gt 2\\)"],"options":["\\(-1\\)","\\(2x-3\\)","\\(3-2x\\)","\\(1\\)","\\(2x-1\\)"],"answer":1,"formula":["完全平方：\\(x^2-2x+1=(x-1)^2\\)","\\(\\sqrt{A^2}=|A|\\)；當括號內為正時，絕對值可直接去掉"],"hint":"先把根號內配成完全平方，根號變絕對值；再依 \\(x\\gt 2\\) 判斷每個絕對值內部的正負，去掉絕對值。","sol":["① \\(\\sqrt{x^2-2x+1}=\\sqrt{(x-1)^2}=|x-1|\\)。因 \\(x\\gt 2\\)，\\(x-1\\gt 0\\)，所以 \\(=x-1\\)。","② \\(|2-x|\\)：因 \\(x\\gt 2\\)，\\(2-x\\lt 0\\)，所以 \\(|2-x|=x-2\\)。","③ 相加：\\((x-1)+(x-2)=2x-3\\)，選 B。"]},{"n":7,"type":"第十一類型：數列","body":"某 10 個連續偶數之和為 430，求當中的最大數。","given":["10 個連續偶數，總和為 430"],"options":["\\(34\\)","\\(40\\)","\\(46\\)","\\(52\\)","\\(58\\)"],"answer":3,"formula":["和 \\(=\\) 平均數 \\(\\times\\) 個數","連續偶數公差為 2，對稱分布於平均數兩側"],"hint":"先用「和 ÷ 個數」求平均 43，它落在中間兩個偶數（42、44）之間，再往大的方向每次 +2 數到第 10 個。","sol":["① 平均數 \\(=\\dfrac{430}{10}=43\\)。","② 對稱分布，43 在第 5、6 個之間，即這兩個為 42 與 44。","③ 往後：第 6 個 44、第 7 個 46、第 8 個 48、第 9 個 50、第 10 個（最大）\\(=52\\)，選 D。"]},{"n":8,"type":"第十四類型：解析幾何","body":"直線 \\(x+2y+4=0\\) 和 \\(3x-by+8=0\\) 相交於 \\(y\\) 軸，求 \\(b\\)。","given":["\\(x+2y+4=0\\) 與 \\(3x-by+8=0\\) 相交於 \\(y\\) 軸"],"options":["\\(-16\\)","\\(-8\\)","\\(-4\\)","\\(4\\)","\\(16\\)"],"answer":2,"formula":["\\(y\\) 軸上的點 \\(x=0\\)","交點同時滿足兩條直線方程"],"hint":"「相交於 \\(y\\) 軸」就是交點 \\(x=0\\)。先用第一條線求出交點的 \\(y\\)，再把交點代入第二條線解 \\(b\\)。","sol":["① 交點在 \\(y\\) 軸，故 \\(x=0\\)。","② 代入 \\(x+2y+4=0\\)：\\(2y+4=0\\Rightarrow y=-2\\)，交點 \\((0,-2)\\)。","③ 代入 \\(3x-by+8=0\\)：\\(3(0)-b(-2)+8=0\\Rightarrow2b=-8\\Rightarrow b=-4\\)，選 C。"]},{"n":9,"type":"第七類型：代數不等式","body":"區域 \\(D\\) 由 \\(\\begin{cases}x\\geq0\\\\y\\geq0\\\\x-y\\geq-2\\\\3x+2y\\leq24\\end{cases}\\) 定義，哪些點在 \\(D\\) 內（含邊界）？\n\nI.\\((1,1)\\)　II.\\((4,6)\\)　III.\\((7,0)\\)","given":["不等式組：\\(x\\ge0,\\;y\\ge0,\\;x-y\\ge-2,\\;3x+2y\\le24\\)","逐點檢驗 I、II、III 是否全部滿足"],"options":["只有 I 及 II","只有 I 及 III","只有 II 及 III","I, II 及 III","以上皆非"],"answer":3,"formula":["點在區域內 \\(\\Leftrightarrow\\) 同時滿足所有不等式（含等號＝邊界）"],"hint":"把三個點分別代入四條不等式，每一條都成立（含等號）才算在區域內。","sol":["① \\(\\mathrm{I}\\,(1,1)\\)：\\(1-1=0\\ge-2\\)✓；\\(3+2=5\\le24\\)✓ \\(\\Rightarrow\\) 在 \\(D\\) 內。","② \\(\\mathrm{II}\\,(4,6)\\)：\\(4-6=-2\\ge-2\\)✓（邊界）；\\(12+12=24\\le24\\)✓（邊界）\\(\\Rightarrow\\) 在 \\(D\\) 內。","③ \\(\\mathrm{III}\\,(7,0)\\)：\\(7\\ge-2\\)✓；\\(21\\le24\\)✓ \\(\\Rightarrow\\) 在 \\(D\\) 內。","④ 三點都在 \\(D\\) 內（含邊界），選 D。"]},{"n":10,"type":"第十類型：排列與組合","body":"用 1、3、5、9 組成的所有四位數（不重複數字）之總和是多少？","given":["用 1、3、5、9 組成不重複的四位數，求全部這些數的總和"],"options":["\\(119988\\)","\\(17776\\)","\\(19998\\)","\\(239976\\)","\\(319998\\)"],"answer":0,"formula":["每個數字在每個位上出現次數 \\(=3!=6\\)","位值加權：\\(\\times(1000+100+10+1)=\\times1111\\)"],"hint":"關鍵：每個數字在個、十、百、千位各出現 \\(3!=6\\) 次。先算「每一位的數字和」，再乘 1111。","sol":["① 四位數共 \\(4!=24\\) 個；每個數字在每個位置各出現 \\(\\dfrac{24}{4}=6\\) 次。","② 數字總和 \\(1+3+5+9=18\\)，故每一位的數字和 \\(=6\\times18=108\\)。","③ 全部總和 \\(=108\\times(1000+100+10+1)=1 text{積})=0\\)。","sol":["① 韋達定理：\\(\\alpha+\\beta=3,\\;\\alpha\\beta=1\\)。","② 新根之和 \\(\\alpha^2+\\beta^2=(\\alpha+\\beta)^2-2\\alpha\\beta=9-2=7\\)。","③ 新根之積 \\(\\alpha^2\\beta^2=(\\alpha\\beta)^2=1\\)。","④ 新方程 \\(x^2-7x+1=0\\)，選 B。"]},{"n":13,"type":"第十二類型：直線圖形及圓","body":"若橢圓 \\(\\dfrac{x^2}{a+2}+\\dfrac{y^2}{a^2}=1\\) 的焦點在 \\(y\\) 軸上，則實數 \\(a\\) 的範圍為","given":["橢圓 \\(\\dfrac{x^2}{a+2}+\\dfrac{y^2}{a^2}=1\\)，焦點在 \\(y\\) 軸上"],"options":["\\((-2,+\\infty)\\)","\\((2,+\\infty)\\)","\\((-2,0)\\cup(1,+\\infty)\\)","\\((-\\infty,-1)\\cup(2,+\\infty)\\)","\\((-2,-1)\\cup(2,+\\infty)\\)"],"answer":4,"formula":["焦點在 \\(y\\) 軸 \\(\\Rightarrow\\) \\(y^2\\) 的分母較大","兩分母皆須為正"],"hint":"焦點在 \\(y\\) 軸表示 \\(y^2\\) 的分母最大，即 \\(a^2\\gt a+2\\)；同時兩個分母都要大於 0。把這些條件取交集。","sol":["① 分母為正：\\(a+2\\gt 0\\Rightarrow a\\gt -2\\)（\\(a^2\\gt 0\\) 自動成立，\\(a\\ne0\\)）。","② 焦點在 \\(y\\) 軸：\\(a^2\\gt a+2\\Rightarrow a^2-a-2\\gt 0\\Rightarrow(a-2)(a+1)\\gt 0\\Rightarrow a\\gt 2\\) 或 \\(a\\lt -1\\)。","③ 與 \\(a\\gt -2\\) 取交集：\\((-2,-1)\\cup(2,+\\infty)\\)，選 E。"]},{"n":14,"type":"第十五類型：函數圖形","body":"\\(y=f(x)\\) 的圖像頂點為 \\((2,0)\\)，則 \\(y=f(x-3)+1\\) 的圖像頂點為","given":["由圖：原圖像 \\(y=f(x)\\) 的頂點在 \\((2,0)\\)","平移規則"],"options":["\\((-3,0)\\)","\\((-5,0)\\)","\\((3,1)\\)","\\((5,1)\\)","以上皆非"],"answer":3,"formula":["右移 3：\\(x\\to x-3\\)；上移 1：\\(y\\to y+1\\)"],"hint":"平移口訣：\\(f(x-3)\\) 是「向右移 3」，\\(+1\\) 是「向上移 1」。把頂點座標照這個規則搬移即可。","sol":["① 原頂點 \\((2,0)\\)。","② \\(y=f(x-3)\\)：向右移 3，頂點 \\(x\\) 由 2 變 \\(2+3=5\\)。","③ 再 \\(+1\\)：向上移 1，頂點 \\(y\\) 由 0 變 \\(0+1=1\\)。","④ 新頂點 \\((5,1)\\)，選 D。"],"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIQAAAByCAYAAACSj3mjAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAB34SURBVHhe7V0JdBzVlb29a5dtyYvkVVjeZIxXzG6MF4LBMIEAxjYEE0ICDCGcBM8JZ+YQZsIkZIYkEIaEEAghDDBgIGYxXghgsxljvGC8yYtkW9ZiWbZ2qfead391SS25LduSurta6PZ56uqqUtX/793/3vu/qn5B04LayaSmplorLi6KuI3i9Xq0qqqjWjAYaFnH5fLysjbrukMOHCjWfv3rR7Rjx6oibuf51qxZre3duyfidsrBgwe09es/O62yNTTUa8uWvaq+I23viuzatVNJpG2dkSNHKrTq6 "設 \\(P(n)\\) 為一個命題，且對所有正整數 \\(n\\) 有 \\(P(n)\\Rightarrow P(n+1)\\)。若正整數 \\(m\\) 使得 \\(P(m)\\) 成立，那麼 \\(P(n)\\) 對下列哪一項成立？","given":["\\(P(n)\\Rightarrow P(n+1)\\)（成立可往後一直傳遞）","\\(P(m)\\) 為真"],"options":["對所有正整數 \\(n\\) 都成立","對所有 \\(n\\ge m\\) 成立","對所有 \\(n\\lt m\\) 成立","只對 \\(n=m\\) 成立","以上皆非"],"answer":1,"formula":["數學歸納法的「骨牌效應」：若 \\(P(k)\\) 真且 \\(P(k)\\Rightarrow P(k+1)\\)，則 \\(P(k+1)\\) 也真"],"hint":"想像骨牌：\\(P(m)\\) 倒下後，因為「真會傳給下一個」，所以 \\(m\\) 之後的全部會倒；但 \\(m\\) 之前的不一定，因為箭頭只往「後面」推。","sol":["① 已知 \\(P(m)\\) 為真。","② 由 \\(P(m)\\Rightarrow P(m+1)\\)，得 \\(P(m+1)\\) 真；再 \\(\\Rightarrow P(m+2)\\) 真……如此一直往後。","③ 但箭頭只保證「往後傳遞」，無法回推 \\(m\\) 之前的情形。","④ 因此 \\(P(n)\\) 對所有 \\(n\\ge m\\) 成立，選 B。","（註：本站原列答案 A，但題目條件是「\\(\\Rightarrow\\)（單向推導）」而非「\\(=\\)（恆等）」，正確應為 B；已向使用者匯報。）"]}],"solutions":[{"n":1,"type":"第十六類型：概率和統計","body":"在 \\(1,2,3,\\ldots,1000\\) 中，隨意抽出一個正整數，求以下各事件的概率：<br>(a) 被抽出的數的個位是 3 或 7。（2 分）<br>(b) 被抽出的數不是完全立方數。（3 分）<br>(c) 被抽出的數可被 4 或 5 整除。（3 分）","given":["樣本空間：1 到 1000 共 1000 個整數"],"formula":["機率 \\(=\\dfrac{\\text{符合的個數}}{\\text{總個數}}\\)","對立事件：\\(P(\\text{不是})=1-P(\\text{是})\\)","排容原理：\\(|A\\cup B|=|A|+|B|-|A\\cap B|\\)"],"hint":"(a) 只看「個位數」，每 10 個數中個位是 3 或 7 的恰有 2 個。(b) 先算「是立方數」的機率再用 1 減。(c) 排容：被 4 的加被 5 的，扣掉重複（被 20）的。","sol":["<b>(a)</b> 每連續 10 個整數中，個位數是 3 或 7 的恰有 2 個（如 3、7）。","機率 \\(P=\\dfrac{2}{10}=\\dfrac{1}{5}\\)。","<b>(b)</b> 1 到 1000 的完全立方數為 \\(1^3,2^3,\\ldots,10^3(=1000)\\)，共 10 個。","「是立方數」機率 \\(=\\dfrac{10}{1000}=\\dfrac{1}{100}\\)；故「不是立方數」機率 \\(P=1-\\dfrac{1}{100}=\\dfrac{99}{100}\\)。","<b>(c)</b> 被 4 整除 \\(1000\\div4=250\\) 個；被 5 整除 \\(1000\\div5=200\\) 個；被 20 整除 \\(1000\\div20=50\\) 個。","排容原理：被 4 或 5 整除共 \\(250+200-50=400\\) 個，機率 \\(P=\\dfrac{400}{1000}=\\dfrac{2}{5}\\)。"]},{"n":2,"type":"第十四類型：解析幾何","body":"已知點 \\(A(-1,2)\\) 和 \\(B(0,5)\\)。<br>(a) 若直線 \\(y=mx+b\\) 是線段 \\(AB\\) 的垂直平分線，求 \\(m\\) 和 \\(b\\)。（4 分）<br>(b) 圓 \\(C\\) 通過 \\(A\\)、\\(B\\) 兩點，且圓心在直線 \\(2x+y=5\\) 上，求圓 \\(C\\) 的標準方程。（4 分）","given":["\\(A(-1,2)\\)，\\(B(0,5)\\)","(b) 圓心在 \\(2x+y=5\\) 上"],"formula":["中點 \\(\\left(\\dfrac{x_1+x_2}{2},\\dfrac{y_1+y_2}{2}\\right)\\)","兩線垂直：斜率乘積 \\(=-1\\)","圓的標準式 \\((x-h)^2+(y-k)^2=r^2\\)"],"hint":"(a) 垂直平分線過 \\(AB\\) 中點，且斜率與 \\(AB\\) 互為負倒數。(b) 圓心必在 \\(AB\\) 的垂直平分線上，與題給直線聯立求圓心，再用圓心到 \\(B\\) 的距離求半徑。","sol":["<b>(a)</b> \\(AB\\) 斜率 \\(=\\dfrac{5-2}{0-(-1)}=3\\)，故垂直平分線斜率 \\(m=-\\dfrac{1}{3}\\)。","\\(AB\\) 中點 \\(\\left(-\\dfrac{1}{2},\\dfrac{7}{2}\\right)\\) 代入 \\(y=mx+b\\)：\\(\\dfrac{7}{2}=-\\dfrac{1}{3}\\!\\left(-\\dfrac{1}{2}\\right)+b\\Rightarrow b=\\dfrac{7}{2}-\\dfrac{1}{6}=\\dfrac{10}{3}\\)。","所以 \\(m=-\\dfrac{1}{3}\\)，\\(b=\\dfrac{10}{3}\\)。","<b>(b)</b> 圓心在垂直平分線 \\(y=-\\dfrac{1}{3}x+\\dfrac{10}{3}\\)（即 \\(x+3y=10\\)）上，也在 \\(2x+y=5\\) 上。","聯立：\\(y=5-2x\\) 代入 \\(x+3y=10\\)：\\(x+3(5-2x)=10\\Rightarrow-5x=-5\\Rightarrow x=1,\\;y=3\\)。圓心 \\((1,3)\\)。","半徑平方 \\(r^2=(1-0)^2+(3-5)^2=1+4=5\\)。圓 \\(C\\)：\\((x-1)^2+(y-3)^2=5\\)。"],"img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMjcyIiB2aWV3Qm94PSIwIDAgMzAwIDI3MiIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsICdUaW1lcyBOZXcgUm9tYW4nLCBzZXJpZiwgJ05vdG8gU2VyaWYgVEMnLCdTb25ndGkgVEMnLCdNaWNyb3NvZnQgSmhlbmdIZWknLCdQaW5nRmFuZyBUQyciPgogIDwhLS0gMjAxOSDop6PnrZTnrKwy6aGM77yaQSgtMSwyKeOAgUIoMCw1Ke+8jOWckyBDIOWck+W/gygxLDMpIHI94oiaNe+8jEwg54K6IEFCIOWeguebtOW5s+WIhue3miAtLT4KICA8IS0tIOaYoOWwhO+8miBweCA9IDEyMCArIDQweCDvvIwgcHkgPSAyMzAgLSA0MHkgLS0+CiAgPCEtLSDlnJMgQyAtLT4KICA8Y2lyY2xlIGN4PSIxNjAiIGN5PSIxMTAiIHI9Ijg5LjQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzFmOGE0YyIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgPCEtLSB4IOi7uCAtLT4KICA8bGluZSB4MT0iOCIgeTE9IjIzMCIgeDI9IjI4OCIgeTI9IjIzMCIgc3Ryb2tlPSIjMjIyIiBzdHJva2Utd2lkdGg9IjEuNCIvPgogIDxwb2x5Z29uIHBvaW50cz0iMjg4LDIzMCAyODAsMjI2IDI4MCwyMzQiIGZpbGw9IiMyMjIiLz4KICA8IS0tIHkg6Lu4IC0tPgogIDxsaW5lIHgxPSIxMjAiIHkxPSIyNjIiIHgyPSIxMjAiIHkyPSI4IiBzdHJva2U9IiMyMjIiIHN0cm9rZS13aWR0aD0iMS40Ii8+CiAgPHBvbHlnb24gcG9pbnRzPSIxMjAsOCAxMTYsMTYgMTI0LDE2IiBmaWxsPSIjMjIyIi8+CiAgPCEtLSDnt5rmrrUgQUIgLS0+CiAgPGxpbmUgeDE9IjgwIiB5MT0iMTUwIiB4Mj0iM x}{40}-\\frac{x}{50}=\\frac{x}{200}\\Rightarrow x=230\\) 公里。"]},{"n":3,"type":"第十一類型：數列","body":"已知數列 \\(\\{a_n\\}_{n\\geq1}\\) 滿足 \\(a_{n+1}=a_n+\\dfrac{2n+1}{n^2(n+1)^2}\\) 及 \\(a_1=0\\)。\n\n(a) 求 \\(a_2,a_3,a_4\\) 的值。（3 分）\n(b) 猜測通項公式，並用數學歸納法證明。（5 分）","given":["\\(a_{n+1}=a_n+\\dfrac{2n+1}{n^2(n+1)^2}\\)，\\(a_1=0\\)"],"formula":["\\(\\dfrac{2n+1}{n^2(n+1)^2}=\\dfrac{1}{n^2}-\\dfrac{1}{(n+1)^2}\\)（裂項）"],"hint":"由 (a) 的計算值猜測 \\(a_n=\\dfrac{n^2-1}{n^2}\\)，再用歸納法。","sol":["<b>(a)</b> \\(a_2=\\frac{3}{4}\\)，\\(a_3=\\frac{8}{9}\\)，\\(a_4=\\frac{15}{16}\\)。","<b>(b)</b> 猜測 \\(a_n=\\frac{n^2-1}{n^2}\\)。歸納：設 \\(a_k=\\frac{k^2-1}{k^2}\\)，則 \\(a_{k+1}=\\frac{k^2-1}{k^2}+\\frac{2k+1}{k^2(k+1)^2}=\\frac{(k^2-1)(k+1)^2+2k+1}{k^2(k+1)^2}=\\frac{(k+1)^2-1}{(k+1)^2}\\)，成立。\\(\\square\\)"]},{"n":4,"type":"第八類型：對數與指數函數","body":"已知關於 \\(x\\) 的方程 \\(a^{2x-4}-5a^{x-2}+6=0\\) 有一個根為 3，其中 \\(a\\) 為常數。\n\n(a) 求 \\(a\\) 的值。（4 分）\n(b) 求方程其餘的根。（4 分）","given":["\\(a^{2x-4}-5a^{x-2}+6=0\\) 的一根為 \\(x=3\\)"],"formula":["令 \\(t=a^{x-2}\\)，方程化為 \\(t^2-5t+6=0\\)"],"hint":"代入 \\(x=3\\) 得 \\(a^2-5a+6=0\\)，解 \\(a\\)；再令 \\(t=a^{x-2}\\) 解其餘根。","sol":["<b>(a)</b> \\(a^2-5a+6=0\\Rightarrow a=2\\) 或 \\(a=3\\)。","<b>(b)</b> \\(a=2\\)：\\(2^{x-2}=2\\) 或 \\(3\\)，\\(x=3\\) 或 \\(x=\\log_2 3+2\\)。\\(a=3\\)：\\(3^{x-2}=2\\) 或 \\(3\\)，\\(x=\\log_3 2+2\\) 或 \\(3\\)。其餘根為 \\(\\log_2 3+2\\) 及 \\(\\log_3 2+2\\)。"]},{"n":5,"type":"第十二類型：直線圖形及圓","body":"設 \\(x^2+y^2-4x-6y-12=0\\)、\\(3y=(3\\tan30^\\circ)x+9-2\\sqrt{3}\\) 和 \\(y=(\\tan60^\\circ)x-(2\\sqrt{3}-3)\\) 分別為圓 \\(C\\)、直線 \\(\\ell_1\\) 和 \\(\\ell_2\\) 的方程。設 \\(A,B\\) 分別為 \\(\\ell_1,\\ell_2\\) 與 \\(C\\) 的交點（\\(x\\) 座標均 \\(>3\\)）。\n\n(a) 求 \\(C\\) 的半徑 \\(r\\) 及圓心 \\(P\\) 的座標。（2 分）\n(b) 證明 \\(\\ell_1\\) 和 \\(\\ell_2\\) 均通過 \\(P\\)。（3 分）\n(c) 求 \\(\\triangle PAB\\) 的面積。（3 分）","given":["圓 \\(C\\)、直線 \\(\\ell_1,\\ell_2\\)","\\(\\tan30^\\circ=1/\\sqrt{3}\\)，\\(\\tan60^\\circ=\\sqrt{3}\\)"],"formula":["配方法求圓心與半徑","面積 \\(=\\frac{1}{2}PA\\cdot PB\\sin\\angle APB\\)"],"hint":"(a \\)","\\(\\dfrac{35}{2}\\)","\\(\\dfrac{20}{3}\\)","\\(\\dfrac{60}{7}\\)"],"answer":4,"formula":["工作效率（每小時完成量）= \\(\\dfrac{1}{\\text{單獨所需時間}}\\)","合作效率 = 各人效率之和","時間 = \\(\\dfrac{\\text{總工作量}}{\\text{合作效率}}\\)"],"hint":"先算兩人各自每小時完成幾分之幾，相加得合作每小時的完成量。再用「總量 5 ÷ 合作效率」求時間。","sol":["瑪麗每小時 \\(\\frac{1}{4}\\) 件，約翰每小時 \\(\\frac{1}{3}\\) 件。","合作效率 \\(= \\frac{1}{4} + \\frac{1}{3} = \\frac{7}{12}\\)（件／小時）。","完成 5 件需時 \\(= \\frac{5}{7/12} = \\frac{60}{7}\\) 小時，選 E。"]},{"n":3,"type":"第十一類型：數列","body":"有一等差數列前 \\(n\\) 項之總和為 \\(n^2\\)，求此數列的第 10 項。","given":["前 \\(n\\) 項和 \\(S_n = n^2\\)","求第 10 項 \\(a_{10}\\)"],"options":["\\(19\\)","\\(21\\)","\\(28\\)","\\(31\\)","\\(40\\)"],"answer":0,"formula":["由和求項：\\(a_n = S_n - S_{n-1}\\)（\\(n \\geq 2\\)）"],"hint":"用 \\(a_n = S_n - S_{n-1}\\)。把 \\(S_n = n^2\\) 與 \\(S_{n-1} = (n-1)^2\\) 相減就得到通項。","sol":["\\(a_n = S_n - S_{n-1} = n^2 - (n-1)^2 = 2n - 1\\)。","\\(a_{10} = 2(10) - 1 = 19\\)，選 A。"]},{"n":4,"type":"第五類型：二次方程及二次函數","body":"若對所有實數 \\(x\\)，\\(y = mx^2 + 6x + 3m\\) 都為正數，求 \\(m\\) 的取值範圍。","given":["\\(y = mx^2 + 6x + 3m\\)","對所有實數 \\(x\\)，\\(y > 0\\)","求 \\(m\\) 的範圍"],"options":["\\(0 < m < \\sqrt{3}\\)","\\(m > \\sqrt{3}\\)","\\(-\\sqrt{3} < m < \\sqrt{3}\\)","\\(-\\sqrt{3} < m < 0\\)","以上皆非"],"answer":1,"formula":["二次函數恆正 \\(\\Leftrightarrow\\) 開口向上（\\(a>0\\)）且判別式 \\(\\Delta < 0\\)","\\(\\Delta = b^2 - 4ac\\)"],"hint":"二次式恆為正，需要兩個條件同時成立：開口向上（\\(m>0\\)），且圖像不與 \\(x\\) 軸相交（\\(\\Delta<0\\)）。","sol":["恆正需 \\(m > 0\\) 且判別式 \\(\\Delta = 36 - 4m(3m) < 0\\)。","\\(36 - 12m^2 < 0 \\Rightarrow m^2 > 3 \\Rightarrow m > \\sqrt{3}\\)（取正）。","結合 \\(m>0\\)，得 \\(m > \\sqrt{3}\\)，選 B。"]},{"n":5,"type":"第五類型：二次方程及二次函數","body":"已知 \\(-2x^2+3x-7=0\\) 的根為 \\(\\alpha\\) 和 \\(\\beta\\)。下列哪一個方程的根為 \\(\\dfrac{1}{\\alpha}\\) 和 \\(\\dfrac{1}{\\beta}\\)？","given":["\\(-2x^2+3x-7=0\\) 的兩根為 \\(\\alpha, \\beta\\)","求以 \\(\\dfrac{1}{\\alpha}, \\dfrac{1}{\\beta}\\) 為根的方程"],"options":["\\(x^2 - 3x + 7 = 0\\)","\\(7x^2 - 3x + 2 = 0\\)","\\(7x^2 + 3x + 2 = 0\\)","\\(2x^2 - 3x - 7 = 0\\)","以上皆非"],"answer":1,"formula":["韋達定理：\\(\\alpha+\\beta = -\\dfrac{b}{a}\\)，\\(\\alpha\\beta = \\dfrac{c}{a}\\)","倒數和：\\(\\dfrac{1}{\\alpha}+\\dfrac{1}{\\beta} = \\dfrac{\\alpha+\\beta}{\\alpha\\beta}\\)，倒數積：\\(\\dfrac{1}{\\alpha\\beta}\\)","由根重建方程：\\(x^2 - (\\text{根和})x + (\\text{根積}) = 0\\)"],"hint":"先用韋達定理求 \\(\\alpha+\\beta\\) 與 \\(\\alpha\\beta\\)，再算新根的和 \\(\\frac{1}{\\alpha}+\\frac{1}{\\beta}\\) 與積 \\(\\frac{1}{\\alpha\\beta}\\)，最後用「和與積」反推方程。","sol":["原方程化為 \\(2x^2 - 3x + 7 = 0\\)，韋達：\\(\\alpha+\\beta = \\frac{3}{2}\\)，\\(\\alpha\\beta = \\frac{7}{2}\\)。","新根和 \\(= \\frac{\\alpha+\\beta}{\\alpha\\beta} = \\frac{3/2}{7/2} = \\frac{3}{7}\\)；新根積 \\(= \\frac{1}{\\alpha\\beta} = \\frac{2}{7}\\)。","方程：\\(x^2 - \\frac{3}{7}x + \\frac{2}{7} = 0\\)，乘 7 得 \\(7x^2 - 3x + 2 = 0\\)，選 B。"]},{"n":6,"type":"第十二類型：直線圖形及圓","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa4AAADrCAIAAAC+deWmAAAyFklEQVR4nO2dfUDT5fr/3wge0AX4NF0tFBSTzC3zIQPER9RQ+/mQgkBZftVTcpAyTmnaF4Rz1OxEJj6V6fGbBRqJSSp+TXwGUdTUzQfsSzpBEh0nBVxttsnvj/vDh4WKU9nuz3bfr7+uzc+2i7m9d133dd3X7VZbWwsOh8Nhm2a0HeBwOBz6cCnkcDgceNB2gGMv/vrXv164cKHBnQMGDEhKSqLiD4cjZbgUuianT5/+4osvvLy8fH19xTuvXbs2fvx4il5xOJLFjZdNXJLZs2c/++yzkyZNatZMWAMpLy/39/e/fPlyhw4d6PrG4UgQHhW6Ji+++OLgwYOt79m0aVNYWBjXQQ7nrnApdE0a6CCArKysV199tfFHXbp0KTs7u7KyMigoKCoqytPTk9x/5syZbdu2zZ49+9dff/3666+vX7/+yiuvdOnSBcAPP/ywf//+gICA119/3cODf5w4TksthwEuX77cvHnza9euNXLN559/3r9///379x8+fDggIODpp5/W6/WXL1/+r//6LwAdOnQ4fPjw8OHDx4wZ85e//KV169aXLl164403wsPDe/bsCWD69OkO+3M4nCaHSyETfPrpp0OHDm3kgt27d7ds2bK0tJTcnD17NoCPP/6Y3AwICJDJZJmZmeTmihUrAAwcOPDUqVO1tbUWiyU4ONjd3d1gMNjzj+Bw7AjPaJjg22+/nTx5ciMXLFy4MCQkxM/Pj9ycNWtW69atJ0yYQG526NDht99+i46OJjfDwsIABAcHq9VqAM2aNXv++ecLCwsrKio6d+5sxz+Dw7EbvMXa9fnll1+Kiooab6PJz89XKpXizQ4dOsyePbtTp07kpru7u/XFLVq0AFBr1Xvg5eUF4NatW03oNofjSLgUuj6bNm0aNGhQu3bt7nWByWQymUwVFRWO9IrDkRRcCl2fb7/9NjIyspELPD09vb29Dx8+fPPmTev7Dx48aGfXOBypwKXQxbly5UpRUdG4ceMav2zw4MFVVVVLliwR7/nxxx/PnDljZ+84HKnAyyYuDsmO27Zt2/hlH3zwQW5ubnJy8pUrV4YMGXL27NmtW7fu t)^3 - m\\left(-\\frac{1}{2}\\right) - m = -16\\left(-\\frac{1}{8}\\right) + \\frac{m}{2} - m = 2 - \\frac{m}{2}\\)。","令 \\(2 - \\frac{m}{2} = 0\\)，得 \\(m = 4\\)，選 D。"]},{"n":9,"type":"第一類型：基本概念","body":"\\(103^{10}\\) 的十位數字（右面起計第二個數字；例如 43128 的十位數字是 2）是多少？","given":["求 \\(103^{10}\\) 的十位數字（倒數第二位）"],"options":["\\(2\\)","\\(3\\)","\\(4\\)","\\(7\\)","以上皆非"],"answer":2,"formula":["十位數字由「該數 \\(\\bmod 100\\)」（末兩位）決定","二項展開：\\((100+3)^{10}\\) 中含 \\(100\\) 的項對末兩位無貢獻"],"hint":"只需算 \\(103^{10}\\) 的末兩位，即 \\(\\bmod 100\\)。把 \\(103 = 100+3\\)，展開後含 100 的項都被 100 整除，只剩 \\(3^{10}\\)。","sol":["末兩位由 \\(103^{10} \\bmod 100\\) 決定。\\((100+3)^{10}\\) 中除最後一項外都含因數 100，對末兩位無影響。","故只需 \\(3^{10} \\bmod 100\\)。\\(3^{10} = 59049\\)，末兩位為 49。","十位數字為 4，選 C。"]},{"n":10,"type":"第八類型：對數與指數函數","body":"若 \\(\\log_4 x = y - 3\\) 及 \\(2(\\log_4 x)^2 = 4 - y\\)，求 \\(x\\)。","given":["\\(\\log_4 x = y - 3\\)","\\(2(\\log_4 x)^2 = 4 - y\\)","求 \\(x\\)"],"options":["\\(\\dfrac{1}{4}\\) 或 \\(2\\)","\\(\\dfrac{1}{2}\\) 或 \\(4\\)","\\(\\dfrac{7}{2}\\) 或 \\(2\\)","\\(\\dfrac{1}{4}\\) 或 \\(\\dfrac{7}{2}\\)","\\(2\\) 或 \\(4\\)"],"answer":0,"formula":["換元：令 \\(u = \\log_4 x\\)","\\(\\log_4 x = u \\Leftrightarrow x = 4^u\\)"],"hint":"令 \\(u = \\log_4 x\\)。由第一式 \\(y = u + 3\\)，代入第二式得只含 \\(u\\) 的二次方程，解出 \\(u\\) 再回求 \\(x = 4^u\\)。","sol":["令 \\(u = \\log_4 x\\)，由第一式 \\(y = u + 3\\)。","代入第二式：\\(2u^2 = 4 - (u+3) = 1 - u\\)，即 \\(2u^2 + u - 1 = 0\\)。","因式分解 \\((2u-1)(u+1) = 0\\)，得 \\(u = \\frac{1}{2}\\) 或 \\(u = -1\\)。","\\(x = 4^{1/2} = 2\\) 或 \\(x = 4^{-1} = \\frac{1}{4}\\)，選 A。"]},{"n":11,"type":"第十五類型：函數圖形","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaYAAAFUCAIAAADgSQ9GAAAjz0lEQVR4nO3de1CTV/oH8BMISI0VEINRFEFaLVqiLlZ2RUet2C3WtqJdbMC10/Gy9UbruF1vHRV7cbZbli69uLPan61yGRgp2tY6SlpwG9xSa4uhKqutxAsSiIoX4qIE8vvjlNMUuSbvm5M37/cz/eOYQvJ4+/q+5z3nOQq73U4AAOTBh3cBAADug8gDABlB5AGAjCDyAEBGEHkAICOIPACQEUQeAMgIIg8AZASRBwAygsgDABlB5AGAjCDyAEBGEHkAICOIPACQEUQeAMgIIg8AZASRBwAygsgDABlB5AGAjCDyAEBGEHkAICOIPACQEUQeAMgIIg8AZASRBwAy }{2}\\) 處達最小值"],"options":["\\(y = 3 + 2\\cos\\dfrac{x}{2}\\)","\\(y = 3 + 2\\cos 2x\\)","\\(y = 3 + 2\\cos x\\)","\\(y = 1 + 2\\cos\\dfrac{x}{2}\\)","\\(y = 1 + 2\\cos 2x\\)"],"answer":1,"formula":["\\(y = b + a\\cos(\\omega x)\\)：最大 \\(b+|a|\\)、最小 \\(b-|a|\\)、週期 \\(\\dfrac{2\\pi}{\\omega}\\)","\\(\\cos\\) 在 \\(x=0\\) 取最大"],"hint":"先由最大值 5、最小值 1 定出中線 \\(b=3\\)、振幅 \\(|a|=2\\)。再由「最小值出現在 \\(x=\\frac{\\pi}{2}\\)」定出週期，反推 \\(\\omega\\)。","sol":["最大 5、最小 1，故中線 \\(b = 3\\)、振幅 \\(a = 2\\)，排除 D、E。","圖在 \\(x=0\\) 取最大值 5（\\(\\cos 0 = 1\\)），符合 \\(\\cos\\) 型。","最小值在 \\(x = \\frac{\\pi}{2}\\)，即半週期 \\(= \\frac{\\pi}{2}\\)，週期 \\(= \\pi\\)，所以 \\(\\omega = 2\\)。","故 \\(y = 3 + 2\\cos 2x\\)，選 B。"]},{"n":12,"type":"第十四類型：解析幾何","body":"已知點 \\(P(-1, -3)\\) 和 \\(Q(5, -1)\\)，求 \\(PQ\\) 的垂直平分線的方程。","given":["\\(P(-1, -3)\\)，\\(Q(5, -1)\\)","求 \\(PQ\\) 的垂直平分線方程"],"options":["\\(x + 3y - 4 = 0\\)","\\(x - 3y + 4 = 0\\)","\\(x + 3y + 4 = 0\\)","\\(3x - y - 4 = 0\\)","\\(3x + y - 4 = 0\\)"],"answer":4,"formula":["中點：\\(\\left(\\dfrac{x_1+x_2}{2}, \\dfrac{y_1+y_2}{2}\\right)\\)","垂直平分線過中點，斜率為 \\(PQ\\) 斜率的負倒數","點斜式：\\(y - y_0 = m(x - x_0)\\)"],"hint":"垂直平分線會通過 \\(PQ\\) 的中點，且與 \\(PQ\\) 垂直。先求中點與 \\(PQ\\) 斜率，取負倒數後用點斜式。","sol":["中點 \\(M = \\left(\\frac{-1+5}{2}, \\frac{-3-1}{2}\\right) = (2, -2)\\)。","\\(PQ\\) 斜率 \\(= \\frac{-1-(-3)}{5-(-1)} = \\frac{2}{6} = \\frac{1}{3}\\)，垂直線斜率 \\(= -3\\)。","點斜式：\\(y + 2 = -3(x - 2)\\)，化簡得 \\(3x + y - 4 = 0\\)，選 E。"]},{"n":13,"type":"第十六類型：概率和統計","body":"若一組數據 \\(x_1, x_2, \\ldots, x_n\\) 的平均數和方差分別為 1 和 0.01，則數據 \\(10x_1, 10x_2, \\ldots, 10x_n\\) 的平均數和方差分別是多少？","given":["原數據平均數 = 1，方差 = 0.01","每個數據乘以 10，求新的平均數與方差"],"options":["1 和 0.01","10 和 0.1","1 和 1","10 和 1","100 和 1"],"answer":3,"formula":["數據乘 \\(k\\)：平均數變為 \\(k\\) 倍","數據乘 \\(k\\)：方差變為 \\(k^2\\) 倍"],"hint":"資料整體乘以 10：平均數也乘 10；但方差因為是「平方」的量，會乘以 \\(10^2 = 100\\)。","sol":["乘以 10 後，平均數 \\(= 10 \\times 1 = 10\\)。","方差 \\(= 10^2 \\times 0.01 = 100 \\times 0.01 = 1\\)。","故為 10 和 1，選 D。"]},{"n":14,"type":"第六類型：指數及根式","body":"化簡 \\(\\dfrac{\\sqrt{140} - \\sqrt{132}}{\\sqrt{35} + \\sqrt{33}}\\)。","given":["化簡 \\(\\dfrac{\\sqrt{140} - \\sqrt{132}}{\\sqrt{35} + \\sqrt{33}}\\)"],"options":["\\(68 - 2\\sqrt{1155}\\)","\\(68 - \\sqrt{1155}\\)","\\(\\dfrac{34 - \\sqrt{1155}}{2}\\)","\\(34 - \\sqrt{1155}\\)","\\(68 + 2\\sqrt{1155}\\)"],"answer":0,"formula":["\\(\\sqrt{4a} = 2\\sqrt{a}\\)","分母有理化：乘以共軛 \\((\\sqrt{p}-\\sqrt{q})\\)","\\((\\sqrt{p}-\\sqrt{q})^2 = p + q - 2\\sqrt{pq}\\)"],"hint":"先把分子的 \\(\\sqrt{140}, \\sqrt{132}\\) 各提出 \\(\\sqrt{4}=2\\)，會出現與分母相同的 \\(\\sqrt{35}, \\sqrt{33}\\)。再用分母有理化（乘共軛）。","sol":["分子：\\(\\sqrt{140} - \\sqrt{132} = 2\\sqrt{35} - 2\\sqrt{33} = 2(\\sqrt{35} - \\sqrt{33})\\)。","原式 \\(= \\frac{2(\\sqrt{35}-\\sqrt{33})}{\\sqrt{35}+\\sqrt{33}}\\)，分子分母同乘 \\((\\sqrt{35}-\\sqrt{33})\\)。","\\(= \\frac{2(\\sqrt{35}-\\sqrt{33})^2}{35 - 33} = \\frac{2(68 - 2\\sqrt{1155})}{2} = 68 - 2\\sqrt{1155}\\)，選 A。"]},{"n":15,"type":"第七類型：代數不等式","body":"若 \\(\\dfrac{5}{a} + \\dfrac{4}{b} = 3\\)（\\(a, b > 0\\)），求 \\(ab\\) 的最小值。","given":["\\(\\dfrac{5}{a} + \\dfrac{4}{b} = 3\\)，\\(a, b > 0\\)","求 \\(ab\\) 的最小值"],"options":["\\(\\dfrac{20}{9}\\)","\\(\\dfrac{20}{3}\\)","\\(\\dfrac{80}{9}\\)","\\(\\dfrac{80}{3}\\)","\\(\\dfrac{\\sqrt{20}}{3}\\)"],"answer":2,"formula":["算術-幾何平均不等式：\\(p + q \\geq 2\\sqrt{pq}\\)（\\(p, q > 0\\)）","等號成立於 \\(p = q\\)"],"hint":"把 \\(\\frac{5}{a}\\) 與 \\(\\frac{4}{b}\\) 看成兩個正數，用算幾不等式 \\(3 \\geq 2\\sqrt{\\frac{5}{a}\\cdot\\frac{4}{b}}\\)，整理出 \\(ab\\) 的下界。","sol":["由算幾不等式：\\(3 = \\frac{5}{a} + \\frac{4}{b} \\geq 2\\sqrt{\\frac{5}{a}\\cdot\\frac{4}{b}} = 2\\sqrt{\\frac{20}{ab}}\\)。","平方：\\(9 \\geq 4\\cdot\\frac{20}{ab}\\)，得 \\(ab \\geq \\frac{80}{9}\\)。","等號當 \\(\\frac{5}{a} = \\frac{4}{b} = \\frac{3}{2}\\) 時成立，最小值 \\(\\frac{80}{9}\\)，選 C。"]}],"solutions":[{"n":1,"type":"第十六類型：概率和統計","body":"書架上有中文書 4 本、英文書 2 本、數學書 3 本。<br>(a) 隨機選取 3 本書，求取得中、英、數各一本的概率。（3 分）<br>(b) 將這九本書隨機重新排列，求同類書籍排在一起的概率。（5 分）<br>[注：以最簡分數表示答案。]","given":["中文書 4 本、英文書 2 本、數學書 3 本（共 9 本）","(a) 取 3 本，求中英數各一本的概率","(b) 九本重排，求同類排在一起的概率"],"formula":["組合數：\\(\\binom{n}{k} = \\dfrac{n!}{k!(n-k)!}\\)","古典概率 = \\(\\dfrac{\\text{有利情形}}{\\text{總情形}}\\)","捆綁法：把同類視為一組先排組、組內再排"],"hint":"(a) 分母用「9 本取 3」的組合，分子用「各類各取一本」的乘法。(b) 用捆綁法：三類各自捆成一綑（3! 種排法），每綑內部再各自排列（4!、2!、3!），分母是 9! 全排列。","sol":["<b>(a)</b> 總取法 \\(\\binom{9}{3} = 84\\)。各取一本：\\(4 \\times 2 \\times 3 = 24\\)。","概率 \\(= \\frac{24}{84} = \\frac{2}{7}\\)。","<b>(b)</b> 同類相鄰用捆綁法：三綑的排序 \\(3!\\)，組內排列 \\(4! \\times 2! \\times 3!\\)。","概率 \\(= \\frac{3! \\cdot 4! \\cdot 2! \\cdot 3!}{9!} = \\frac{6 \\cdot 24 \\cdot 2 \\cdot 6}{362880} = \\frac{1}{210}\\)。"]},{"n":2,"type":"第十四類型：解析幾何","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbMAAAFoCAIAAABSdoI8AAAu9ElEQVR4nO3dfVwTh/0H8C8IioBYyw+I9aGgVsVJxCrTqi3qwNaHOq1aCVhbu7oWRCjq+uv6miBot9X5UI2tbuq2VoHq5vZrLagYoQqh1eEmoVgVK1BWDcGCKLEKgfz+uHjEQEKe73L5vF999XV3ubt8PeHj9549tFotAQCAHk+uCwAA4B0kIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCEkIwCAISQjAIAhJCMAgCHXSMZLly5pNBpm+N69e5WVldzWAwDCxvdkLCoqWrRoUXh4+NGjR5kpe/fuFYvF165d47YwABAwvifjjBkzjhw5Mnz48JKSEmZKfHz89OnTtVott4UBgIDxPRkZY8aMqaurY4YDAwMjIyOHDx/ObUkAIGCukYwikai+vp4Z/vjjj5cuXcptPQAgbK6RjMHBwUqlkoiuX7+uUql++tOfcl0RAAiZayRjSEhIfX19R0eHVCpNTU3luhwAEDiXScbm5uYtW7YkJiZ6e3tzXQ4ACJxrJGNwcHCvXr3Gjx8/dOhQrmsBAOFzjWTs6OjYuXNnbGws14UAgFtwgWSsq6u7cOFCUlIS14UAgLvgbzLW1dVlZmZevHhx3759aWlpXJcDAG7Ei+sCjCoqKtq8eXN7e/uGDRs8PDy4LgcA3IgHn2+z6+jo8PTkb1cLAELF62QEAOAEOjIAAEOulIwNDQ1clwAAbsGVkjE+Pp7rEgDALbhMMjY0NMhksoqKCq4LAQDhc5lkPHToEBH985//5LoQABA+lzk3PW7cOIVCIRKJbty4wXUtACBwrpGMDQ0NwcHBzLBCoYiIiOC2HgAQNtfYmz558iQ7jB1qAHA01+gZY2NjZTIZM4wdagBwNBdIRrVa7e/vrz8FO9QA4FAusDd9+vRpgynYoQYAh3KBZNy+fTsRiUQiIhKLxSKRaPfu3VwX5XZSU1PlcjnXVQA4Cd+TUa1Wy2SykpKSGTNmENFPfvIThUJBRLjk25nkcvnOnTunTZumVqu5rgXAGfiejKdPny4pKZk6dSo7JSgoSKFQdN3FBsdhHqiemZnp5+fHdS0AzsDfJ9cyZs2a5eVlWGRQUNCKFSs4qccNyeVypk9fu3Yt17UAOAnfe8auschA8+I0aBjBDfE9GYFbaBjBPSE  值達至最大。（3 分）<br>(c) 由此決定使 \\(y\\) 最大的 \\(x\\) 值（以 \\(a, m\\) 表示）。（2 分）","given":["\\(x, y > 0\\)，\\(y^2 - 2myx + x^2 = a^2\\)","\\(a, m\\) 為常數，\\(0 < m < 1\\)","(a)(b)(c) 三個證明/求值"],"formula":["配方法：把含 \\(x\\) 的項湊成完全平方 \\((x - my)^2\\)","完全平方非負：\\((x-my)^2 \\geq 0\\)，等號當 \\(x = my\\)"],"hint":"(a) 把已知式右邊展開 \\((x-my)^2\\) 對照即可。(b) 由 (a) 解出 \\(y^2 = \\frac{a^2-(x-my)^2}{1-m^2}\\)；因 \\((x-my)^2 \\geq 0\\)，當它為 0（即 \\(x=my\\)）時 \\(y^2\\) 最大。注意 \\(x=my\\) 等價於 \\(y = \\frac{x}{m}\\)。(c) 把 \\(x=my\\) 代回求最大 \\(y\\)，再解出 \\(x\\)。","sol":["<b>(a)</b> 右邊 \\(a^2 - (x-my)^2 = a^2 - (x^2 - 2mxy + m^2y^2) = a^2 - x^2 + 2mxy - m^2y^2\\)。","由已知 \\(a^2 = y^2 - 2mxy + x^2\\) 代入：\\(= y^2 - m^2 y^2 = (1-m^2)y^2\\)。得證。","<b>(b)</b> 由 (a)：\\(y^2 = \\frac{a^2 - (x-my)^2}{1-m^2}\\)。因 \\(0<m<1\\) 故 \\(1-m^2>0\\)。","\\((x-my)^2 \\geq 0\\)，當 \\(x = my\\)（即 \\(y = \\frac{x}{m}\\)）時 \\((x-my)^2 = 0\\)，\\(y^2\\) 達最大 \\(\\frac{a^2}{1-m^2}\\)。因 \\(y>0\\)，\\(y\\) 也最大。","<b>(c)</b> 最大 \\(y_{\\max} = \\frac{a}{\\sqrt{1-m^2}}\\)（取 \\(a>0\\)）。由 \\(x = my\\) 得 \\(x = m y_{\\max} = \\frac{ma}{\\sqrt{1-m^2}}\\)。"]},{"n":4,"type":"第十一類型：數列","body":"在等差數列 \\(\\{a_n\\}_{n \\geq 1}\\) 中，已知 \\(a_2 = 3\\) 及 \\(a_{20} = 39\\)。<br>(a) 求 \\(\\{a_n\\}\\) 的通項。（3 分）<br>(b) 設數列 \\(\\left\\{\\dfrac{1}{a_n a_{n+1}}\\right\\}\\) 的前 \\(n\\) 項和為 \\(S_n\\)。若 \\(S_n = \\dfrac{10}{21}\\)，求 \\(n\\)。（5 分）","given":["等差數列，\\(a_2 = 3\\)，\\(a_{20} = 39\\)","(a) 求通項；(b) \\(S_n = \\sum \\frac{1}{a_k a_{k+1}} = \\frac{10}{21}\\)，求 \\(n\\)"],"formula":["等差通項：\\(a_n = a_1 + (n-1)d\\)","任兩項：\\(a_n = a_m + (n-m)d\\)","裂項相消：\\(\\dfrac{1}{a_k a_{k+1}} = \\dfrac{1}{d}\\left(\\dfrac{1}{a_k} - \\dfrac{1}{a_{k+1}}\\right)\\)"],"hint":"(a) 用 \\(a_{20} - a_2 = 18d\\) 求公差 \\(d\\)，再求 \\(a_1\\) 與通項。(b) 通項 \\(a_n = 2n-1\\)，分式用裂項相消，求和後解方程。","sol":["<b>(a)</b> \\(a_{20} - a_2 = 18d = 39 - 3 = 36\\)，得 \\(d = 2\\)。\\(a_1 = a_2 - d = 1\\)。","通項 \\(a_n = 1 + (n-1)\\cdot 2 = 2n - 1\\)。","<b>(b)</b> \\(\\frac{1}{a_n a_{n+1}} = \\frac{1}{(2n-1)(2n+1)} = \\frac{1}{2}\\left(\\frac{1}{2n-1} - \\frac{1}{2n+1}\\right)\\)。","裂項相消：\\(S_n = \\frac{1}{2}\\left(1 - \\frac{1}{2n+1}\\right) = \\frac{n}{2n+1}\\)。","令 \\(\\frac{n}{2n+1} = \\frac{10}{21}\\)，交叉相乘 \\(21n = 20n + 10\\)，得 \\(n = 10\\)。"]},{"n":5,"type":"第十三類型：三角","body":"在 \\(\\triangle ABC\\) 中，\\(\\sin(C - A) = 1\\) 及 \\(\\cos B = \\dfrac{2\\sqrt{2}}{3}\\)。<br>(a) 求 \\(\\sin^2 C\\)。（4 分）<br>(b) 若 \\(|AC| = 5\\)，求 \\(\\triangle ABC\\) 的面積。（4 分）","given":["\\(\\triangle ABC\\) 中 \\(\\sin(C - A) = 1\\)","\\(\\cos B = \\dfrac{2\\sqrt{2}}{3}\\)","(a) 求 \\(\\sin^2 C\\)；(b) \\(|AC|=5\\) 時求面積"],"formula":["\\(\\sin\\theta = 1 \\Rightarrow \\theta = 90°\\)","三角形內角和 \\(A+B+C = 180°\\)","平方關係 \\(\\sin^2 + \\cos^2 = 1\\)；二倍角 \\(\\cos 2C = 1 - 2\\sin^2 C\\)","正弦定理 \\(\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C}\\)；面積 \\(\\dfrac{1}{2}ab\\sin C\\)"],"hint":"(a) 由 \\(\\sin(C-A)=1\\) 得 \\(C-A=90°\\)；配合內角和把 \\(2C\\) 用 \\(B\\) 表示，再用 \\(\\cos 2C\\) 與二倍角求 \\(\\sin^2 C\\)。(b) 先求各角正弦，用正弦定理求邊，再用面積公式。","sol":["<b>(a)</b> \\(\\sin(C-A)=1 \\Rightarrow C - A = 90°\\)。由 \\(\\cos B = \\frac{2\\sqrt{2}}{3}\\) 得 \\(\\sin B = \\frac{1}{3}\\)。","\\(A+B+C=180°\\) 且 \\(C-A=90°\\)，相加得 \\(2C = 270° - B\\)，故 \\(\\cos 2C = \\cos(270°-B) = -\\sin B = -\\frac{1}{3}\\)。","由 \\(\\cos 2C = 1 - 2\\sin^2 C\\)：\\(-\\frac{1}{3} = 1 - 2\\sin^2 C\\)，得 \\(\\sin^2 C = \\frac{2}{3}\\)。","<b>(b)</b> 因 \\(C > 90°\\)，\\(\\cos C = -\\sqrt{1-\\frac{2}{3}} = -\\frac{\\sqrt{3}}{3}\\)。","\\(\\sin A = \\sin(C - 90°) = -\\cos C = \\frac{\\sqrt{3}}{3}\\)。由正弦定理 \\(\\frac{BC}{\\sin A} = \\frac{AC}{\\sin B}\\)：\\(BC = \\frac{AC \\sin A}{\\sin B} = \\frac{5 \\cdot \\frac{\\sqrt{3}}{3}}{\\frac{1}{3}} = 5\\sqrt{3}\\)。","面積 \\(= \\frac{1}{2}\\cdot BC \\cdot AC \\cdot \\sin C = \\frac{1}{2}\\cdot 5\\sqrt{3}\\cdot 5 \\cdot \\sqrt{\\frac{2}{3}} = \\frac{25\\sqrt{2}}{2}\\)。"]}]},"2022":{"choices":[{"n":1,"type":"第一類型：基本概念","body":"在下列集合中，表示空集的是哪一個？","given":["判斷哪個集合沒有任何元素（空集）"],"options":["\\(\\{0\\}\\)","\\(\\{x: \\sin x+\\cos x=3\\}\\)","\\(\\{x: x^2-1=0,\\ x \\in \\mathbb{R}\\}\\)","\\(\\{\\varnothing\\}\\)","\\(\\{(x,y): x^2+y^2=0,\\ x,y \\in \\mathbb{R}\\}\\)"],"answer":1,"formula":["正弦與餘弦的範圍：\\(-\\sqrt{2} \\leq \\sin x + \\cos x \\leq \\sqrt{2}\\)"],"hint":"逐一檢查每個集合是否有元素。注意 \\(\\sin x + \\cos x\\) 的最大值是 \\(\\sqrt{2}\\)，不可能等於 3。","sol":["A：\\(\\{0\\}\\) 含元素 0，非空集。","B：\\(\\sin x + \\cos x = \\sqrt{2}\\sin(x+\\frac{\\pi}{4})\\)，最大值為 \\(\\sqrt{2} \\approx 1.41 < 3\\)，故無解，是空集。","C：\\(x^2 = 1\\) 有解 \\(x = \\pm 1\\)，非空集。","D：\\(\\{\\varnothing\\}\\) 是含有「空集」這個元素的集合，本身非空集。","E：\\(x^2 + y^2 = 0\\) 有解 \\((0,0)\\)，非空集。因此答案為 B。"]},{"n":2,"type":"第七類型：代數不等式","body":"若 \\(a>b>0\\) 及 \\(m>0\\)，下列哪一個不等式是正確的？","given":["\\(a > b > 0\\)，\\(m > 0\\)"],"options":["\\(\\dfrac{b}{a}>\\dfrac{b+m}{a+m}\\)","\\(\\dfrac{a}{b}<\\dfrac{a-m}{b-m}\\)","\\(\\dfrac{b}{a}<\\dfrac{b+m}{a+m}\\)","\\(\\dfrac{a}{b}>\\dfrac{a-m}{b-m}\\)","以上皆非"],"answer":2,"hint":"可以代入簡單的數字（如 \\(a=2, b=1, m=1\\)）逐一檢驗，或用作差法比較兩個分數的大小。","sol":["考慮 \\(\\dfrac{b+m}{a+m} - \\dfrac{b}{a} = \\dfrac{a(b+m) - b(a+m)}{a(a+m)} = \\dfrac{m(a-b)}{a(a+m)}\\)。","因為 \\(a>b>0\\)、\\(m>0\\)，所以分子分母皆正，差為正。","故 \\(\\dfrac{b+m}{a+m} > \\dfrac{b}{a}\\)，即 \\(\\dfrac{b}{a} < \\dfrac{b+m}{a+m}\\)，選 C。"]},{"n":3,"type":"第四類型：多項式及有理分式","body":"若多項式 \\(x^3+3x^2+ax+b\\) 分別被 \\(x-2\\) 及 \\(x+1\\) 除，餘數相等。求 \\(a\\) 之值。","given":["多項式 \\(P(x) = x^3+3x^2+ax+b\\)","\\(P(x)\\) 除以 \\(x-2\\) 與 \\(x+1\\) 的餘數相等"],"options":["\\(4\\)","\\(-3\\)","\\(-4\\)","\\(9\\)","\\(-6\\)"],"answer":4,"formula":["餘數定理：多項式 \\(P(x)\\) 除以 \\(x-c\\) 的餘數為 \\(P(c)\\)"],"hint":"用餘數定理：除以 \\(x-2\\) 的餘數是 \\(P(2)\\)，除以 \\(x+1\\) 的餘數是 \\(P(-1)\\)。令兩者相等。","sol":["由餘數定理，\\(P(2) = 8 + 12 + 2a + b = 20 + 2a + b\\)。","\\(P(-1) = -1 + 3 - a + b = 2 - a + b\\)。","令兩者相等：\\(20 + 2a + b = 2 - a + b\\)，得 \\(3a = -18\\)，故 \\(a = -6\\)。"]},{"n":4,"type":"第六類型：指數及根式","body":"化簡 \\(\\sqrt{7-4\\sqrt{3}}\\)。","given":["化簡 \\(\\sqrt{7-4\\sqrt{3}}\\)"],"options":["\\(\\sqrt{3}-\\sqrt{2}\\)","\\(2-\\sqrt{3}\\)","\\(\\sqrt{3}-2\\)","\\(2-\\sqrt{6}\\)","\\(2-2\\sqrt{3}\\)"],"answer":1,"formula":["完全平方：\\((p-q)^2 = p^2 - 2pq + q^2\\)","\\(\\sqrt{A^2} = |A|\\)"],"hint":"試著把 \\(7-4\\sqrt{3}\\) 寫成某個 \\((p-q)^2\\) 的形式，其中含 \\(\\sqrt{3}\\)。注意 \\(4\\sqrt{3} = 2\\cdot 2\\cdot\\sqrt{3}\\)。","sol":["設 \\(7 - 4\\sqrt{3} = (a - b)^2 = a^2 + b^2 - 2ab\\)。","觀察 \\(4\\sqrt{3} = 2 \\cdot 2 \\cdot \\sqrt{3}\\)，嘗試 \\(a=2,\\ b=\\sqrt{3}\\)：\\((2-\\sqrt{3})^2 = 4 + 3 - 4\\sqrt{3} = 7 - 4\\sqrt{3}\\)。✓","所以 \\(\\sqrt{7-4\\sqrt{3}} = |2 - \\sqrt{3}| = 2 - \\sqrt{3}\\)（因 \\(2 > \\sqrt{3}\\)），選 B。"]},{"n":5,"type":"第五類型：二次方程及二次函數","body":"若方程 \\(px^2-2(p+3)x+p-1=0\\) 有實根，求 \\(p\\) 的取值範圍。","given":["方程 \\(px^2-2(p+3)x+p-1=0\\) 有實根","求 \\(p\\) 的範圍"],"options":["\\(0 \\leq p \\leq \\dfrac{5}{7}\\)","\\(p \\geq -\\dfrac{5}{7}\\)","\\(-\\dfrac{5}{7} \\leq p \\leq 1\\)","\\(p \\geq -\\dfrac{9}{7}\\)","以上皆非"],"answer":3,"formula":["二次方程 \\(ax^2+bx+c=0\\)（\\(a \\neq 0\\)）有實根 \\(\\Leftrightarrow \\Delta = b^2-4ac \\geq 0\\)","注意若 \\(a=0\\) 則退化為一次方程，需另外討論"],"hint":"先別忘了討論 \\(p=0\\) 的情況（變成一次方程）。當 \\(p \\neq 0\\) 時，用判別式 \\(\\Delta \\geq 0\\)。","sol":["當 \\(p = 0\\)：方程變為 \\(-6x - 1 = 0\\)，有實根，符合。","當 \\(p \\neq 0\\)：判別式 \\(\\Delta = [2(p+3)]^2 - 4p(p-1) \\geq 0\\)。","展開：\\(4(p^2+6p+9) - 4(p^2-p) = 4(7p+9) \\geq 0\\)，得 \\(p \\geq -\\frac{9}{7}\\)。","合併兩種情況，\\(p \\geq -\\frac{9}{7}\\)，選 D。"]},{"n":6,"type":"第八類型：對數與指數函數","body":"已知 \\(2^a=5^b=\\sqrt{10}\\)，求 \\(\\dfrac{1}{a}+\\dfrac{1}{b}\\)。","given":["\\(2^a = 5^b = \\sqrt{10}\\)","求 \\(\\dfrac{1}{a}+\\dfrac{1}{b}\\)"],"options":["\\(2\\)","\\(1\\)","\\(\\sqrt{2}\\)","\\(\\dfrac{\\sqrt{2}}{2}\\)","\\(\\dfrac{1}{2}\\)"],"answer":0,"formula":["指數與對數互換：\\(2^a = N \\Leftrightarrow a = \\log_2 N\\)","換底與倒數：\\(\\dfrac{1}{\\log_2 N} = \\log_N 2\\)","\\(\\log_N x + \\log_N y = \\log_N(xy)\\)"],"hint":"把 \\(a, b\\) 用對數表示：\\(a = \\log_2\\sqrt{10}\\)，\\(b = \\log_5\\sqrt{10}\\)。再求 \\(\\frac{1}{a}, \\frac{1}{b}\\) 並相加。","sol":["由 \\(2^a = \\sqrt{10}\\)，\\(a = \\log_2\\sqrt{10}\\)，故 \\(\\ ":"第十類型：排列與組合","body":"從 1, 2, 3, 4, 5 中先後選取兩個不同數，分別作為兩位數的十位和個位，此兩位數小於 40 的概率為何？","given":["從 1,2,3,4,5 取兩個不同數作十位、個位","求兩位數 \\(< 40\\) 的概率"],"options":["\\(\\dfrac{1}{5}\\)","\\(\\dfrac{2}{5}\\)","\\(\\dfrac{3}{5}\\)","\\(\\dfrac{4}{5}\\)","\\(1\\)"],"answer":2,"formula":["古典概率：\\(P = \\dfrac{\\text{有利結果數}}{\\text{總結果數}}\\)","排列數：\\(P^n_r = \\dfrac{n!}{(n-r)!}\\)"],"hint":"兩位數小於 40，表示十位數只能是 1、2、3。先算總共有幾種取法，再算十位是 1、2、3 的取法。","sol":["總取法：十位 5 種、個位 4 種（不重複），共 \\(5 \\times 4 = 20\\) 種。","小於 40 表示十位為 1、2 或 3（3 種選擇），個位為剩下 4 個之一。","有利結果：\\(3 \\times 4 = 12\\) 種。","概率 \\(= \\frac{12}{20} = \\frac{3}{5}\\)，選 C。"]},{"n":14,"type":"第八類型：對數與指數函數","body":"方程 \\(6^x - 2^x = 2^{x+1} - 6^{x+1} + 2^{x+2}\\) 的解為何？","given":["方程 \\(6^x - 2^x = 2^{x+1} - 6^{x+1} + 2^{x+2}\\)"],"options":["\\(x=-1\\)","\\(x=-\\dfrac{1}{2}\\)","\\(x=0\\)","\\(x=\\dfrac{1}{2}\\)","\\(x=1\\)"],"answer":2,"formula":["\\(a^{x+n} = a^x \\cdot a^n\\)","同類項合併後比較係數"],"hint":"把所有 \\(2^{x+k}\\) 用 \\(2^x\\) 表示、\\(6^{x+1}\\) 用 \\(6^x\\) 表示，把含 \\(6^x\\) 的項移一邊、含 \\(2^x\\) 的移另一邊。","sol":["展開：\\(6^x - 2^x = 2\\cdot 2^x - 6\\cdot 6^x + 4\\cdot 2^x\\)。","整理：\\(6^x + 6\\cdot 6^x = 2^x + 2\\cdot 2^x + 4\\cdot 2^x\\)，即 \\(7\\cdot 6^x = 7\\cdot 2^x\\)。","所以 \\(6^x = 2^x\\)，即 \\(\\left(\\frac{6}{2}\\right)^x = 3^x = 1\\)，得 \\(x = 0\\)，選 C。"]},{"n":15,"type":"第十三類型：三角","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMjMwIiB2aWV3Qm94PSIwIDAgMzYwIDIzMCIgZm9udC1mYW1pbHk9IidOb3RvIFNlcmlmIFRDJywnTm90byBTZXJpZiBDSksgVEMnLCdTb25ndGkgVEMnLCdNaWNyb3NvZnQgSmhlbmdIZWknLCdQaW5nRmFuZyBUQycsc2VyaWYiPgogIDxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iMjMwIiBmaWxsPSJ3aGl0ZSIvPgogIDwhLS0gY29tcGFzczogZWFzdCBkaXJlY3Rpb24gcmVmZXJlbmNlIGF0IE8gLS0+CiAgPGxpbmUgeDE9IjcwIiB5MT0iOTAiIHgyPSIxMTAiIHkyPSI5MCIgc3Ryb2tlPSIjYmJiIiBzdHJva2Utd2lkdGg9IjEiIHN0cm9rZS1kYXNoYXJyYXk9IjMsMyIvPgogIDx0ZXh0IHg9IjExNCIgeT0iOTQiIGZvbnQtc2l6ZT0iMTAiIGZpbGw9IiM5OTkiPuadsTwvdGV4dD4KICA8IS0tIHBhdGggTyB0byBQIChlYXN0KSAtLT4KIC br>(c) 設 \\(g(x)=f(3\\sin x)\\)，求 \\(g(x)\\) 的最大值和最小值。（3 分）","given":["\\(f(x)=ax^2+bx+c\\)，圖像過 \\((5,0)\\)","對稱軸 \\(x=2\\)，最小值 \\(-9\\)","(a) 求 \\(a,b,c\\)；(b) 平移後表達式；(c) \\(g(x)=f(3\\sin x)\\) 的最值"],"formula":["頂點式：\\(f(x) = a(x-h)^2 + k\\)，頂點 \\((h,k)\\)","對稱軸：\\(x = -\\dfrac{b}{2a} = h\\)","水平平移 \\(h\\)：\\(f(x) \\to f(x+h)\\)（左移為 \\(+\\)）；垂直平移 \\(k\\)：\\(f(x) \\to f(x)+k\\)","\\(\\sin x\\) 的範圍：\\(-1 \\leq \\sin x \\leq 1\\)"],"hint":"(a) 用頂點式最方便：頂點是 \\((2, -9)\\)，再用過點 \\((5,0)\\) 求 \\(a\\)，展開得 \\(b, c\\)。(b) 左移3、上移3直接代入平移規則。(c) 令 \\(t = 3\\sin x\\)，\\(t\\) 的範圍是 \\([-3, 3]\\)，在此範圍找 \\(f(t)\\) 的最值。","sol":["<b>(a)</b> 頂點為 \\((2, -9)\\)，設 \\(f(x) = a(x-2)^2 - 9\\)。","過 \\((5,0)\\)：\\(0 = a(9) - 9\\)，得 \\(a = 1\\)。展開 \\(f(x) = x^2 - 4x - 5\\)，故 \\(a=1, b=-4, c=-5\\)。","<b>(b)</b> 左移 3：\\(f(x+3) = (x+3)^2 - 4(x+3) - 5\\)；再上移 3：\\(y = (x+1)^2 - 6 = x^2 + 2x - 5\\)。","<b>(c)</b> 令 \\(t = 3\\sin x \\in [-3, 3]\\)，\\(g = f(t) = (t-2)^2 - 9\\)。","\\(t = -3\\) 時最大：\\(f(-3) = 25 - 9 = 16\\)；\\(t = 2\\) 時最小：\\(f(2) = -9\\)。","所以 \\(g(x)\\) 最大值 16，最小值 \\(-9\\)。"]},{"n":2,"type":"第十一類型：數列","body":"設 \\(\\{a_n\\}\\) 是首項為 1 的等比數列。數列 \\(\\{b_n\\}\\) 滿足 \\(b_n=\\dfrac{n a_n}{4}\\)。已知 \\(a_1, 4a_2, 16a_3\\) 成等差數列。<br>(a) 求 \\(\\{a_n\\}\\) 和 \\(\\{b_n\\}\\) 的通項公式。（3 分）<br>(b) 求 \\(\\{a_n\\}\\) 的前 \\(n\\) 項和 \\(S_n\\) 及 \\(\\{b_n\\}\\) 的前 \\(n\\) 項和 \\(T_n\\)。（5 分）","given":["\\(\\{a_n\\}\\) 等比，首項 \\(a_1 = 1\\)","\\(b_n = \\dfrac{n a_n}{4}\\)","\\(a_1, 4a_2, 16a_3\\) 成等差數列"],"formula":["等比通項：\\(a_n = a_1 q^{n-1}\\)","等差中項：若 \\(p,q,r\\) 成等差，則 \\(2q = p + r\\)","等比求和：\\(S_n = \\dfrac{a_1(1-q^n)}{1-q}\\)（\\(q \\neq 1\\)）","錯位相減法：求 \\(\\sum n\\cdot q^{n}\\) 型數列和"],"hint":"(a) 用等差中項 \\(2(4a_2) = a_1 + 16a_3\\) 解出公比 \\(q\\)。(b) \\(S_n\\) 直接用等比求和公式；\\(T_n\\) 含 \\(n \\cdot q^n\\) 型，用「錯位相減法」。","sol":["<b>(a)</b> 設公比 \\(q\\)。由 \\(a_1, 4a_2, 16a_3\\) 成等差：\\(2(4a_2) = a_1 + 16a_3\\)。","代入 \\(a_1=1, a_2=q, a_3=q^2\\)：\\(8q = 1 + 16q^2\\)，即 \\(16q^2 - 8q + 1 = 0\\)，\\((4q-1)^2=0\\)，\\(q = \\frac{1}{4}\\)。","故 \\(a_n = \\left(\\frac{1}{4}\\right)^{n-1}\\)，\\(b_n = \\frac{n a_n}{4} = \\frac{n}{4^n}\\)。","<b>(b)</b> \\(S_n = \\dfrac{1 - (1/4)^n}{1 - 1/4} = \\dfrac{4}{3}\\left(1 - \\dfrac{1}{4^n}\\right)\\)。","求 \\(T_n = \\sum_{k=1}^n \\frac{k}{4^k}\\)，用錯位相減：\\(T_n - \\frac{1}{4}T_n = \\sum \\frac{1}{4^k} - \\frac{n}{4^{n+1}}\\)。","整理得 \\(T_n = \\dfrac{4}{9}\\left(1 - \\dfrac{1}{4^n}\\right) - \\dfrac{n}{3\\cdot 4^n}\\)。"]},{"n":3,"type":"第十四類型：解析幾何","body":"已知橢圓 \\(C: \\dfrac{x^2}{b^2}+\\dfrac{y^2}{a^2}=1\\ (a>b>0)\\) 的離心率為 \\(\\dfrac{\\sqrt{2}}{2}\\)，且點 \\((2\\sqrt{2}, 4)\\) 在 \\(C\\) 上。<br>(a) 求 \\(C\\) 的方程。（3 分）<br>(b) 設直線 \\(L: y=k_1x+b'\\) 不通過原點且不平行於坐標軸，與 \\(C\\) 交於 \\(A, B\\)，線段 \\(AB\\) 中點為 \\(M\\)，直線 \\(OM\\) 斜率為 \\(k_2\\)。證明 \\(k_1 k_2=-2\\)。（5 分）","given":["橢圓 \\(\\dfrac{x^2}{b^2}+\\dfrac{y^2}{a^2}=1\\)（\\(a>b>0\\)），離心率 \\(\\dfrac{\\sqrt{2}}{2}\\)","點 \\((2\\sqrt{2}, 4)\\) 在 \\(C\\) 上","(a) 求方程；(b) 證明 \\(k_1 k_2 = -2\\)"],"formula":["橢圓離心率：\\(e = \\dfrac{c}{a}\\)，\\(c^2 = a^2 - b^2\\)","點差法：兩交點代入相減，可得中點斜率關係","斜率：\\(k = \\dfrac{y_2 - y_1}{x_2 - x_1}\\)"],"hint":"(a) 用離心率得 \\(a^2, b^2\\) 關係，再用點在橢圓上列方程求解。(b) 用「點差法」：把 \\(A, B\\) 兩點代入橢圓方程相減，因式分解後出現 \\(k_1\\)（AB斜率）與 \\(k_2\\)（OM斜率）的乘積。","sol":["<b>(a)</b> 離心率 \\(e = \\frac{c}{a} = \\frac{\\sqrt{2}}{2}\\)，且 \\(c^2 = a^2 - b^2\\)，可得 \\(a^2 = 2b^2\\)。","點 \\((2\\sqrt{2}, 4)\\) 代入：\\(\\frac{8}{b^2} + \\frac{16}{a^2} = 1\\)。代入 \\(a^2=2b^2\\) 解得 \\(b^2 = 16, a^2 = 32\\)。","橢圓方程：\\(\\dfrac{x^2}{16} + \\dfrac{y^2}{32} = 1\\)。","<b>(b)</b> 設 \\(A(x_1,y_1), B(x_2,y_2)\\) 在橢圓上，兩式相減：\\(\\frac{x_1^2-x_2^2}{16} + \\frac{y_1^2-y_2^2}{32} = 0\\)。","因式分解：\\(\\frac{(x_1+x_2)(x_1-x_2)}{16} + \\frac{(y_1+y_2)(y_1-y_2)}{32} = 0\\)。","中點 \\(M\\) 使 \\(\\frac{y_1+y_2}{x_1+x_2} = k_2\\)，且 \\(\\frac{y_1-y_2}{x_1-x_2} = k_1\\)。整理得 \\(k_1 k_2 = -\\frac{32}{16} = -2\\)。得證。"]},{"n":4,"type":"第十三類型：三角","body":"(a) 把 \\(\\sqrt{3}\\cos\\theta - \\sin\\theta\\) 以 \\(r\\cos(\\theta+\\beta)\\) 形式表示，並求其取值範圍。（2 分）<br>(b) 求 \\(\\sqrt{3}\\cos\\theta - \\sin\\theta=-1\\) 在 \\(0 \\leq \\theta \\leq 2\\pi\\) 的解（以弧度表示）。（3 分）<br>(c) 如果 \\(\\sqrt{3}\\cos\\theta - \\sin\\theta=-\\dfrac{1}{2}\\)，且 \\(0 \\leq \\theta \\leq \\pi\\)，求 \\(\\sin\\left(\\dfrac{\\theta}{2}+\\dfrac{\\pi}{12}\\right)\\)。（3 分）","given":["考慮 \\(\\sqrt{3}\\cos\\theta - \\sin\\theta\\)","(a) 化為 \\(r\\cos(\\theta+\\beta)\\) 並求範圍","(b) 解 \\(=-1\\)；(c) 已知 \\(=-\\frac{1}{2}\\) 求 \\(\\sin(\\frac{\\theta}{2}+\\frac{\\pi}{12})\\)"],"formula":["輔助角公式：\\(a\\cos\\theta + b\\sin\\theta = r\\cos(\\theta - \\varphi)\\)，\\(r = \\sqrt{a^2+b^2}\\)","\\(\\cos(A+B) = \\cos A\\cos B - \\sin A\\sin B\\)","二倍角：\\(\\cos 2\\alpha = 1 - 2\\sin^2\\alpha\\)"],"hint":"(a) 取 \\(r = \\sqrt{(\\sqrt{3})^2 + 1^2} = 2\\)，提出 2 後配成 \\(\\cos(\\theta + \\frac{\\pi}{6})\\)。(b) 化簡後解 \\(\\cos(\\theta+\\frac{\\pi}{6}) = -\\frac{1}{2}\\)。(c) 由條件得 \\(\\cos(\\theta+\\frac{\\pi}{6})\\)，再用二倍角公式（注意 \\(\\frac{\\theta}{2}+\\frac{\\pi}{12} = \\frac{1}{2}(\\theta+\\frac{\\pi}{6})\\)）。","sol":["<b>(a)</b> \\(\\sqrt{3}\\cos\\theta - \\sin\\theta = 2\\left(\\frac{\\sqrt{3}}{2}\\cos\\theta - \\frac{1}{2}\\sin\\theta\\right) = 2\\cos\\left(\\theta + \\frac{\\pi}{6}\\right)\\)。範圍為 \\([-2, 2]\\)。","<b>(b)</b> 由 \\(2\\cos(\\theta+\\frac{\\pi}{6}) = -1\\)，得 \\(\\cos(\\theta+\\frac{\\pi}{6}) = -\\frac{1}{2}\\)。","在 \\(0 \\leq \\theta \\leq 2\\pi\\)：\\(\\theta + \\frac{\\pi}{6} = \\frac{2\\pi}{3}\\) 或 \\(\\frac{4\\pi}{3}\\)，得 \\(\\theta = \\frac{\\pi}{2}\\) 或 \\(\\frac{7\\pi}{6}\\)。","<b>(c)</b> 由 \\(2\\cos(\\theta+\\frac{\\pi}{6}) = -\\frac{1}{2}\\)，得 \\(\\cos(\\theta+\\frac{\\pi}{6}) = -\\frac{1}{4}\\)。","注意 \\(\\frac{\\theta}{2}+\\frac{\\pi}{12} = \\frac{1}{2}(\\theta+\\frac{\\pi}{6})\\)，用二倍角 \\(\\cos(\\theta+\\frac{\\pi}{6}) = 1 - 2\\sin^2(\\frac{\\theta}{2}+\\frac{\\pi}{12})\\)。","\\(-\\frac{1}{4} = 1 - 2\\sin^2(\\cdots)\\)，得 \\(\\sin^2 = \\frac{5}{8}\\)。因 \\(0 \\leq \\theta \\leq \\pi\\) 取正值，\\(\\sin\\left(\\frac{\\theta}{2}+\\frac{\\pi}{12}\\right) = \\frac{\\sqrt{10}}{4}\\)。"]},{"n":5,"type":"第一類型 "球完全浸沒後排開的水體積 = 球體積。水位上升的量 = 球體積 ÷ 水箱底面積。注意檢查上升後是否超過水箱高度。","sol":["球體積 \\(V = \\frac{4}{3}\\pi(2)^3 = \\frac{32}{3}\\pi\\)。","水箱底面積 \\(= \\pi(3)^2 = 9\\pi\\)。","水位上升 \\(\\Delta h = \\frac{V}{9\\pi} = \\frac{32\\pi/3}{9\\pi} = \\frac{32}{27}\\) 米。","檢查：\\(5 + \\frac{32}{27} \\approx 6.19 < 8\\)，未溢出，選 E。"]},{"n":10,"type":"第十一類型：數列","body":"在等差數列中，第 7 項是 80，第 16 項是 26，求第 34 項。","given":["等差數列，\\(a_7 = 80\\)，\\(a_{16} = 26\\)","求 \\(a_{34}\\)"],"options":["\\(-6\\)","\\(-82\\)","\\(-88\\)","\\(-198\\)","\\(-204\\)"],"answer":1,"formula":["等差通項：\\(a_n = a_1 + (n-1)d\\)","任兩項關係：\\(a_n = a_m + (n-m)d\\)"],"hint":"用兩項差求公差：\\(a_{16} - a_7 = (16-7)d\\) 求出 \\(d\\)。再從任一已知項推到第 34 項。","sol":["\\(a_{16} - a_7 = 9d = 26 - 80 = -54\\)，所以 \\(d = -6\\)。","\\(a_{34} = a_{16} + (34-16)d = 26 + 18\\times(-6) = 26 - 108 = -82\\)，選 B。"]},{"n":11,"type":"第十四類型：解析幾何","body":"已知點 \\(A(3, -8)\\) 和 \\(B(-7, 4)\\)。求通過 \\(AB\\) 的中點並且垂直於 \\(3x - 4y + 14 = 0\\) 的直線方程。","given":["\\(A(3, -8)\\)，\\(B(-7, 4)\\)","直線過 \\(AB\\) 中點，且垂直於 \\(3x-4y+14=0\\)"],"options":["\\(4x + 3y + 14 = 0\\)","\\(3x + 4y + 14 = 0\\)","\\(3x - 4y - 14 = 0\\)","\\(4x - 3y + 14 = 0\\)","\\(4x + 3y - 14 = 0\\)"],"answer":0,"formula":["中點公式：\\(M = \\left(\\dfrac{x_1+x_2}{2}, \\dfrac{y_1+y_2}{2}\\right)\\)","垂直線斜率互為負倒數","點斜式：\\(y - y_1 = m(x - x_1)\\)"],"hint":"先求 \\(AB\\) 中點。再由 \\(3x-4y+14=0\\) 的斜率取負倒數得新直線斜率，用點斜式並化成一般式。","sol":["中點 \\(M = \\left(\\frac{3-7}{2}, \\frac{-8+4}{2}\\right) = (-2, -2)\\)。","\\(3x-4y+14=0\\) 斜率為 \\(\\frac{3}{4}\\)，垂直線斜率為 \\(-\\frac{4}{3}\\)。","點斜式：\\(y + 2 = -\\frac{4}{3}(x + 2)\\)，化簡得 \\(4x + 3y + 14 = 0\\)，選 A。"]},{"n":12,"type":"第十四類型：解析幾何","body":"雙曲線 \\(\\dfrac{x^2}{a^2} - \\dfrac{y^2}{b^2} = 1\\)（\\(a, b > 0\\)）的離心率是 3，求 \\(\\dfrac{b^2 + 2}{a}\\) 的最小值。","given":["雙曲線 \\(\\dfrac{x^2}{a^2} - \\dfrac{y^2}{b^2} = 1\\)，離心率 \\(= 3\\)","求 \\(\\dfrac{b^2+2}{a}\\) 的最小值"],"options":["\\(2\\)","\\(2\\sqrt{2}\\)","\\(2\\sqrt{3}\\)","\\(4\\)","\\(8\\)"],"answer":4,"formula":["雙曲線離心率：\\(e = \\dfrac{c}{a}\\)，\\(c^2 = a^2 + b^2\\)","算術-幾何平均不等式：\\(p + q \\geq 2\\sqrt{pq}\\)（等號當 \\(p=q\\)）"],"hint":"由離心率 3 求出 \\(b^2\\) 與 \\(a^2\\) 的關係（\\(b^2 = 8a^2\\)）。代入後用算幾不等式求 \\(\\frac{b^2+2}{a}\\) 的最小值。","sol":["離心率 \\(e = \\frac{c}{a} = 3\\)，\\(c^2 = 9a^2 = a^2 + b^2\\)，得 \\(b^2 = 8a^2\\)。","\\(\\frac{b^2+2}{a} = \\frac{8a^2+2}{a} = 8a + \\frac{2}{a}\\)。","由算幾不等式：\\(8a + \\frac{2}{a} \\geq 2\\sqrt{8a \\cdot \\frac{2}{a}} = 2\\sqrt{16} = 8\\)。","等號當 \\(8a = \\frac{2}{a}\\) 即 \\(a = \\frac{1}{2}\\) 時成立，最小值為 8，選 E。"]},{"n":13,"type":"第十三類型：三角","body":"設 \\(A\\) 和 \\(B\\) 是第二象限中的角，且 \\(\\sin A = \\dfrac{2}{5}\\) 及 \\(\\sin B = \\dfrac{4}{5}\\)，求 \\(\\sin(A + B)\\)。","given":["\\(A, B\\) 在第二象限（\\(\\sin>0, \\cos<0\\)）","\\(\\sin A = \\dfrac{2}{5}\\)，\\(\\sin B = \\dfrac{4}{5}\\)","求 \\(\\sin(A+B)\\)"],"options":["\\(\\dfrac{-6 - 4\\sqrt{21}}{25}\\)","\\(\\dfrac{13}{25}\\)","\\(\\dfrac{18}{25}\\)","\\(\\dfrac{-12 - 2\\sqrt{21}}{25}\\)","\\(\\dfrac{12 + 2\\sqrt{21}}{25}\\)"],"answer":0,"formula":["平方關係：\\(\\cos\\theta = \\pm\\sqrt{1 - \\sin^2\\theta}\\)","第二象限：\\(\\cos\\theta < 0\\)（取負值）","和角：\\(\\sin(A+B) = \\sin A\\cos B + \\cos A\\sin B\\)"],"hint":"第二象限的角餘弦為負，所以 \\(\\cos A, \\cos B\\) 都取負值。先用平方關係求出，再代入和角公式。","sol":["第二象限 \\(\\cos < 0\\)：\\(\\cos A = -\\sqrt{1 - \\frac{4}{25}} = -\\frac{\\sqrt{21}}{5}\\)，\\(\\cos B = -\\sqrt{1 - \\frac{16}{25}} = -\\frac{3}{5}\\)。","\\(\\sin(A+B) = \\sin A\\cos B + \\cos A\\sin B\\)。","\\(= \\frac{2}{5}\\cdot(-\\frac{3}{5}) + (-\\frac{\\sqrt{21}}{5})\\cdot\\frac{4}{5} = \\frac{-6 - 4\\sqrt{21}}{25}\\)，選 A。"]},{"n":14,"type":"第十五類型：函數圖形","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaQAAAETCAIAAAD24eWvAABJbUlEQVR4nO2deXwUZbb3z3mq9z37HvYlBMLqEFlk08iqgiCoKIuoqOOd0Vnv9Y7DOHfmetXX3XEfHVEQRUABEVREkH0RHJAl7JB962zdSXdXnfePSkJIIITQSVV1P9+PH8zTtZzf83TVqTrnVD+FRAQdDhEh4iWbmzZtGjt27A033PDtt9/OmjXLbre//fbbgiAAgCRJTz311P/+7/8GAgFBEIho3LhxK1asMJvNDZu3sOcWFrVfUxGjatAQPkbVoEENRtWPTmkBTencubPD4SgrK9u6devevXvXrVvHGJMXVVZW7tixQxRFIhJFEQAOHzlSUlKSnJysqGQOh6MBVOfs4uPjY \)","關於 \\(x\\) 軸對稱：\\((x, y) \\to (x, -y)\\)","向下平移 \\(k\\)：\\((x, y) \\to (x, y-k)\\)"],"hint":"一步步做：先把 \\(A\\) 順時針轉 90° 得 \\(B\\)，再對 \\(x\\) 軸對稱得 \\(C\\)，最後下移 3 得 \\(D\\)。","sol":["順時針轉 90°：\\((x,y)\\to(y,-x)\\)，故 \\(B = (3, 2)\\)。","關於 \\(x\\) 軸對稱：\\((x,y)\\to(x,-y)\\)，故 \\(C = (3, -2)\\)。","向下平移 3：\\(D = (3, -2-3) = (3, -5)\\)。","對照選項，\\(D = (3, -5)\\)，選 E。"]}],"solutions":[{"n":1,"type":"第十六類型：概率和統計","body":"有一枚不均勻的硬幣，正面朝上的概率是 \\(\\dfrac{1}{4}\\)。<br>(a) 連續十次投擲，求獲得最多一次正面朝上的概率。（3 分）<br>(b) 求在第十次投擲才第一次獲得正面朝上的概率。（2 分）<br>(c) 求在第十次投擲取得第三次正面朝上的概率。（3 分）","given":["正面概率 \\(p = \\dfrac{1}{4}\\)，反面 \\(\\dfrac{3}{4}\\)","(a) 10 次中最多 1 次正面；(b) 第 10 次才首次正面；(c) 第 10 次取得第 3 次正面"],"formula":["二項分布：\\(P(X=k) = \\binom{n}{k}p^k(1-p)^{n-k}\\)","幾何分布：前 \\(n-1\\) 次失敗、第 \\(n\\) 次成功 \\(= (1-p)^{n-1}p\\)","負二項：第 \\(n\\) 次取得第 \\(r\\) 次成功 \\(= \\binom{n-1}{r-1}p^{r-1}(1-p)^{n-r}\\cdot p\\)"],"hint":"(a)「最多一次」= 0 次 + 恰 1 次，用二項分布。(b) 前 9 次全反面、第 10 次正面。(c) 前 9 次恰好 2 次正面，第 10 次再正面。","sol":["<b>(a)</b> 0 次正面：\\((\\frac{3}{4})^{10}\\)；恰 1 次：\\(\\binom{10}{1}\\frac{1}{4}(\\frac{3}{4})^9 = \\frac{10}{4}(\\frac{3}{4})^9\\)。","合計 \\((\\frac{3}{4})^{10} + \\frac{10}{4}(\\frac{3}{4})^9 = \\frac{13}{4}\\times(\\frac{3}{4})^9\\)。","<b>(b)</b> 前 9 次反面、第 10 次正面：\\((\\frac{3}{4})^9 \\times \\frac{1}{4} = \\dfrac{3^9}{4^{10}}\\)。","<b>(c)</b> 前 9 次恰 2 次正面：\\(\\binom{9}{2}(\\frac{1}{4})^2(\\frac{3}{4})^7\\)；第 10 次正面再乘 \\(\\frac{1}{4}\\)。","\\(= \\binom{9}{2}(\\frac{1}{4})^2(\\frac{3}{4})^7 \\times \\frac{1}{4} = (\\frac{3}{4})^9\\)。"]},{"n":2,"type":"第十四類型：解析幾何","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAATsAAAEECAIAAADYkgToAAA62klEQVR4nO2deVwTV9v3ZyYJiyiQ4AKoKC4IWgUUq6Igi8giKKDijghqtbhUrY8KLlVLW+sC2Hprta4giwu4VgUBFURRRGWtG4K4QRAlAQlZZt4/znPnzYOAIclkMnC+f/gJzMl1fhnzY+Y6c851UIIgEAgEQhMwqgVAIJA2AB0LgdAJ6FgIhE5Ax0IgdAI6FgKhE9CxEAidgI6FQOgEdCwEQiegYyEQOgEdC4HQCehYCIROQMdCIHQCOhYCoRPQsRAInYCOhUDoBHQsBEInoGMhEDoBHQuB0AnoWAiETkDHQiB0AjoWAqET0LEQCJ2AjoVA6AR0LARCJ6BjIRA6AR0LgdAJ6FgIhE5Ax0IgdAI6FgKhE9Cx (|DM| = 3|CM|\\)，求線段 \\(CD\\) 的長度。（3 分）","given":["拋物線 \\(x^2 = 4y\\)，焦點 \\(F\\)","\\(L_1\\) 過 \\(F\\)、斜率 \\(\\frac{3}{4}\\)，交拋物線於 \\(A, B\\)","\\(L_2\\) 斜率 1，交於 \\(C, D\\)，交 \\(y\\) 軸於 \\(M\\)，且 \\(|DM|=3|CM|\\)"],"formula":["拋物線 \\(x^2 = 4py\\) 的焦點為 \\((0, p)\\)","焦點弦長：\\(|AB| = y_A + y_B + 2p\\)（焦點弦）","韋達定理：聯立後 \\(x_1+x_2, x_1 x_2\\)","弦長：\\(|CD| = \\sqrt{1+k^2}\\,|x_1 - x_2|\\)"],"hint":"(a) \\(x^2=4y\\) 對應 \\(4p=4\\)，焦點 \\((0,1)\\)。(b) 寫 \\(L_1\\) 方程，聯立求 \\(A,B\\)，用焦點弦公式 \\(|AB|=y_A+y_B+2\\)。(c) 設 \\(L_2: y=x+t\\)，聯立得 \\(x\\) 的二次式，用 \\(|DM|=3|CM|\\) 轉成 \\(x_2=-3x_1\\)，配合韋達定理。","sol":["<b>(a)</b> \\(x^2 = 4y\\) 即 \\(4p = 4\\)，\\(p=1\\)，焦點 \\(F = (0, 1)\\)。","<b>(b)</b> \\(L_1: y = \\frac{3}{4}x + 1\\)。代入 \\(x^2 = 4y\\)：\\(x^2 = 3x + 4\\)，解得 \\(x = -1\\) 或 \\(4\\)。","對應 \\(A(-1, \\frac{1}{4})\\)、\\(B(4, 4)\\)。焦點弦長 \\(|AB| = y_A + y_B + 2 = \\frac{1}{4} + 4 + 2 = \\frac{25}{4}\\)。","<b>(c)</b> 設 \\(L_2: y = x + t\\)。代入得 \\(x^2 - 4x - 4t = 0\\)，由韋達 \\(x_1 + x_2 = 4\\)。","\\(M\\) 在 \\(y\\) 軸，由 \\(|DM| = 3|CM|\\) 得 \\(x_2 = -3x_1\\)。配合 \\(x_1+x_2=4\\)，解得 \\(x_1 = -2, x_2 = 6\\)。","\\(|CD| = \\sqrt{1+1^2}\\,|x_2 - x_1| = \\sqrt{2}\\times 8 = 8\\sqrt{2}\\)。"]},{"n":3,"type":"第十一類型：數列","body":"已知 \\(S_n = 3^{n+1} - 2k\\) 是等比數列 \\(\\{a_n\\}\\) 的前 \\(n\\) 項和，\\(k \\in \\mathbb{R}\\) 為常數。<br>(a) 求 \\(k\\) 及 \\(a_n\\)。（3 分）<br>(b) 設 \\(b_n = \\dfrac{1}{a_n} + \\log_2 a_n\\)，求前 \\(n\\) 項和 \\(T_n\\)。（3 分）<br>(c) 設 \\(c_n = 2^{-a_n}\\)，求 \\(f(n) = -5c_n^2 + c_n\\) 取最大值時 \\(n\\) 的值。（2 分）","given":["\\(S_n = 3^{n+1} - 2k\\) 為等比數列前 \\(n\\) 項和","(a) 求 \\(k, a_n\\)；(b) \\(b_n = \\frac{1}{a_n}+\\log_2 a_n\\) 求 \\(T_n\\)；(c) \\(c_n=2^{-a_n}\\)，求 \\(f(n)\\) 最大時 \\(n\\)"],"formula":["由和求項：\\(a_1 = S_1\\)，\\(a_n = S_n - S_{n-1}\\)（\\(n \\geq 2\\)）","等比中項：\\(a_1 a_3 = a_2^2\\)","分組求和：等比和 + 等差和"],"hint":"(a) 先求 \\(a_1=S_1, a_2=S_2-S_1, a_3=S_3-S_2\\)，用等比中項 \\(a_1 a_3 = a_2^2\\) 求 \\(k\\)。(b) \\(b_n\\) 拆成等比部分與等差部分分別求和。(c) \\(c_n\\) 隨 \\(n\\) 遞減，把 \\(f\\) 看成 \\(c\\) 的二次函數找頂點對應的 \\(n\\)。","sol":["<b>(a)</b> \\(a_1 = S_1 = 9 - 2k\\)，\\(a_2 = S_2 - S_1 = 27 - 9 = 18\\)，\\(a_3 = S_3 - S_2 = 81 - 27 = 54\\)。","等比：\\(a_1 a_3 = a_2^2\\)，\\((9-2k)(54) = 18^2 = 324\\)，得 \\(9 - 2k = 6\\)，\\(k = \\frac{3}{2}\\)。","首項 \\(a_1 = 6\\)，公比 \\(q = 3\\)，故 \\(a_n = 6\\cdot 3^{n-1} = 2\\cdot 3^n\\)。","<b>(b)</b> \\(b_n = \\frac{1}{2\\cdot 3^n} + \\log_2(2\\cdot 3^n) = \\frac{1}{2\\cdot 3^n} + 1 + n\\log_2 3\\)。","\\(T_n = \\frac{1}{4}\\left(1 - \\frac{1}{3^n}\\right) + n + \\frac{n(n+1)}{2}\\log_2 3\\)。","<b>(c)</b> \\(c_n = 2^{-a_n} = 3^{-n}\\)。\\(f = -5c^2 + c\\)，頂點在 \\(c = \\frac{1}{10}\\)。","\\(c_n = 3^{-n}\\)：\\(n=1 \\Rightarrow \\frac{1}{3}\\)、\\(n=2 \\Rightarrow \\frac{1}{9} \\approx 0.111\\)，最接近 \\(\\frac{1}{10}\\)。故 \\(n = 2\\) 時 \\(f(n)\\) 最大（值 \\(\\frac{4}{81}\\)）。"]},{"n":4,"type":"第十三類型：三角","body":"已知函數 \\(f(x) = \\sqrt{3}\\sin(2\\omega x) - 2\\cos^2(\\omega x)\\) 的最小正週期為 \\(3\\pi\\)。<br>(a) 求 \\(f(x)\\) 的表達式。（4 分）<br>(b) 在 \\(\\triangle ABC\\) 中，若 \\(f(C) = 0\\)，且 \\(2\\sin^2 B = \\cos B + \\cos(A - C)\\)，求 \\(\\sin A\\)。（4 分）","given":["\\(f(x) = \\sqrt{3}\\sin(2\\omega x) - 2\\cos^2(\\omega x)\\)，最小正週期 \\(3\\pi\\)","(a) 求 \\(f(x)\\)；(b) \\(\\triangle ABC\\) 中 \\(f(C)=0\\) 且 \\(2\\sin^2 B = \\cos B + \\cos(A-C)\\)，求 \\(\\sin A\\)"],"formula":["降冪：\\(2\\cos^2\\theta = 1 + \\cos 2\\theta\\)","輔助角：\\(a\\sin\\phi + b\\cos\\phi = R\\sin(\\phi+\\varphi)\\)","週期：\\(\\sin(\\omega x)\\) 的最小正週期為 \\(\\dfrac{2\\pi}{\\omega}\\)","三角形內角和 \\(A+B+C = \\pi\\)"],"hint":"(a) 用降冪公式把 \\(\\cos^2\\) 化開，再用輔助角合併成單一個 \\(\\sin\\)，由週期 \\(3\\pi\\) 定出 \\(\\omega\\)。(b) 由 \\(f(C)=0\\) 求 \\(C\\)，再用內角和與和差化積處理第二個等式求 \\(\\sin A\\)。","sol":["<b>(a)</b> \\(f(x) = \\sqrt{3}\\sin 2\\omega x - (1 + \\cos 2\\omega x) = 2\\sin(2\\omega x - \\frac{\\pi}{6}) - 1\\)。","最小正週期 \\(\\frac{2\\pi}{2\\omega} = 3\\pi\\)，得 \\(\\omega = \\frac{1}{3}\\)，故 \\(f(x) = 2\\sin(\\frac{2}{3}x - \\frac{\\pi}{6}) - 1\\)。","<b>(b)</b> \\(f(C) = 2\\sin(\\frac{2}{3}C - \\frac{\\pi}{6}) - 1 = 0\\)，得 \\(\\sin(\\frac{2}{3}C - \\frac{\\pi}{6}) = \\frac{1}{2}\\)。","由範圍得 \\(\\frac{2}{3}C - \\frac{\\pi}{6} = \\frac{\\pi}{6}\\)，所以 \\(C = \\frac{\\pi}{2}\\)，\\(A + B = \\frac{\\pi}{2}\\)。","代入 \\(2\\sin^2 B = \\cos B + \\cos(A - C)\\)。因 \\(C=\\frac{\\pi}{2}\\)，\\(\\cos(A-\\frac{\\pi}{2}) = \\sin A\\)，又 \\(\\cos B = \\sin A\\)。","得 \\(2\\sin^2 B = 2\\sin A\\)，而 \\(\\sin B = \\cos A\\)，故 \\(1 - \\sin^2 A = \\sin A\\)，解得 \\(\\sin A = \\frac{\\sqrt{5}-1}{2}\\)。"]},{"n":5,"type":"第七類型：代數不等式","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMjAiIGhlaWdodD0iMzAwIiB2aWV3Qm94PSIwIDAgMzIwIDMwMCIgZm9udC1mYW1pbHk9IidOb3RvIFNlcmlmIFRDJywnTm90byBTZXJpZiBDSksgVEMnLCdTb25ndGkgVEMnLCdNaWNyb3NvZnQgSmhlbmdIZWknLCdQaW5nRmFuZyBUQycsc2VyaWYiPgogIDxyZWN0IHdpZHRoPSIzMjAiIGhlaWdodD0iMzAwIiBmaWxsPSJ3aGl0ZSIvPgogIDxwb2x5Z29uIHBvaW50cz0iMTM5LjQsMTI5LjggMjM4LjgsNTMuMiAyMzguOCwyNDQuNSIgZmlsbD0iI0U2RjFGQiIgc3Ryb2tlPSJub25lIiBvcGFjaXR5PSIwLjciLz4KICA8bGluZSB4MT0iNDAuMCIgeTE9IjIxOS4wIiB4Mj0iMzEyIiB5Mj0iMjE5LjAiIHN0cm9rZT0iIzMzMyIgc3Ryb2tlLXdpZHRoPSIxLjMiLz4KICA8cG9seWdvbiBwb2ludHM9IjMxMiwyMTkuMCAzMDUsMjIyLjAgMzA1LDIxNi4wIiBmaWxsPSIjMzMzIi8+CiAgPGxpbmUgeDE9IjczLjEiIHkxPSIyOTAiIHgyPSI3My4xIiB5Mj0iOCIgc3Ryb2tlPSIjMzMzIiBzdHJva2Utd2lkdGg9IjEuMyIvPgogIDxwb2x5Z29uIHBvaW50cz0iNzMuMSw4IDcwLjEsMTUgNzYuMSwxNSIgZmlsbD0iIzMzMyIvPgogIDx0ZXh0IHg9IjMxNiIgeT0iMjIzLjAiIGZvbnQtc2l6ZT0iMTEiIGZpbGw9IiMzMzMiIGZvbnQtc3R5bGU9Iml0YWxpYyI+eDwvdGV4dD4KICA8dGV4dCB4PSI3My4xIiB5PSI2IiBmb250LXNpemU9IjExIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMzMzIiBmb250LXN0eWxlPSJpdGFsaWMiPnk8L3RleHQ+CiAgPGxpbmUgeDE9IjEzOS40IiB5MT0iMjE2LjAiIHgyPSIxMzkuNCIgeTI9IjIyMi4wIiBzdHJva2U9IiM4ODgiIHN0cm9rZS13aWR0aD0iMC44Ii8+PHRleHQgeD0iMTM5LjQiIHk9IjIzMi4wIiBmb250LXNpemU9IjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM4ODgiPjI8L3RleHQ+PGxpbmUgeDE9IjIwNS42IiB5MT0iMjE2LjAiIHgyPSIyMDUuNiIgeTI9IjIyMi4wIiBzdHJva2U9IiM4ODgiIHN0cm9rZS13aWR0aD0iMC44Ii8+PHRleHQgeD0iMjA1LjYiIHk9IjIzMi4wIiBmb250LXNpemU9IjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM4ODgi )，方程 \\(y = \\frac{2}{3}x\\)。與 \\(3x+2y=13\\) 聯立得交點 \\((3, 2)\\)。","\\(t_{\\min} = 3^2 + 2^2 = 13\\)。"]}]},"2024":{"choices":[{"n":1,"type":"第一類型：基本概念","body":"設集合 \\(A = \\{x: x^2 - 3x - 4 \\leq 0\\}\\)，\\(B = \\{x: 3x + a \\geq 0\\}\\)，且 \\(A \\cap B = \\{x: 2 \\leq x \\leq 4\\}\\)，求 \\(a\\)。","given":["\\(A = \\{x: x^2 - 3x - 4 \\leq 0\\}\\)","\\(B = \\{x: 3x + a \\geq 0\\}\\)","\\(A \\cap B = \\{x: 2 \\leq x \\leq 4\\}\\)"],"options":["\\(-12\\)","\\(-6\\)","\\(-3\\)","\\(6\\)","\\(12\\)"],"answer":1,"hint":"先把 \\(A\\) 的二次不等式因式分解，找出 \\(A\\) 的範圍；再把 \\(B\\) 寫成 \\(x \\geq\\) 某值的形式。交集的左端點就是關鍵。","sol":["先解 \\(A\\)：\\(x^2 - 3x - 4 \\leq 0 \\Rightarrow (x-4)(x+1) \\leq 0\\)，得 \\(A = \\{x: -1 \\leq x \\leq 4\\}\\)。","\\(B = \\{x: 3x + a \\geq 0\\} = \\{x: x \\geq -\\frac{a}{3}\\}\\)。","因為 \\(A \\cap B = \\{x: 2 \\leq x \\leq 4\\}\\)，所以 \\(B\\) 的左端點 \\(-\\frac{a}{3} = 2\\)。","解得 \\(a = -6\\)。"]},{"n":2,"type":"第十五類型：函數圖形","body":"已知對於所有實數 \\(x\\)，\\(f(x) = f(x + 1) + 1\\)。如果 \\(f(0) = 16\\)，求 \\(f(15)\\)。","given":["\\(f(x) = f(x + 1) + 1\\)（對所有實數 \\(x\\)）","\\(f(0) = 16\\)"],"options":["\\(0\\)","\\(1\\)","\\(15\\)","\\(16\\)","\\(17\\)"],"answer":1,"hint":"把遞迴式改寫成「\\(f(x+1)\\) 等於 \\(f(x)\\) 減多少」，看看每往後一步，函數值如何變化。","sol":["由 \\(f(x) = f(x+1) + 1\\) 可得 \\(f(x+1) = f(x) - 1\\)，即每增加 1，函數值減少 1。","所以 \\(f(n) = f(0) - n\\)。","\\(f(15) = 16 - 15 = 1\\)。"]},{"n":3,"type":"第三類型：變分","body":"設 \\(x\\) 和 \\(y\\) 滿足 \\(4x + 5y = x(y + 1) - (x - 1)(y - 1)\\)。如果 \\(x\\) 的值增加 4，則 \\(y\\) 的值如何變化？","given":["\\(4x + 5y = x(y + 1) - (x - 1)(y - 1)\\)","\\(x\\) 增加 4"],"options":["減少了 8","減少了 4","減少了 2","增加了 4","增加了 8"],"answer":2,"hint":"先把右邊兩個乘積展開、化簡，會發現 \\(xy\\) 項消掉，整個式子變成 \\(x\\) 與 \\(y\\) 的線性關係，再看 \\(y\\) 對 \\(x\\) 的變化率。","sol":["展開右側：\\(x(y+1) - (x-1)(y-1) = (xy + x) - (xy - x - y + 1) = 2x + y - 1\\)。","所以方程式化為 \\(4x + 5y = 2x + y - 1\\)，整理得 \\(2x + 4y = -1\\)，即 \\(y = -\\frac{1}{2}x - \\frac{1}{4}\\)。","當 \\(x\\) 增加 4，\\(y\\) 的變化量為 \\(-\\frac{1}{2} \\times 4 = -2\\)，即減少 2。"]},{"n":4, (r\\)）"],"options":["\\(x^2 + y^2 - 13 = 0\\)","\\(x^2 + y^2 + 4x - 6y = 0\\)","\\(x^2 + y^2 + 4x + 6y = 0\\)","\\(x^2 + y^2 - 4x - 6y = 0\\)","\\(x^2 + y^2 - 4x - 6y + 13 = 0\\)"],"answer":3,"hint":"與固定點等距的軌跡是圓，圓心就是 \\(P\\)。用「經過原點」這個條件，透過兩點距離求出半徑，再代入圓的標準式並展開。","sol":["\\(M\\) 與固定點 \\(P(2,3)\\) 保持固定距離，軌跡是以 \\(P\\) 為圓心的圓。","圓過原點，半徑 \\(r = |OP| = \\sqrt{2^2 + 3^2} = \\sqrt{13}\\)。","圓方程：\\((x-2)^2 + (y-3)^2 = 13\\)。","展開：\\(x^2 - 4x + 4 + y^2 - 6y + 9 = 13\\)，即 \\(x^2 + y^2 - 4x - 6y = 0\\)。"]},{"n":6,"type":"第八類型：對數與指數函數","body":"求 \\(\\dfrac{3\\log\\frac{1}{2} + \\log 16}{\\log 4 + \\log 5 - 1}\\) 的值。","given":["求 \\(\\dfrac{3\\log\\frac{1}{2} + \\log 16}{\\log 4 + \\log 5 - 1}\\)（\\(\\log\\) 為常用對數，底為 10）"],"formula":["\\(\\log a^n = n\\log a\\)","\\(\\log a + \\log b = \\log(ab)\\)","\\(\\log a - \\log b = \\log\\dfrac{a}{b}\\)","\\(1 = \\log 10\\)"],"options":["\\(1\\)","\\(-1\\)","\\(2\\)","\\(-2\\)","\\(4\\)"],"answer":0,"hint":"用對數運算律把分子、分母各自合併成單一個 \\(\\log\\)。記得把式中的 \\(1\\) 改寫成 \\(\\log 10\\)。","sol":["分子：\\(3\\log\\frac{1}{2} + \\log 16 = \\log\\frac{1}{8} + \\log 16 = \\log\\frac{16}{8} = \\log 2\\)。","分母：\\(\\log 4 + \\log 5 - 1 = \\log 20 - \\log 10 = \\log\\frac{20}{10} = \\log 2\\)。","所以原式 \\(= \\dfrac{\\log 2}{\\log 2} = 1\\)。"]},{"n":7,"type":"第十一類型：數列","body":"等比數列的第 2 項及第 5 項的和是 9，同時第 7 項及第 10 項的和為 288，求數列第 20 項的數值。","given":["等比數列，\\(a_2 + a_5 = 9\\)","\\(a_7 + a_{10} = 288\\)","求 \\(a_{20}\\)"],"formula":["等比數列通項：\\(a_n = a_1 \\cdot r^{\\,n-1}\\)（首項 \\(a_1\\)，公比 \\(r\\)）"],"options":["\\(32768\\)","\\(65536\\)","\\(131072\\)","\\(262144\\)","\\(524288\\)"],"answer":3,"hint":"用通項公式把四項都寫成含 \\(a_1\\) 與 \\(r\\) 的式子，提取公因式後把兩個和式相除，就能先求出 \\(r\\)。","sol":["設首項 \\(a\\)、公比 \\(r\\)。第 2、5 項：\\(ar + ar^4 = ar(1 + r^3) = 9\\)。","第 7、10 項：\\(ar^6 + ar^9 = ar^6(1 + r^3) = 288\\)。","兩式相除：\\(r^5 = \\frac{288}{9} = 32 \\Rightarrow r = 2\\)。","由 \\(ar(1+r^3) = 9\\)：\\(2a(1+8) = 9 \\Rightarrow 18a = 9 \\Rightarrow a = \\frac{1}{2}\\)。","第 20 項 \\(= ar^{19} = \\frac{1}{
