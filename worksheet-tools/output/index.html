sin^2\\theta\\) 代入：\\(1 + \\sin\\theta - 2(1 - \\sin^2\\theta) = 0\\)。","整理：\\(2\\sin^2\\theta + \\sin\\theta - 1 = 0\\)，因式分解 \\((2\\sin\\theta - 1)(\\sin\\theta + 1) = 0\\)。","\\(\\sin\\theta = \\frac{1}{2}\\) 或 \\(\\sin\\theta = -1\\)。","在 \\([0, \\pi)\\) 內，\\(\\sin\\theta = \\frac{1}{2}\\) 得 \\(\\theta = \\frac{\\pi}{6}\\) 或 \\(\\frac{5\\pi}{6}\\)；\\(\\sin\\theta = -1\\) 無解。"]},{"n":14,"type":"第四類型：多項式及有理分式","body":"已知 \\(x^2 - 3x + 1 = 0\\)，求 \\(x^4 + \\dfrac{1}{x^4}\\)。","given":["\\(x^2 - 3x + 1 = 0\\)","求 \\(x^4 + \\dfrac{1}{x^4}\\)"],"formula":["\\(\\left(x + \\dfrac{1}{x}\\right)^2 = x^2 + 2 + \\dfrac{1}{x^2}\\)","\\(\\left(x^2 + \\dfrac{1}{x^2}\\right)^2 = x^4 + 2 + \\dfrac{1}{x^4}\\)"],"options":["\\(2\\)","\\(47\\)","\\(49\\)","\\(79\\)","\\(81\\)"],"answer":1,"hint":"把原方程式整個除以 \\(x\\)，先求出 \\(x + \\frac{1}{x}\\)。然後用平方公式一步步往上推到 \\(x^4 + \\frac{1}{x^4}\\)。","sol":["由 \\(x^2 - 3x + 1 = 0\\) 除以 \\(x\\)：\\(x + \\dfrac{1}{x} = 3\\)。","\\(x^2 + \\dfrac{1}{x^2} = \\left(x + \\dfrac{1}{x}\\right)^2 - 2 = 9 - 2 = 7\\)。","\\(x^4 + \\dfrac{1}{x^4} = \\left(x^2 + \\dfrac{1}{x^2}\\right)^2 - 2 = 49 - 2 = 47\\)。"]},{"n":15,"type":"第十五類型：函數圖形","body":"設函數 \\(f(x)\\) 是定義域為 \\(\\mathbb{R}\\) 的偶函數，且在 \\((-\\infty, 0)\\) 單調遞減，比較下列函數值大小，何者正確？","given":["\\(f(x)\\) 是定義域 \\(\\mathbb{R}\\) 的偶函數","在 \\((-\\infty, 0)\\) 單調遞減","比較 \\(f(2^{-\\frac{7}{3}})\\)、\\(f(3^{-\\frac{2}{7}})\\)、\\(f(\\log_3\\frac{2}{7})\\)"],"formula":["偶函數性質：\\(f(-x) = f(x)\\)，即 \\(f(x) = f(|x|)\\)","偶函數若在 \\((-\\infty,0)\\) 遞減，則在 \\((0,\\infty)\\) 遞增"],"options":["\\(f(2^{-\\frac{7}{3}}) > f(3^{-\\frac{2}{7}}) > f(\\log_3\\frac{2}{7})\\)","\\(f(3^{-\\frac{2}{7}}) > f(\\log_3\\frac{2}{7}) > f(2^{-\\frac{7}{3}})\\)","\\(f(\\log_3\\frac{2}{7}) > f(2^{-\\frac{7}{3}}) > f(3^{-\\frac{2}{7}})\\)","\\(f(3^{-\\frac{2}{7}}) > f(2^{-\\frac{7}{3}}) > f(\\log_3\\frac{2}{7})\\)","\\(f(\\log_3\\frac{2}{7}) > f(3^{-\\frac{2}{7}}) > f(2^{-\\frac{7}{3}})\\)"],"answer":4,"hint":"偶函數的值只看自變數的絕對值，且在正向遞增。所以先比較三個數的絕對值大小，絕對值越大，\\(f\\) 值越大。","sol":["偶函數 \\(f(x) = f(|x|)\\)，且在 \\((-\\infty,0)\\) 遞減，故在 \\((0,\\infty)\\) 遞增。\\(|x|\\) 越大，\\(f\\) 越大。","比較三個自變數的絕對值：\\(2^{-\\frac{7}{3}} \\approx 0.198\\)，\\(3^{-\\frac{2}{7}} \\approx 0.732\\)，\\(\\log_3\\frac{2}{7} \\approx -1.14\\)（絕對值 \\(\\approx 1.14\\)）。","絕對值大小：\\(|\\log_3\\frac{2}{7}| > 3^{-\\frac{2}{7}} > 2^{-\\frac{7}{3}}\\)。","因為在正向遞增，\\(f(\\log_3\\frac{2}{7}) > f(3^{-\\frac{2}{7}}) > f(2^{-\\frac{7}{3}})\\)。"]}],"solutions":[{"n":1,"type":"第十六類型：概率和統計","body":"10 件產品中含有 3 件次品。現隨機抽出 4 件。<br>(a) 求抽出至少有 2 件次品的概率。（4 分）<br>(b) 求抽出的次品數的數學期望。（4 分）","given":["共 10 件產品，其中 3 件次品、7 件正品","隨機抽出 4 件","(a) 求至少 2 件次品的概率；(b) 求次品數的期望值"],"formula":["超幾何概率：\\(P(X=k) = \\dfrac{\\binom{K}{k}\\binom{N-K}{n-k}}{\\binom{N}{n}}\\)","數學期望：\\(E(X) = \\displaystyle\\sum_k k \\cdot P(X=k)\\)","組合數：\\(\\binom{n}{k} = \\dfrac{n!}{k!\\,(n-k)!}\\)"],"hint":"設次品數為 \\(X\\)。(a) 把「至少 2 件」拆成「恰 2 件」加「恰 3 件」，各用超幾何公式算。(b) 先算 \\(X=0,1,2,3\\) 各自的機率，再用期望值公式加總。","sol":["設抽出的次品數為 \\(X\\)。","<b>(a)</b> 恰 2 件次品：\\(P(X=2) = \\dfrac{\\binom{3}{2}\\binom{7}{2}}{\\binom{10}{4}} = \\dfrac{3}{10}\\)；恰 3 件：\\(P(X=3) = \\dfrac{\\binom{3}{3}\\binom{7}{1}}{\\binom{10}{4}} = \\dfrac{1}{30}\\)。","至少 2 件：\\(P(X \\geq 2) = \\dfrac{3}{10} + \\dfrac{1}{30} = \\dfrac{1}{3}\\)。","<b>(b)</b> \\(P(X=0) = \\dfrac{1}{6}\\)，\\(P(X=1) = \\dfrac{1}{2}\\)。","期望值 \\(E(X) = 1 \\cdot \\dfrac{1}{2} + 2 \\cdot \\dfrac{3}{10} + 3 \\cdot \\dfrac{1}{30} = \\dfrac{6}{5}\\)。"]},{"n":2,"type":"第十三類型：三角","body":"已知 \\(\\alpha, \\beta \\in \\left(0, \\dfrac{\\pi}{2}\\right)\\)，\\(\\tan\\alpha = \\dfrac{1}{5}\\)，\\(\\cos\\beta = \\dfrac{3\\sqrt{13}}{13}\\)。<br>(a) 求 \\(\\tan(\\alpha + \\beta)\\) 的值。（4 分）<br>(b) 求 \\(\\cos(\\alpha + 2\\beta)\\) 的值。（4 分）","given":["\\(\\alpha, \\beta \\in \\left(0, \\dfrac{\\pi}{2}\\right)\\)","\\(\\tan\\alpha = \\dfrac{1}{5}\\)，\\(\\cos\\beta = \\dfrac{3\\sqrt{13}}{13}\\)","(a) 求 \\(\\tan(\\alpha+\\beta)\\)；(b) 求 \\(\\cos(\\alpha+2\\beta)\\)"],"formula":["平方關係：\\(\\sin^2\\beta + \\cos^2\\beta = 1\\)","商數關係：\\(\\tan\\beta = \\dfrac{\\sin\\beta}{\\cos\\beta}\\)","和角正切：\\(\\tan(\\alpha+\\beta) = \\dfrac{\\tan\\alpha + \\tan\\beta}{1 - \\tan\\alpha\\tan\\beta}\\)","和角餘弦：\\(\\cos(A+B) = \\cos A\\cos B - \\sin A\\sin B\\)"],"hint":"先由 \\(\\cos\\beta\\) 用平方關係求 \\(\\sin\\beta\\)，再用商數關係求 \\(\\tan\\beta\\)。(a) 直接套和角正切公式。(b) 把 \\(\\alpha+2\\beta\\) 拆成 \\((\\alpha+\\beta)+\\beta\\)，利用 (a) 的結果。","sol":["因為 \\(\\beta \\in (0, \\frac{\\pi}{2})\\) 且 \\(\\cos\\beta = \\frac{3\\sqrt{13}}{13}\\)，由平方關係 \\(\\sin\\beta = \\frac{2\\sqrt{13}}{13}\\)，再由商數關係 \\(\\tan\\beta = \\frac{2}{3}\\)。","<b>(a)</b> \\(\\tan(\\alpha+\\beta) = \\dfrac{\\tan\\alpha + \\tan\\beta}{1 - \\tan\\alpha\\tan\\beta} = \\dfrac{\\frac{1}{5} + \\frac{2}{3}}{1 - \\frac{1}{5}\\cdot\\frac{2}{3}} = 1\\)。","<b>(b)</b> 由 (a)，\\(\\alpha + \\beta = \\frac{\\pi}{4}\\)。","\\(\\cos(\\alpha + 2\\beta) = \\cos[(\\alpha+\\beta) + \\beta] = \\cos(\\beta + \\frac{\\pi}{4}) = \\frac{\\sqrt{2}}{2}(\\cos\\beta - \\sin\\beta) = \\dfrac{\\sqrt{26}}{26}\\)。"]},{"n":3,"type":"第十一類型：數列","body":"已知等差數列 \\(\\{a_n\\}_{n \\geq 1}\\) 中 \\(a_1 = 3\\)，並且 \\(a_1, a_2, a_5\\) 成等比數列。<br>(a) 求 \\(\\{a_n\\}_{n \\geq 1}\\) 的通項公式。（4 分）<br>(b) 設 \\(S_n\\) 為前 \\(n\\) 項和，是否存在正整數 \\(n\\) 使得 \\(S_n \\geq 12n + 36\\)？若存在，求 \\(n\\) 的最小值。（4 分）","given":["等差數列 \\(\\{a_n\\}\\)，\\(a_1 = 3\\)","\\(a_1, a_2, a_5\\) 成等比數列","(a) 求通項；(b) 求滿足 \\(S_n \\geq 12n+36\\) 的最小正整數 \\(n\\)"],"formula":["等差通項：\\(a_n = a_1 + (n-1)d\\)","等差求和：\\(S_n = \\dfrac{n(a_1 + a_n)}{2} = na_1 + \\dfrac{n(n-1)}{2}d\\)","等比中項：若 \\(a, b, c\\) 成等比，則 \\(b^2 = ac\\)"],"hint":"(a) 用等差通項把 \\(a_2, a_5\\) 寫成含公差 \\(d\\) 的式子，再用等比中項關係 \\(a_2^2 = a_1 a_5\\) 解出 \\(d\\)。(b) 用求和公式寫出 \\(S_n\\)，代入不等式解。","sol":["<b>(a)</b> 設公差為 \\(d\\)。\\(a_2 = 3 + d\\)，\\(a_5 = 3 + 4d\\)。","由等比中項 \\(a_2^2 = a_1 a_5\\)：\\((3+d)^2 = 3(3+4d)\\)，解得 \\(d = 0\\) 或 \\(d = 6\\)。","故 \\(a_n = 3\\)（當 \\(d=0\\)）或 \\(a_n = 6n - 3\\)（當 \\(d=6\\)）。","<b>(b)</b> 對應 \\(S_n = 3n\\) 或 \\(S_n = 3n^2\\)。","當 \\(S_n = 3n\\)：無正整數 \\(n\\) 滿足。當 \\(S_n = 3n^2\\)：須 \\(3n^2 \\geq 12n + 36\\)，即 \\(n \\geq 6\\)。","所以最小值 \\(n = 6\\)。"]},{"n":4,"type":"第七類型：代數不等式","body":"設函數 \\(f(x) = a - |x - 3| - |x - 7|\\)。<br>(a) 當 \\(a = 8\\) 時，求解不等式 \\(f(x) \\geq 0\\)。（4 分）<br>(b) 如果 \\(g(x) = x f(x)\\) 在閉區間 \\([-1, 1]\\) 上有最小值 \\(-1\\)，求 \\(a\\) 的值。（4 分）","given":["\\(f(x) = a - |x - 3| - |x - 7|\\)","(a) \\(a = 8\\) 時解 \\(f(x) \\geq 0\\)","(b) \\(g(x) = xf(x)\\) 在 \\([-1,1]\\) 上最小值為 \\(-1\\)，求 \\(a\\)"],"formula":["絕對值意義：\\(|x - c|\\) 表示 \\(x\\) 到 \\(c\\) 的距離","二次函數 \\(y = ax^2 + bx + c\\) 的對稱軸：\\(x = -\\dfrac{b}{2a}\\)","頂點 \\(y\\) 值（\\(a>0\\) 時為最小值）：\\(y = c - \\dfrac{b^2}{4a}\\)"],"hint":"(a) \\(f(x)\\geq 0\\) 等於兩段絕對值的和 \\(\\leq 8\\)，用距離意義思考。(b) 在 \\([-1,1]\\) 內 \\(x<3<7\\)，可把絕對值拆掉化簡 \\(f\\)，得到二次的 \\(g(x)\\)，再依對稱軸位置討論最小值。","sol":["<b>(a)</b> \\(f(x) \\geq 0\\) 即 \\(|x-3| + |x-7| \\leq 8\\)（\\(x\\) 到 3 與 7 的距離和不超過 8）。","解得 \\(1 \\leq x \\leq 9\\)。","<b>(b)</b> 在 \\([-1,1]\\) 上，\\(x < 3 < 7\\)，故 \\(f(x) = a - (3-x) - (7-x) = 2x + (a-10)\\)。","\\(g(x) = xf(x) = 2x^2 + (a-10)x\\)，對稱軸 \\(x_0 = -\\dfrac{a-10}{4}\\)。","當 \\(x_0 \\in [-1,1]\\)（即 \\(a \\in [6,14]\\)）：最小值 \\(-\\dfrac{(a-10)^2}{8} = -1\\)，得 \\(a = 10 \\pm 2\\sqrt{2}\\)（皆在範圍內）。","端點情形 \\(a \\leq 6\\) 得 \\(a=7\\)、\\(a \\geq 14\\) 得 \\(a=13\\)，皆與假設矛盾。","所以 \\(a = 10 \\pm 2\\sqrt{2}\\)。"]},{"n":5,"type":"第十四類型：解析幾何","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzODAiIGhlaWdodD0iMzgwIiB2aWV3Qm94PSIwIDAgMzgwIDM4MCIgZm9udC1mYW1pbHk9IidOb3RvIFNlcmlmIFRDJywnTm90byBTZXJpZiBDSksgVEMnLCdTb25ndGkgVEMnLCdNaWNyb3NvZnQgSmhlbmdIZWknLCdQaW5nRmFuZyBUQycsc2VyaWYiPgogIDxyZWN0IHdpZHRoPSIzODAiIGhlaWdodD0iMzgwIiBmaWxsPSJ3aGl0ZSIvPgogIDxsaW5lIHgxPSIyMCIgeTE9IjI5NS44IiB4Mj0iMzY4IiB5Mj0iMjk1LjgiIHN0cm9rZT0iIzMzMyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4KICA8cG9seWdvbiBwb2ludHM9IjM2OCwyOTUuOCAzNjAsMjk5LjMgMzYwLDI5Mi4zIiBmaWxsPSIjMzMzIi8+CiAgPGxpbmUgeDE9IjEwMi4zIiB5MT0iMzY1IiB4Mj0iMTAyLjMiIHkyPSIxMiIgc3Ryb2tlPSIjMzMzIiBzdHJva2Utd2lkdGg9IjEuNSIvPgog function typeset(el){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]); }
function givenBox(given){
  if(!given || !given.length) return "";
  let h = '<div class="given"><div class="given-head">\u5df2\u77e5\u689d\u4ef6</div><ul>';
  given.forEach(g => { h += `<li>${g}</li>`; });
  return h + "</ul></div>";
}
function togglePanel(btn, panel, openText, closeText){
  const open = panel.classList.toggle("show");
  btn.innerHTML = open ? closeText : openText;
  if(open) typeset(panel);
}
function cCount(y){ return ALL[y].choices.length; }

function buildChoiceCard(q){
  const card = document.createElement("div"); card.className = "q";
  let html = `<div class="q-top"><span class="q-no">${q.n}</span><span class="q-type">${q.type}</span></div>`;
  html += `<div class="q-body">${q.body}</div>`;
  if(q.img) html += `<div class="q-img"><img src="${q.img}" alt="\u7b2c${q.n}\u984c\u5716\u793a"></div>`;
  html += givenBox(q.given);
  html += `<div class="opts" id="opts-0"></div>`;
  html += `<div class="help-bar" id="help-0"></div>`;
  if(q.formula && q.formula.length){
    html += `<div class="panel formula" id="formula-0"><div class="panel-head">\u76f8\u95dc\u516c\u5f0f</div><div class="formula-list">`;
    q.formula.forEach(f => { html += `<div class="formula-item">${f}</div>`; });
    html += `</div></div>`;
  }
  html += `<div class="panel hint" id="hint-0"><div class="panel-head">\u65b9\u5411\u63d0\u793a</div><div class="hint-text">${q.hint || ""}</div></div>`;
  html += `<div class="panel feedback" id="fb-0"></div>`;
  card.innerHTML = html;
  const opts = card.querySelector("#opts-0");
  (q.options || []).forEach((opt, oi) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="opt-key">${KEYS[oi]}</span><span class="opt-text">${opt}</span>`;
    b.onclick = () => chooseSingle(q, oi);
    opts.appendChild(b);
  });
  const help = card.querySelector("#help-0");
  if(q.formula && q.formula.length){
    const fb = document.createElement("button");
    fb.className = "help-btn formula";
    fb.innerHTML = '<span class="ic">\ud835\udc53</span> \u986f\u793a\u516c\u5f0f';
    fb.onclick = () => togglePanel(fb, card.querySelector("#formula-0"), '<span class="ic">\ud835\udc53</span> \u986f\u793a\u516c\u5f0f', '<span class="ic">\ud835\udc53</span> \u96b1\u85cf\u516c\u5f0f');
    help.appendChild(fb);
  }
  const hb = document.createElement("button");
  hb.className = "help-btn hint";
  hb.innerHTML = '<span class="ic">\u25d4</span> \u65b9\u5411\u63d0\u793a';
  hb.onclick = () => togglePanel(hb, card.querySelector("#hint-0"), '<span class="ic">\u25d4</span> \u65b9\u5411\u63d0\u793a', '<span class="ic">\u25d4</span> \u96b1\u85cf\u63d0\u793a');
  help.appendChild(hb);
  return card;
}
function applyChoiceState(q, oi){
  document.querySelectorAll("#opts-0 .opt").forEach((b, i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add("correct");
    else if(i === oi) b.classList.add("wrong");
  });
  const fb = document.getElementById("fb-0");
  const right = oi === q.answer;
  fb.className = "panel feedback show " + (right ? "right" : "wrongbg");
  let verdict = right
    ? `<div class="fb-verdict">\u2713 \u7b54\u5c0d\u4e86\uff01\u6b63\u78ba\u7b54\u6848\uff1a${KEYS[q.answer]}</div>`
    : `<div class="fb-verdict">\u2717 \u518d\u60f3\u60f3\u770b\u3002\u6b63\u78ba\u7b54\u6848\u662f ${KEYS[q.answer]}\uff0c\u770b\u770b\u4e0b\u9762\u7684\u6b65\u9a5f\u3002</div>`;
  let steps = '<div class="panel-head">\u5b8c\u6574\u8a73\u89e3</div><div class="sol-steps">';
  (q.sol || []).forEach(s => { steps += `<div class="sol-step">${s}</div>`; });
  fb.innerHTML = verdict + steps + "</div>";
  typeset(fb);
}
function chooseSingle(q, oi){
  const akey = curYear + "|c|" + curIdx;
  if(answered[akey] !== undefined) return;
  answered[akey] = oi;
  applyChoiceState(q, oi);
}
function buildSolutionCard(q){
  const card = document.createElement("div"); card.className = "q";
  let html = `<div class="q-top"><span class="q-no">${q.n}</span><span class="q-type">${q.type}</span></div>`;
  html += `<div class="q-body">${q.body}</div>`;
  if(q.img) html += `<div class="q-img"><img src="${q.img}" alt="\u89e3\u7b54\u7b2c${q.n}\u984c\u5716\u793a"></div>`;
  html += givenBox(q.given);
  html += `<div class="help-bar" id="shelp-0"></div>`;
  if(q.formula && q.formula.length){
    html += `<div class="panel formula" id="sformula-0"><div class="panel-head">\u76f8\u95dc\u516c\u5f0f</div><div class="formula-list">`;
    q.formula.forEach(f => { html += `<div class="formula-item">${f}</div>`; });
    html += `</div></div>`;
  }
  html += `<div class="panel hint" id="shint-0"><div class="panel-head">\u65b9\u5411\u63d0\u793a</div><div class="hint-text">${q.hint || ""}</div></div>`;
  html += `<div class="panel solution" id="ssol-0"><div class="panel-head">\u53c3\u8003\u89e3\u7b54</div><div class="sol-steps" id="sstep-0"></div></div>`;
  card.innerHTML = html;
  const steps = card.querySelector("#sstep-0");
  (q.sol || []).forEach(s => { const d = document.createElement("div"); d.className = "sol-step"; d.innerHTML = s; steps.appendChild(d); });
  const help = card.querySelector("#shelp-0");
  if(q.formula && q.formula.length){
    const fb = document.createElement("button");
    fb.className = "help-btn formula";
    fb.innerHTML = '<span class="ic">\ud835\udc53</span> \u986f\u793a\u516c\u5f0f';
    fb.onclick = () => togglePanel(fb, card.querySelector("#sformula-0"), '<span class="ic">\ud835\udc53</span> \u986f\u793a\u516c\u5f0f', '<span class="ic">\ud835\udc53</span> \u96b1\u85cf\u516c\u5f0f');
    help.appendChild(fb);
  }
  const hb = document.createElement("button");
  hb.className = "help-btn hint";
  hb.innerHTML = '<span class="ic">\u25d4</span> \u65b9\u5411\u63d0\u793a';
  hb.onclick = () => togglePanel(hb, card.querySelector("#shint-0"), '<span class="ic">\u25d4</span> \u65b9\u5411\u63d0\u793a', '<span class="ic">\u25d4</span> \u96b1\u85cf\u63d0\u793a');
  help.appendChild(hb);
  const sb = document.createElement("button");
  sb.className = "help-btn";
  sb.innerHTML = '\u25b8 \u5b8c\u6574\u89e3\u7b54';
  sb.onclick = () => togglePanel(sb, card.querySelector("#ssol-0"), '\u25b8 \u5b8c\u6574\u89e3\u7b54', '\u25be \u96b1\u85cf\u89e3\u7b54');
  help.appendChild(sb);
  return card;
}
function fillNum(kindVal, yearVal, sel){
  const n = (kindVal === "choice") ? ALL[yearVal].choices.length : ALL[yearVal].solutions.length;
  sel.innerHTML = "";
  for(let i = 1; i <= n; i++){ const o = document.createElement("option"); o.value = i; o.textContent = "\u7b2c " + i + " \u984c"; sel.appendChild(o); }
}
function syncControls(){
  document.getElementById("yearSel").value = curYear;
  document.getElementById("kindSel").value = curKind;
  fillNum(curKind, curYear, document.getElementById("numSel"));
  document.getElementById("numSel").value = curIdx + 1;
}
function posOf(){ return curKind === "choice" ? curIdx : cCount(curYear) + curIdx; }
function setPos(p){ const cc = cCount(curYear); if(p < cc){ curKind = "choice"; curIdx = p; } else { curKind = "solution"; curIdx = p - cc; } }
function updateNav(){
  const p = posOf(); const last = cCount(curYear) + sCount(curYear) - 1;
  document.getElementById("prevBtn").hidden = (p === 0);
  document.getElementById("nextBtn").hidden = (p === last);
}
function go(delta){
  const last = cCount(curYear) + sCount(curYear) - 1;
  const p = posOf() + delta;
  if(p < 0 || p > last) return;
  setPos(p); renderSingle();
}
function renderSingle(){
  const area = document.getElementById("single");
  area.innerHTML = "";
  let q, card;
  if(curKind === "choice"){ q = ALL[curYear].choices[curIdx]; card = buildChoiceCard(q); }
  else { q = ALL[curYear].solutions[curIdx]; card = buildSolutionCard(q); }
  document.getElementById("singleHead").textContent = `${curYear} \u5e74 \u00b7 ${curKind === "choice" ? "\u9078\u64c7\u984c" : "\u89e3\u7b54\u984c"} \u7b2c ${curIdx + 1} \u984c`;
  area.appendChild(card);
  typeset(card);
  if(curKind === "choice"){
    const akey = curYear + "|c|" + curIdx;
    if(answered[akey] !== undefined) applyChoiceState(q, answered[akey]);
  }
  syncControls();
  updateNav();
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}
document.getElementById("findBtn").onclick = () => {
  const ys = document.getElementById("yearSel"), ks = document.getElementById("kindSel"), ns = document.getElementById("numSel");
  curYear = ys.value; curKind = ks.value;
  let idx = parseInt(ns.value, 10) - 1;
  const max = ((curKind === "choice") ? cCount(curYear) : sCount(curYear)) - 1;
  if(isNaN(idx) || idx < 0) idx = 0;
  if(idx > max) idx = max;
  curIdx = idx;
  renderSingle();
};
document.getElementById("prevBtn").onclick = () => go(-1);
document.getElementById("nextBtn").onclick = () => go(1);
document.getElementById("kindSel").onchange = () => fillNum(document.getElementById("kindSel").value, document.getElementById("yearSel").value, document.getElementById("numSel"));
document.getElementById("yearSel").onchange = () => fillNum(document.getElementById("kindSel").value, document.getElementById("yearSel").value, document.getElementById("numSel"));

/* 主題：載入時由 localStorage 還原，切換時寫回。選色器收入 popover，
   令四個選項各有 44px 觸控目標，唔使同尋找列爭位。 */
const THEME_KEY = "fsm-theme";
const setBtn = document.getElementById("setBtn");
const setMenu = document.getElementById("setMenu");
const themeBtns = document.querySelectorAll(".theme-btn");

function markTheme(name){
  themeBtns.forEach(b => b.setAttribute("aria-checked", String(b.dataset.set === name)));
}
function applyTheme(name){
  document.body.setAttribute("data-theme", name);
  markTheme(name);
  try { localStorage.setItem(THEME_KEY, name); } catch(e) { /* 私隱模式下靜默失敗 */ }
}
function openMenu(){ setMenu.hidden = false; setBtn.setAttribute("aria-expanded", "true"); }
function closeMenu(){ setMenu.hidden = true; setBtn.setAttribute("aria-expanded", "false"); }

setBtn.onclick = (e) => { e.stopPropagation(); setMenu.hidden ? openMenu() : closeMenu(); };
themeBtns.forEach(btn => {
  btn.onclick = () => { applyTheme(btn.dataset.set); closeMenu(); setBtn.focus(); };
});
document.addEventListener("click", (e) => {
  if(!setMenu.hidden && !setMenu.contains(e.target) && !setBtn.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && !setMenu.hidden){ closeMenu(); setBtn.focus(); }
});
markTheme(document.body.getAttribute("data-theme"));

(function init(){
  const ys = document.getElementById("yearSel");
  YEARS.forEach(y => { const o = document.createElement("option"); o.value = y; o.textContent = y + " \u5e74"; ys.appendChild(o); });
  ys.value = curYear;
  fillNum("choice", curYear, document.getElementById("numSel"));
  renderSingle();
})();
if(window.MathJax && MathJax.startup) MathJax.startup.promise.then(() => MathJax.typesetPromise());
</script>
